# The rig agent's plugins, added in this order. `rig build`, or /reload in
# the agent, applies changes. CARGO_BUILD_JOBS sets cargo's -j for them.

# Each [[plugin]] names a type implementing Bevy's Plugin + Default
# (`plugin`) and the package it is in (`crate`), with at most one source:
# `path` (relative to this file), `git` (with an optional `branch` or
# `rev`) or `version`. An entry without one is one of rig's own plugin
# crates, at the launcher's version: from crates.io, or from the rig
# checkout the agent is built from (RIG_SOURCE). The harness
# (the session and the launcher protocol) is always there; every entry
# below can go. A commented-out entry is a disabled one, and the comment
# above an entry is its description: `rig plugin list` and /plugins show
# them, and `rig plugin enable` and `disable` turn entries on and off.
# `rig plugin new <name>` makes a plugin crate in plugins/<name> and adds
# its entry; `rig plugin check` checks this file.

# rig's own system prompt: one fixed text, so the prompt cache keeps it.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::prompt::DefaultPromptPlugin"

# The AGENTS.md files of the working directory and the directories above it
# up to the repository root, and RIG_HOME/AGENTS.md, in the system prompt.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::agents_md::AgentsMdPlugin"

# Skills: each SKILL.md in .rig/skills and .agents/skills (up to the
# repository root), RIG_HOME/skills and ~/.agents/skills, listed in the
# system prompt for the model to read, and /skill:<name>.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::skills::SkillsPlugin"

# /model, /effort and the model picker.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::models::ModelsPlugin"

# /login and /logout: the ChatGPT plan, and providers' API keys.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::login::LoginPlugin"

# The model and reasoning a new session starts with: the last ones chosen.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::models::defaults::DefaultsPlugin"

# /new, /resume and /name.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::sessions::SessionsPlugin"

# /fork, /agents and rewind (Alt+Up to an earlier message of yours, then Enter): the agents of this session.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::sessions::agents::AgentsPlugin"

# Summarizing a conversation near the context window, and /compact.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::compaction::CompactionPlugin"

# What model calls cost, and /usage.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::telemetry::usage::UsagePlugin"

# With --traffic-log or [traffic] log = true, provider HTTP in traffic.jsonl.
[[plugin]]
crate = "rig-traffic"
plugin = "rig_traffic::TrafficPlugin"

# What each agent is doing, for views.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::activity::ActivityPlugin"

# The tools: read, edit, write and shell.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::ReadTool"

[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::EditTool"

[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::WriteTool"

[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::ShellTool"

# Files named as @path in what the user types go with the message.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::AttachPlugin"

# Paths written HOST:PATH reach the hosts [remote.hosts] in settings.toml
# names (ssh, koh exec, ...); nothing without hosts.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::coding_tools::remote::RemoteHostsPlugin"

# One question for every effect a plugin wants approved; nothing asks by default. SubagentsPlugin adds it.
# [[plugin]]
# crate = "rig-basics"
# plugin = "rig_basics::approval::ApprovalPlugin"

# What a tool call would change on disk, before it runs, for gates that ask (Preview).
# [[plugin]]
# crate = "rig-basics"
# plugin = "rig_basics::preview::PreviewPlugin"

# What each tool call changed on disk (FilesChanged), with snapshots before and after.
# [[plugin]]
# crate = "rig-basics"
# plugin = "rig_basics::checkpoint::CheckpointPlugin"

# /reload and the reload tool, with which the agent rebuilds itself, and the
# system prompt's fixed section on how the agent writes plugins.
# Without it the agent runs the build it started with.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::reload::ReloadPlugin"

# /plugins: every plugin here, enabled and disabled, to turn on and off;
# applying rebuilds the agent at once.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::reload::plugins::PluginsPlugin"

# /help, /retry and /quit.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::BasicCommandsPlugin"

# The welcome at the top of the transcript: rig's mark, its version, the
# model and the project's directory. Never sent to the model.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::welcome::WelcomePlugin"

# The inspect tool, with which the agent reads its own running world; it pulls in Bevy Remote, a heavier build, and on Linux the ALSA headers.
# [[plugin]]
# crate = "rig-inspect"
# plugin = "rig_inspect::InspectPlugin"

# -p and --json: answers one prompt, or what is piped in, and drives the
# agent with JSON lines on stdin and stdout; the front of every run that is
# not on an interactive terminal.
[[plugin]]
crate = "rig-basics"
plugin = "rig_basics::print::PrintPlugin"

# The terminal view, the front of a run on an interactive terminal. Without
# it the agent answers -p or what is piped in, and says so when started on
# a terminal.
[[plugin]]
crate = "rig-tui"
plugin = "rig_tui::TuiPlugin"

