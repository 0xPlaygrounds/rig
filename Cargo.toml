# The bundled websocket backend is native-only (tungstenite needs a tokio
# reactor and raises a `compile_error!` on wasm), so it is scoped to non-wasm
# targets. That is what lets `websocket` mean "the protocol, plus the bundled
# backend where one exists": on wasm the feature still enables
# `rig-core/websocket`, so `rig::ws_client` is reachable and a browser backend
# can be implemented against it — which is the escape hatch the backend's own
# wasm error message prescribes. Wiring the dependency unconditionally would
# make that hatch unreachable through the facade.
#
# Not `default-features = false`, unlike the other optional companions: the
# backend's own `default = ["rustls"]` is what guarantees that enabling
# `websocket` always yields a socket that can do `wss://`. Turning defaults off
# here would let `--no-default-features --features websocket` compile a
# TLS-less backend that fails every handshake at runtime.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-tungstenite = { path = "crates/rig-tungstenite", version = "0.42.0", optional = true }

