[features]
default = ["rig-core/default", "reqwest", "agent", "derive", "rustls"]
agent = ["dep:rig-agent"]
test-utils = ["rig-core/test-utils", "rig-agent?/test-utils"]
# Internal: opt in to the slow nested-`cargo check` facade build tests
# (`tests/tool_facade_features.rs`). Not in `default`; `--all-features` (CI's
# lane) enables it so the guard still runs, while ad-hoc `cargo test` skips it.
facade-build-tests = []
bedrock = ["dep:rig-bedrock"]
candle = ["dep:rig-candle"]
fastembed = [
  "dep:rig-fastembed",
  "rig-fastembed/hf-hub",
  "rig-fastembed/ort-download-binaries",
]
fastembed-hf-hub = ["dep:rig-fastembed", "rig-fastembed/hf-hub"]
fastembed-ort-download-binaries = ["dep:rig-fastembed", "rig-fastembed/ort-download-binaries"]
gemini-grpc = ["dep:rig-gemini-grpc"]
helixdb = ["dep:rig-helixdb"]
lancedb = ["dep:rig-lancedb", "dep:lancedb"]
memory = ["dep:rig-memory"]
milvus = ["dep:rig-milvus"]
mongodb = ["dep:rig-mongodb"]
neo4j = ["dep:rig-neo4j"]
postgres = ["dep:rig-postgres"]
qdrant = ["dep:rig-qdrant"]
s3vectors = ["dep:rig-s3vectors"]
scylladb = ["dep:rig-scylladb"]
sqlite = ["dep:rig-sqlite"]
surrealdb = ["dep:rig-surrealdb"]
vectorize = ["dep:rig-vectorize"]
vertexai = ["dep:rig-vertexai"]
audio = ["rig-core/audio", "rig-agent?/audio", "rig-reqwest?/audio"]
image = ["rig-core/image", "rig-agent?/image", "rig-reqwest?/image"]
derive = ["dep:rig-derive", "rig-core/derive", "rig-agent?/derive"]
pdf = ["rig-core/pdf"]
epub = ["rig-core/epub"]
rayon = ["rig-core/rayon"]
rmcp = ["dep:rig-rmcp"]
socks = ["reqwest", "rig-reqwest/socks"]
reqwest = ["dep:rig-reqwest"]
# The bundled websocket backend (`rig-tungstenite`) and the provider websocket
# sessions it drives. Independent of the HTTP transport axis: a session borrows
# the provider client for its request mapping, so `reqwest` comes along for the
# client, not for the socket.
#
# `websocket` is the API gate — it is what `pub use rig_tungstenite` and the
# prelude re-export are cfg'd on — and each of the three spellings is usable on
# its own. `rig-tungstenite`'s own `default = ["rustls"]` applies (see its
# dependency line), so `websocket` always has a working TLS stack; the
# `websocket-*-tls` spellings add the workspace-wide TLS feature on top, which
# is also what wires the backend up for `native-tls`.
#
# Additive features cannot express "replace rustls with native-tls": a
# native-tls-ONLY socket means depending on `rig-tungstenite` directly with
# `default-features = false, features = ["native-tls"]`. Through the facade,
# `websocket-native-tls` gets you a working native-tls socket with rustls also
# compiled in. That trade is deliberate — a build that silently cannot speak
# `wss://` is worse than one that compiles a TLS stack it does not use.
websocket = ["reqwest", "dep:rig-tungstenite", "rig-core/websocket"]
# `dep:rig-tungstenite` above resolves to nothing on wasm, where the dependency
# is not in the graph: the feature degrades to the protocol alone.
websocket-rustls = ["websocket", "rustls"]
websocket-native-tls = ["websocket", "native-tls"]
rustls = [
  "rig-reqwest?/rustls",
  "rig-tungstenite?/rustls",
  "rig-fastembed?/hf-hub-rustls-tls",
  "rig-helixdb?/rustls",
  "rig-lancedb?/rig-rustls",
  "rig-milvus?/rustls",
]
native-tls = [
  "rig-reqwest?/native-tls",
  "rig-tungstenite?/native-tls",
  "rig-fastembed?/hf-hub-native-tls",
  "rig-helixdb?/native-tls",
  "rig-lancedb?/rig-native-tls",
  "rig-milvus?/native-tls",
]
reqwest-middleware = ["reqwest", "rig-reqwest/reqwest-middleware"]
reqwest-middleware-rustls = ["reqwest", "rig-reqwest/reqwest-middleware-rustls"]
reqwest-middleware-native-tls = ["reqwest", "rig-reqwest/reqwest-middleware-native-tls"]
