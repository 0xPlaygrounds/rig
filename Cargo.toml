[package]
name = "rig"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
# Examples now live in their own packages under `examples/*`; don't auto-discover
# them as examples of this crate.
autoexamples = false
# This package's own `src/` is ~12 KiB of re-exports, but the manifest sits at the
# repo root, so every sibling path is swept into the published tarball, including
# the 1,100+ provider cassettes. They grew the crate from 6.66 MiB at 0.39.0 to
# 9.51 MiB today, against a crates.io upload limit of 10 MiB: the next release was
# on track to be rejected outright. That limit is enforced server-side, so no
# amount of `cargo publish --dry-run` surfaces it. Excluding the cassettes drops
# the tarball to 3.33 MiB. They are replay fixtures the test binaries read at
# runtime from `CARGO_MANIFEST_DIR`, never embedded with `include_*!`, so nothing
# in the package needs them to compile.
exclude = ["tests/cassettes/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
    "xtask",
]
# The root manifest is itself the `rig` facade package, so without an
# explicit `default-members` a bare `cargo nextest run` resolved to the
# facade alone and every `crates/*` unit test ran only where a CI step named
# its package (#2258: ~1,200 rig-core lib unit tests executed in no step).
# The default set is the facade plus the crates whose unit tests must always
# run; the service-backed vector-store integrations and examples stay
# opt-in.
# rig-derive is deliberately absent: a proc-macro crate's test binary links
# libstd dynamically, which breaks under toolchains installed without the
# dylib component. Absent from the default set is not absent from CI — its
# own suite (trybuild cases and the dependency-rename fixtures) runs in the
# `stable / test rig-derive` job, which names `-p rig-derive` explicitly, and
# the macro-hygiene consumer runs in the `test guards` job's
# `cargo test -p rig-core --test macro_hygiene` step. Both are required for
# this exclusion to stay honest: until the first existed, every test in
# rig-derive ran nowhere.
default-members = [
    ".",
    "crates/rig-core",
    "crates/rig-agent",
    "crates/rig-reqwest",
    "crates/rig-tungstenite",
    "crates/rig-bedrock",
    "crates/rig-candle",
    "crates/rig-gemini-grpc",
]
exclude = [
    "archived",
    # Data/infra dirs under examples/ that are not Cargo packages.
    "examples/documents",
    "examples/otel",
    # Its own workspace: `serenity` is the only published Discord client and
    # pins a `rustls` major with four unpatched `rustls-webpki` advisories.
    # Excluding it keeps that subtree out of the workspace lockfile.
    "examples/discord_bot",
]

[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = "s"


[workspace.package]
version = "0.42.0"
edition = "2024"

[workspace.dependencies]
# Every requirement below is a FLOOR, not a pin: `tokio = "1"` means `^1`,
# and a downstream resolves anywhere inside that range — usually to whatever
# its own lockfile already holds. So each floor is the lowest version rig's
# own code needs, to the best it can be verified: a bare major (or `0.minor`)
# where rig uses only long-stable API, and `major.minor[.patch]` only where a
# feature or API rig relies on first appeared (each such floor says which).
# Do not raise a floor because a newer release exists — Dependabot is
# configured (`versioning-strategy: increase-if-necessary`) to move only
# `Cargo.lock` for in-range releases, and every rig release used to ship the
# raised floors, forcing downstream users to `cargo update` a dozen crates
# just to take a point release (#2195). Raise a floor when rig starts using
# an API the old floor lacks, and say so in the changelog.
# `scripts/check-dependency-floors.py` (CI: nightly.yaml `dependency-floors`)
# downgrades every direct dependency to its floor and builds the workspace,
# so a floor that has silently rotted fails there rather than downstream.
#
# The `rig` facade is the workspace-root package; examples depend on it via
# `rig.workspace = true` (add per-example features at the use site).
rig = { path = ".", version = "0.42.0" }
rig-agent = { path = "crates/rig-agent", version = "0.42.0" }
rig-reqwest = { path = "crates/rig-reqwest", version = "0.42.0" }
rig-rmcp = { path = "crates/rig-rmcp", version = "0.42.0" }
rig-core = { path = "crates/rig-core", version = "0.42.0" }
anyhow = "1"
arrow-array = "59"
as-any = "0.3"
assert_fs = "1"
async-stream = "0.3"
axum = "0.8"
aws-config = { version = "1", default-features = false }
# 1.124: `OutputConfig`/`ServiceTier`/citations types rig-bedrock maps.
aws-sdk-bedrockruntime = { version = "1.124", default-features = false }
aws-smithy-eventstream = "0.60"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
base64 = "0.22"
bytes = "1"
candle-core = "0.11"
