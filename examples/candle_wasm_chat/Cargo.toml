[package]
name = "candle_wasm_chat"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# `agent` is required, not optional garnish: this example imports
# `rig::agent::{Agent, AgentBuilder}` and `rig::completion::Chat`, all of which
# live in `rig-agent` behind that feature. It was missing and the example did
# not build standalone; a workspace `--all-features` build unified `agent` onto
# the shared `rig` and hid it. The wasm CI lane now builds this package on its
# own so its declared features are actually exercised.
#
# No `wasm` feature: with `agent` enabled, `rig-agent`'s browser target table
# already supplies `rig-core/wasm`, so listing it would be the same no-op this
# release removed from `rig-agent` itself. The facade keeps the feature for
# agent-less builds, which have no such target table.
rig = { path = "../..", default-features = false, features = ["agent", "candle"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
