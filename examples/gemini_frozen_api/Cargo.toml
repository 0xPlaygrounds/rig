[package]
name = "gemini_frozen_api"
version.workspace = true
edition.workspace = true
publish = false
description = "The frozen Gemini programs of design record 0002, built unchanged."

# No workspace lints: the bins are design record 0002's programs as written,
# and P6 asserts inside a fallible `main`, which they deny.

[dependencies]
rig.workspace = true
base64 = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
