# Release: both gates on every push to main, then release-plz. Serialized per
# ref and never cancelled, so a run that may be publishing is not killed.
name: "Build & Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No `secrets: inherit`: the gates are hermetic and use no secrets.
  run-ci:
    uses: ./.github/workflows/ci.yaml

  run-slow:
    uses: ./.github/workflows/slow.yaml

  release-plz:
    name: Release-plz
    needs: [run-ci, run-slow]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
        with:
          protoc: "true"
          alsa: "true"
      # Its own entry, written only by this job after a successful run on a
      # trusted push. `cache-bin` is off so no cached executable runs next to
      # the registry token.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-plz
          cache-bin: "false"
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      # One-off: rig-harness-protocol is new in #2835 and nothing publishes it
      # before the next release PR, because release-plz publishes only from a
      # release-PR merge. Publish it once, here; once crates.io has this
      # version the step does nothing. Delete it on the release PR.
      - name: Publish rig-harness-protocol if crates.io lacks it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "rig-harness-protocol") | .version')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'rig release (github.com/0xPlaygrounds/rig)' \
            "https://crates.io/api/v1/crates/rig-harness-protocol/${version}")"
          if [ "${status}" = "404" ]; then
            cargo publish -p rig-harness-protocol --locked
          else
            echo "rig-harness-protocol ${version} is on crates.io (HTTP ${status}); nothing to publish."
          fi
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          # release-plz works on a temporary copy of the repository, and
          # cargo-semver-checks builds each crate in its own placeholder
          # project. One target directory lets them share dependency builds
          # and puts those builds where the cache above finds them.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
