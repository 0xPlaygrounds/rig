# Release: both gates on every push to main, then release-plz. Serialized per
# ref and never cancelled, so a run that may be publishing is not killed.
name: "Build & Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No `secrets: inherit`: the gates are hermetic and use no secrets.
  run-ci:
    uses: ./.github/workflows/ci.yaml

  run-slow:
    uses: ./.github/workflows/slow.yaml

  release-plz:
    name: Release-plz
    needs: [run-ci, run-slow]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
        with:
          protoc: "true"
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
