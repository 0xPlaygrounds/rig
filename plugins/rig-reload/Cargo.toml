[package]
name = "rig-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "rig-harness plugins: /reload and the reload tool, with which the agent rebuilds and restarts itself, the system prompt's section on how the agent extends itself, and /plugins, which turns plugins on and off."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# How a rebuild goes, in the terminal view's status line. An app without
# the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The rebuild's output, forwarded line by line.
crossbeam-channel = { workspace = true }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness", version = "0.44.0" }
# The rebuild's process group.
rig-tools = { path = "../../crates/rig-tools", version = "0.44.0" }
rig-tui = { path = "../rig-tui", version = "0.44.0", optional = true }
# The reload tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# Scripted models.
rig-core = { workspace = true, features = ["test-utils"] }
# Sessions in memory, scripted models and the loop's wakes.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
