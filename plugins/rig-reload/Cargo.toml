[package]
name = "rig-reload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: /reload and the reload tool, with which the agent rebuilds and restarts itself, and the system prompt's section on what the agent is."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[features]
default = ["tui"]
# How a rebuild goes, in the terminal view's status line. An app without
# the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The rebuild's output, forwarded line by line.
crossbeam-channel = { workspace = true }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# The rebuild's process group.
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../rig-tui", optional = true }
# The reload tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
