[package]
name = "rig-subagents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: subagents, with the task, message and wait tools."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# How the terminal view draws the tools' calls. An app without the terminal
# view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs", version = "0.45.0" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness", version = "0.45.0" }
rig-tui = { path = "../rig-tui", version = "0.45.0", optional = true }
# The tools' parameters, derived from their arguments types.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# A spawn request's record, and its answer.
serde_json = { workspace = true }

[dev-dependencies]
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
