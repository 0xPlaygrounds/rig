[package]
name = "rig-claude-cloak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Opt-in Anthropic subscription OAuth provider for the Rig coding agent"
repository = "https://github.com/0xPlaygrounds/rig"
readme = "README.md"
# The offline fixtures and the acceptance harness are for this repository's
# tests, which the published crate does not build.
exclude = ["/tests/"]

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rig-harness = { path = "../../crates/rig-harness", version = "0.47.0" }
rig-reqwest = { workspace = true }
rig-http = { path = "../../crates/rig-http", version = "0.47.0", features = ["tokio"] }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { workspace = true, features = ["json", "rustls", "gzip", "brotli", "deflate", "zstd"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "process", "macros"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = "0.9"
thiserror = { workspace = true }
url = { workspace = true }
tempfile = "3"
fs2 = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
uuid = { workspace = true, features = ["v4"] }
flate2 = "1"
ryu-js = "1"

[dev-dependencies]
anyhow = { workspace = true }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
