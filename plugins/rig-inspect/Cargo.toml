[package]
name = "rig-inspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "An optional rig-harness plugin: the `inspect` tool, with which the agent reads its own Bevy world through in-process Bevy Remote."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[dependencies]
# The reply channel of a request.
async-channel = { workspace = true }
# Named by Bevy's `Component` and `Reflect` derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Bevy Remote requests answered in process; no transport, no port.
bevy_remote = { workspace = true }
bevy_tasks = { workspace = true }
# The plugin API (prelude, spill handles) of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# The tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# A plugin whose commands the tests find attributed to it.
rig-basics = { path = "../rig-basics" }
# The tool call the tests start as a model would.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
