[package]
name = "rig-coding-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "rig-harness plugins: the coding tools of rig-tools (read, edit, write, search, shell), and the reload tool with which the agent rebuilds itself."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[dependencies]
bevy_app = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
# The reload tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
