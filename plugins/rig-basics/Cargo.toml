[package]
name = "rig-basics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "rig-harness plugins: /help, /retry, /quit and /agents, and the project context (AGENTS.md, the environment, /context) in the system prompt."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[features]
default = ["tui"]
# `/agents` and the agent tree in the terminal view's status line. An app
# without the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
# The local date in the system prompt.
chrono = { workspace = true, features = ["clock"] }
rig-ecs = { path = "../../crates/rig-ecs" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# The instruction files.
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../rig-tui", optional = true }
