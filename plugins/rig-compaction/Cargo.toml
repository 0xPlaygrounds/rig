[package]
name = "rig-compaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: summarizing a conversation near the model's context window, and /compact."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[features]
default = ["tui"]
# The summary drawn as an expandable entry in the terminal view. An app
# without the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
# `/compact`, a slash command.
rig-harness = { path = "../../crates/rig-harness" }
# The token estimate and the checkpoint compaction decides by.
rig-memory = { path = "../../crates/rig-memory", default-features = false }
rig-tui = { path = "../rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
# Usage the summary call adds.
rig-telemetry = { path = "../rig-telemetry" }
