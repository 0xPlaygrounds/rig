[package]
name = "rig-compaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: summarizing a conversation near the model's context window, and /compact."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# The summary drawn as an expandable entry in the terminal view. An app
# without the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs", version = "0.44.0" }
# `/compact`, a slash command.
rig-harness = { path = "../../crates/rig-harness", version = "0.44.0" }
# The token estimate and the checkpoint compaction decides by.
rig-memory = { path = "../../crates/rig-memory", version = "0.44.0", default-features = false }
rig-tui = { path = "../rig-tui", version = "0.44.0", optional = true }
serde = { workspace = true, features = ["derive"] }
# `[compaction]` read over the built-in default.
serde_json = { workspace = true }

[dev-dependencies]
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
# Usage the summary call adds.
rig-telemetry = { path = "../rig-telemetry" }
# The `read` tool a scripted long turn calls.
rig-tools = { path = "../../crates/rig-tools" }
