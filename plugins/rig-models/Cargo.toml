[package]
name = "rig-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "rig-harness plugins: /model, /effort and the model picker, and the model a new session starts with."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# The terminal view's pickers and status line items. An app without the
# terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
# Named by Bevy's derives.
bevy_reflect = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs", version = "0.45.0" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness", version = "0.45.0" }
# The defaults file, written whole.
rig-tools = { path = "../../crates/rig-tools", version = "0.45.0" }
rig-tui = { path = "../rig-tui", version = "0.45.0", optional = true }
serde = { workspace = true, features = ["derive"] }
