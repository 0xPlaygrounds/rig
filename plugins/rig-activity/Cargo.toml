[package]
name = "rig-activity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: what each agent is doing, kept for views."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# Each agent's status in the terminal view's status line. An app without
# the terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs", version = "0.45.0" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness", version = "0.45.0" }
rig-tui = { path = "../rig-tui", version = "0.45.0", optional = true }

[dev-dependencies]
# The open effect a test spawns.
serde_json = { workspace = true }
