[package]
name = "rig-splits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: splitting a conversation at any entry into a branch or a new session, moving a range out, and listing, switching to, comparing and merging back its splits."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# Two lines compared side by side in the terminal view. An app without the
# terminal view leaves it out with `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The slash commands, the session picker and the operations on any saved
# session; its `rig_core` and `rig_memory` re-exports are the conversation and
# session format the splits work on.
rig-harness = { path = "../../crates/rig-harness", version = "0.44.0" }
rig-tui = { path = "../rig-tui", version = "0.44.0", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
