[package]
name = "rig-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: --print, which answers one prompt; also the front of a run no other front took."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
