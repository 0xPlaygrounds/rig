[package]
name = "rig-sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: /new, /resume and /name, and each session's title and labels."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# The session's name in the terminal view's status
# line. An app without the terminal view leaves it out with
# `default-features = false`.
tui = ["dep:rig-tui"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs", version = "0.44.0" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness", version = "0.44.0" }
rig-tui = { path = "../rig-tui", version = "0.44.0", optional = true }

[dev-dependencies]
# The app in a session directory, and stores a test keeps in memory.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The scripted model and transport the tests run turns on.
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
