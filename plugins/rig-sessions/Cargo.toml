[package]
name = "rig-sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A rig-harness plugin: /new, /resume and /name, and each session's title and cost."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[features]
default = ["tui"]
# The `/resume` picker and the session's name in the terminal view's status
# line. An app without the terminal view leaves it out with
# `default-features = false`.
tui = ["dep:rig-tui", "rig-telemetry/tui"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# What a session cost, in its metadata.
rig-telemetry = { path = "../rig-telemetry", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
