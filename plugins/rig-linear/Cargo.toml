[package]
name = "rig-linear"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Mirrors a Rig coding agent run into a Linear agent session: its plan, notes, tool calls and result."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
# The queue between the app and the task that sends to Linear.
async-channel = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
rig-basics = { path = "../rig-basics", version = "0.47.1", default-features = false }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness", version = "0.47.1" }
# The process-wide HTTP client.
rig-reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
# The plan file.
toml = { workspace = true }
# The client credentials form.
url = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
