[package]
name = "rig-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "An ACP (Agent Client Protocol) front for the rig coding agent: `rig acp` lets editors such as Zed use rig's models, tools, sessions and commands."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
agent-client-protocol = { version = "3.6", features = ["stdio"] }
async-channel = { workspace = true }
base64 = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
# A session's `updatedAt`, as RFC 3339.
chrono = { workspace = true, features = ["std"] }
futures = { workspace = true }
rig-basics = { path = "../rig-basics", version = "0.46.0-rc.1", default-features = false }
rig-harness = { path = "../../crates/rig-harness", version = "0.46.0-rc.1" }
rig-mcp-client = { path = "../rig-mcp-client", version = "0.46.0-rc.1" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
bevy_tasks = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
