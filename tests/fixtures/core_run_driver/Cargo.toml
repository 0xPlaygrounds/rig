[package]
name = "rig-core-run-driver-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# A driver over the protocol with NO rig-agent: rig-core (erased model, erased
# tool set, catalog) + rig-run (spec, run state machine, request preparation).
# `tests/core/core_run_driver.rs` runs this binary and checks its dependency
# graph; keep rig-agent out of it.
[dependencies]
rig-core = { path = "../../../crates/rig-core", default-features = false }
rig-run = { path = "../../../crates/rig-run" }
serde_json = "1.0.150"
