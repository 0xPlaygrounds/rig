when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":8,"messages":[{"content":"Say one random word.","role":"user"}],"model":"mistral-small-latest","n":2,"stream":true,"temperature":1.0}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream; charset=utf-8
  - name: mistral-correlation-id
    value: req_REDACTED_1
  body: |+
    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":1}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"Wh"},"finish_reason":null,"index":1}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopq"}

    data: {"choices":[{"delta":{"content":"A"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopqrstuvwxyz012345"}

    data: {"choices":[{"delta":{"content":"isper"},"finish_reason":null,"index":1}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopqrstuvwxy"}

    data: {"choices":[{"delta":{"content":"ard"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmn"}

    data: {"choices":[{"delta":{"content":""},"finish_reason":"stop","index":1}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopqrstuvw"}

    data: {"choices":[{"delta":{"content":"vark"},"finish_reason":"stop","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmno","usage":{"completion_tokens":8,"prompt_tokens":20,"prompt_tokens_details":{"cached_tokens":0},"service_tier":"standard","total_tokens":28}}

    data: [DONE]

