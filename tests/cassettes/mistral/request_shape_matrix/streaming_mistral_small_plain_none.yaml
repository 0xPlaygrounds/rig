when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":64,"messages":[{"content":"Reply with exactly: cobalt","role":"user"}],"model":"mistral-small-latest","stream":true,"tool_choice":"none","tools":[{"function":{"description":"Add two integers","name":"add","parameters":{"properties":{"x":{"type":"integer"},"y":{"type":"integer"}},"required":["x","y"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream; charset=utf-8
  - name: mistral-correlation-id
    value: req_REDACTED_1
  body: |+
    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"c"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefgh"}

    data: {"choices":[{"delta":{"content":"obalt"},"finish_reason":"stop","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopqrstuvwxyz0123456789","usage":{"completion_tokens":4,"prompt_tokens":20,"prompt_tokens_details":{"cached_tokens":0},"service_tier":"standard","total_tokens":24}}

    data: [DONE]

