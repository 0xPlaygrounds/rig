    value: application/json
  body: '{"max_tokens":1,"messages":[{"content":"Call the add tool exactly once with x=17 and y=25. Do not answer in prose.","role":"user"}],"model":"mistral-small-latest","stream":true,"tool_choice":"any","tools":[{"function":{"description":"Add x and y together","name":"add","parameters":{"properties":{"x":{"description":"The first number to add","type":"number"},"y":{"description":"The second number to add","type":"number"}},"required":["x","y"],"type":"object"}},"type":"function"}]}'
