when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":16,"messages":[{"content":"Reply with the single word: pong","role":"user"}],"model":"mistral-small-latest","stream":true}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream; charset=utf-8
  - name: mistral-correlation-id
    value: req_REDACTED_1
  body: |+
    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"P"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmnopqrstuvwxyz012345678"}

    data: {"choices":[{"delta":{"content":"ong"},"finish_reason":"stop","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcd","usage":{"completion_tokens":3,"prompt_tokens":23,"prompt_tokens_details":{"cached_tokens":0},"service_tier":"standard","total_tokens":26}}

    data: [DONE]

