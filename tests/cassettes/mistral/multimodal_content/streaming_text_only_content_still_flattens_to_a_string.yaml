when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"messages":[{"content":"Answer in one short sentence.","role":"system"},{"content":"Name the capital of France. Answer with one word.","role":"user"}],"model":"mistral-small-latest","stream":true,"temperature":0.0}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream; charset=utf-8
  body: |+
    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"Paris"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmn"}

    data: {"choices":[{"delta":{"content":""},"finish_reason":"stop","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"mistral-small-latest","object":"chat.completion.chunk","p":"abcdefghijklmn","usage":{"completion_tokens":2,"prompt_tokens":34,"prompt_tokens_details":{"cached_tokens":0},"service_tier":"standard","total_tokens":36}}

    data: [DONE]

