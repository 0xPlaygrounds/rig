when:
  path: /v1beta/interactions
  method: POST
  query_param:
  - name: alt
    value: sse
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"generation_config":{"thinking_level":"medium","thinking_summaries":"auto"},"input":[{"content":[{"text":"How many positive integers n < 200 are divisible by 4 but not by 10? Think it through, then answer with just the number.","type":"text"}],"type":"user_input"}],"model":"gemini-3-flash-preview","store":true,"stream":true}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream
  body: |+
    event: interaction.created
    data: {"event_type":"interaction.created","interaction":{"id":"v1_REDACTED_1","model":"gemini-3-flash-preview","object":"interaction","status":"in_progress"}}

    event: interaction.status_update
    data: {"event_type":"interaction.status_update","interaction_id":"v1_REDACTED_1","status":"in_progress"}

    event: step.start
    data: {"event_type":"step.start","index":0,"step":{"type":"thought"}}

    event: step.delta
    data: {"delta":{"content":{"text":"**Analyzing Integer Constraints**\n\nI've got a problem where I need to find integers that meet specific criteria. I've narrowed it down to positive integers less than 200, divisible by 4, but *not* divisible by 10. The multiples of 4 are easy to list initially, now I'm working toward finding the largest number that satisfies all the conditions.\n\n\n","type":"text"},"type":"thought_summary"},"event_type":"step.delta","index":0}

    event: step.delta
    data: {"delta":{"content":{"text":"**Calculating Valid Integers**\n\nI've determined that there are 49 positive integers less than 200 divisible by 4. To exclude those also divisible by 10, I calculated the LCM of 4 and 10, which is 20. Then, I found there are 9 multiples of 20 less than 200. This leads me to conclude that there are 40 integers that are divisible by 4, but not by 10.\n\n\n","type":"text"},"type":"thought_summary"},"event_type":"step.delta","index":0}

    event: step.delta
    data: {"delta":{"content":{"text":"**Verifying Enumeration Correctness**\n\nI've re-examined my calculations. I painstakingly recounted the multiples of 4 and 20, confirming the initial counts of 49 and 9, respectively. The constraint *n < 200* has also been re-verified. These confirm there are 40 integers meeting the given conditions, and I am satisfied with the current answer.\n\n\n","type":"text"},"type":"thought_summary"},"event_type":"step.delta","index":0}

    event: step.delta
    data: {"delta":{"signature":"signature_REDACTED_1","type":"thought_signature"},"event_type":"step.delta","index":0}

    event: step.stop
    data: {"event_type":"step.stop","index":0}

    event: step.start
    data: {"event_type":"step.start","index":1,"step":{"type":"model_output"}}

    event: step.delta
    data: {"delta":{"text":"40","type":"text"},"event_type":"step.delta","index":1}

    event: step.stop
    data: {"event_type":"step.stop","index":1}

    event: interaction.completed
    data: {"event_type":"interaction.completed","interaction":{"created":"1970-01-01T00:00:00Z","id":"v1_REDACTED_1","model":"gemini-3-flash-preview","object":"interaction","service_tier":"standard","status":"completed","updated":"1970-01-01T00:00:00Z","usage":{"input_tokens_by_modality":[{"modality":"text","tokens":34}],"total_cached_tokens":0,"total_input_tokens":34,"total_output_tokens":2,"total_thought_tokens":1625,"total_tokens":1661,"total_tool_use_tokens":0}}}

    event: done
    data: [DONE]
