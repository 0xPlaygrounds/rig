when:
  path: /v1beta/interactions
  method: POST
  query_param:
  - name: alt
    value: sse
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"generation_config":{"thinking_level":"medium","thinking_summaries":"auto"},"input":[{"content":[{"text":"How many positive integers n < 200 are divisible by 4 but not by 10? Think it through, then answer with just the number.","type":"text"}],"type":"user_input"}],"model":"gemini-3-flash-preview","store":true,"stream":true}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream
  body: |+
    event: interaction.created
    data: {"event_type":"interaction.created","interaction":{"id":"v1_REDACTED_1","model":"gemini-3-flash-preview","object":"interaction","status":"in_progress"}}

    event: interaction.status_update
    data: {"event_type":"interaction.status_update","interaction_id":"v1_REDACTED_1","status":"in_progress"}

    event: step.start
    data: {"event_type":"step.start","index":0,"step":{"type":"thought"}}

    event: step.delta
    data: {"delta":{"content":{"text":"**Defining the Scope**\n\nI've established the key constraints for this integer: it's positive, less than 200, divisible by 4, and *not* divisible by 10. Now I'm working on formalizing these conditions into equations to better understand the range of acceptable values for *n*. Specifically, I'm noting $n$ as a multiple of 4, or $n=4k$, for some positive integer $k$.\n\n\n","type":"text"},"type":"thought_summary"},"event_type":"step.delta","index":0}

    event: step.delta
    data: {"delta":{"signature":"signature_REDACTED_1","type":"thought_signature"},"event_type":"step.delta","index":0}

    event: step.stop
    data: {"event_type":"step.stop","index":0}

    event: step.start
    data: {"event_type":"step.start","index":1,"step":{"type":"model_output"}}

    event: step.delta
    data: {"delta":{"text":"40","type":"text"},"event_type":"step.delta","index":1}

    event: step.stop
    data: {"event_type":"step.stop","index":1}

    event: interaction.completed
    data: {"event_type":"interaction.completed","interaction":{"created":"1970-01-01T00:00:00Z","id":"v1_REDACTED_1","model":"gemini-3-flash-preview","object":"interaction","service_tier":"standard","status":"completed","updated":"1970-01-01T00:00:00Z","usage":{"input_tokens_by_modality":[{"modality":"text","tokens":34}],"raw_prompt_token":65,"total_cached_tokens":0,"total_input_tokens":34,"total_output_tokens":2,"total_thought_tokens":1016,"total_tokens":1052,"total_tool_use_tokens":0}}}

    event: done
    data: [DONE]

