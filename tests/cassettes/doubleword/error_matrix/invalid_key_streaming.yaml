when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":8,"messages":[{"content":"Reply with error-probe.","role":"user"}],"model":"Qwen/Qwen3.5-9B","stream":true,"stream_options":{"include_usage":true}}'
then:
  status: 403
  header:
  - name: content-type
    value: application/json
  body: '{"error":{"code":"forbidden","message":"Forbidden","param":null,"type":"invalid_request_error"}}'
