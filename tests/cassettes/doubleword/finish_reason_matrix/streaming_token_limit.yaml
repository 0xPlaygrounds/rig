when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":1,"messages":[{"content":"Explain every step of how a compiler optimizes a large program.","role":"user"}],"model":"Qwen/Qwen3.5-9B","stream":true,"stream_options":{"include_usage":true}}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream
  - name: x-request-id
    value: req_REDACTED_1
  body: |+
    data: {"choices":[{"delta":{"reasoning_content":"Here","role":"assistant"},"finish_reason":"length","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"Qwen/Qwen3.5-9B","object":"chat.completion.chunk"}

    data: {"choices":[],"created":0,"id":"chatcmpl-REDACTED_1","model":"Qwen/Qwen3.5-9B","object":"chat.completion.chunk","usage":{"cache_creation":{"ephemeral_1h_input_tokens":0,"ephemeral_24h_input_tokens":0,"ephemeral_5m_input_tokens":0},"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"completion_tokens":1,"completion_tokens_details":{"accepted_prediction_tokens":null,"audio_tokens":null,"reasoning_tokens":1,"rejected_prediction_tokens":null},"prompt_tokens":24,"prompt_tokens_details":{"cached_tokens":0},"total_tokens":25}}

    data: [DONE]

