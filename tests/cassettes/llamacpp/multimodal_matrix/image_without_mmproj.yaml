when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"max_tokens":32,"messages":[{"content":[{"text":"What colour is this?","type":"text"},{"image_url":{"detail":"auto","url":"data:image/png;base64,"},"type":"image_url"}],"role":"user"}],"model":"Qwen3-1.7B-Q4_K_M"}'
then:
  status: 500
  header:
  - name: content-type
    value: application/json; charset=utf-8
  body: '{"error":{"code":500,"message":"image input is not supported - hint: if this is unexpected, you may need to provide the mmproj","type":"server_error"}}'
