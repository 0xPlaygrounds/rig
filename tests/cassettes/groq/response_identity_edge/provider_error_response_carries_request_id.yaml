when:
  path: /openai/v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"messages":[{"content":"Never answered","role":"user"}],"model":"groq-nonexistent-model-for-identity-edge"}'
