  status: 404
  header:
  - name: content-type
    value: application/json
  - name: x-request-id
    value: req_REDACTED_1
  body: '{"error":{"code":"model_not_found","message":"The model `groq-nonexistent-model-for-identity-edge` does not exist or you do not have access to it.","type":"invalid_request_error"}}'
