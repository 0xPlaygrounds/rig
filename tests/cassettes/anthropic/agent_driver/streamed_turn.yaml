    data: {"delta":{"partial_json":"","type":"input_json_delta"},"index":0,"type":"content_block_delta"}

    event: content_block_delta
    data: {"delta":{"partial_json":"{\"x\": 2","type":"input_json_delta"},"index":0,"type":"content_block_delta"}

    event: content_block_delta
    data: {"delta":{"partial_json":", \"y\":","type":"input_json_delta"},"index":0,"type":"content_block_delta"}

    event: content_block_delta
    data: {"delta":{"partial_json":" 5}","type":"input_json_delta"},"index":0,"type":"content_block_delta"}

