[package]
name = "corpus-custom-provider"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 16. Custom provider registration"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# Custom header names read from the file.
http = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The shared HTTP client every configured model sends through.
rig-reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `providers.toml` (already in the lock file through rig-harness).
toml = "1"

[dev-dependencies]
rig-cassette = { workspace = true }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# `/model`, its completions with each model's status.
rig-models = { path = "../../plugins/rig-models" }
rig-tui = { path = "../../plugins/rig-tui" }
# The cost a reply adds, at the configured prices.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
