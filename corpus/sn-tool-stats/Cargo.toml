[package]
name = "corpus-sn-tool-stats"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-20: 20. Tool reliability statistics"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The real `read` and `shell` tools whose calls are counted.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
