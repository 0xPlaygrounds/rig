[package]
name = "corpus-fh-step-mode"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-02: 02. Step-through mode"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The input editor, `$EDITOR` in the terminal and the status line.
rig-tui = { path = "../../plugins/rig-tui" }
serde_json = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The real `shell`, `write` and `read` tools whose calls are stepped.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
