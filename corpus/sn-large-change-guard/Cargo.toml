[package]
name = "corpus-sn-large-change-guard"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-02: 02. Large-change guard"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The file tools' names and arguments, what `edit` makes of a text, and the
# line diff the tools publish.
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Reads `large-change.toml`; the same version rig-harness uses.
toml = "1"

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
