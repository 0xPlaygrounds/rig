[package]
name = "corpus-effect-query"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 55. Effect log query tool"

[lints]
workspace = true

[dependencies]
# The pool an open tool call's work runs on.
bevy_tasks = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The session's effect log, read back.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
