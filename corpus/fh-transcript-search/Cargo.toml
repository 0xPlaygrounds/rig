[package]
name = "corpus-fh-transcript-search"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-20: 20. Transcript search"

[lints]
workspace = true

[dependencies]
# The search's system parameters.
bevy_ecs = { workspace = true }
# A query that starts with `re:`.
regex = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The search bar is a panel of the terminal view.
rig-tui = { path = "../../plugins/rig-tui" }
# A call's arguments as JSON text.
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
