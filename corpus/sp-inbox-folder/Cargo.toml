[package]
name = "corpus-sp-inbox-folder"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-09: 09. Inbox folder front"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Warnings about the folder.
bevy_log = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The helper an item's `agent` names.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The terminal view, which shows the transcript.
rig-tui = { path = "../../plugins/rig-tui" }
