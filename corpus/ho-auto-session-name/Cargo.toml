[package]
name = "corpus-ho-auto-session-name"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H19: Name sessions automatically"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The session's name, the one `/name` sets.
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
# Telling an attached file from what the user typed.
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
