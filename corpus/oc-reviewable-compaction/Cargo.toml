[package]
name = "corpus-oc-reviewable-compaction"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-08: 08. Reviewable, reversible compaction"

[lints]
workspace = true

[features]
default = ["tui"]
# The review's "Edit in $EDITOR" choice, which runs the editor with the
# terminal view's terminal.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The summary's policy, its saved state and automatic compaction.
rig-compaction = { path = "../../plugins/rig-compaction", default-features = false }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
