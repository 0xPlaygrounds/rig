[package]
name = "corpus-export"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 41. Session export"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
