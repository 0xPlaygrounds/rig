[package]
name = "corpus-ct-timed-grants"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (conversation-over-time fresh held-out): CT-01: 01. Time-boxed permission grants"

[lints]
workspace = true

[features]
default = ["tui"]
# The status item with the soonest grant's countdown.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# `edits:<glob>`; already in Cargo.lock.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The subagents a covered agent starts (`SpawnedAgent`).
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The real `shell` and `write` tools whose calls grants cover.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
