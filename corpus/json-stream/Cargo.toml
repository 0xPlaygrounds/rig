[package]
name = "corpus-json-stream"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 48. JSON event stream and RPC mode"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# stdin lines from the reader thread to the app.
crossbeam-channel = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Pickers other plugins open, which become `request` events.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
