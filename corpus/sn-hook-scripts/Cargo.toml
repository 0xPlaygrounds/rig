[package]
name = "corpus-sn-hook-scripts"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-03: 03. External hook scripts"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
# The matcher's glob and argument regex, and the trusted files' digests.
glob = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
# `hooks.toml`; already in Cargo.lock (1.x), as rig-harness reads its settings.
toml = "1"
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
