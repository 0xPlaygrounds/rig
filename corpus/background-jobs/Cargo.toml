[package]
name = "corpus-background-jobs"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 22. Background jobs"

[lints]
workspace = true

[features]
default = ["tui"]
# The running count in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# `OnAppExitSystems`, which the prelude leaves out.
bevy_app = { workspace = true }
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The task that waits for a job.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Killing a job's process group.
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Waiting on a job another process started, after a reload.
libc = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
