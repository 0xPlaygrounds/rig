[package]
name = "corpus-background-jobs"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 22. Background jobs"

[lints]
workspace = true

[features]
default = ["tui"]
# The running count in the terminal view's status line.
tui = ["dep:rig-tui", "rig-reload/tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The task that waits for a job.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Whether an exit is `/reload`'s restart.
rig-reload = { path = "../../plugins/rig-reload", default-features = false }
# Process groups, as `shell` starts them.
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Waiting on a job another process started, after a reload.
libc = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
