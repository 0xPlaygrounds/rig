[package]
name = "corpus-oc"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: The plugins of the one-conversation series (OC): one plugin per module, each written only against the harness's public API."

[lints]
workspace = true

[features]
default = ["tui"]
tui = []

[dependencies]
base64 = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
flate2 = { version = "1.1.9" }
futures = { workspace = true }
glob = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
quick-xml = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-basics = { path = "../../plugins/rig-basics" }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-reqwest = { workspace = true }
rig-tui = { path = "../../plugins/rig-tui" }
rusqlite = { workspace = true, features = ["bundled", "hooks"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = { workspace = true }
tar = { version = "0.4.46" }
tokio = { workspace = true, features = ["time"] }
toml = { version = "1" }

[dev-dependencies]
bevy_time = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
