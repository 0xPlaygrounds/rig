[package]
name = "corpus-session-replay"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 56. Replay a recorded session"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The recorded effect log.
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-harness = { path = "../../crates/rig-harness" }
serde_json = { workspace = true }
# Pairing replayed subagents through their spawn.
rig-subagents = { path = "../../plugins/rig-subagents" }

[dev-dependencies]
# A session quit under exit-notes, with `/quit`.
corpus-ho-exit-notes = { path = "../ho-exit-notes" }
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
# The tool guards a replayed session may have run with.
corpus-confirm-destructive = { path = "../confirm-destructive" }
corpus-permission-modes = { path = "../permission-modes" }
corpus-plan-mode = { path = "../plan-mode" }
corpus-protected-paths = { path = "../protected-paths" }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-telemetry = { path = "../../plugins/rig-telemetry" }
rig-tools = { path = "../../crates/rig-tools" }
