[package]
name = "corpus-shell-sandbox"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 04. Sandboxed shell"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# The `Launcher` every child process starts with.
rig-tools = { path = "../../crates/rig-tools" }

[dev-dependencies]
# Checks the stage systems are ordered against the default plugins.
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The default `shell`, which the sandbox wraps.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
serde_json = { workspace = true }
