[package]
name = "corpus-shell-sandbox"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 04. Sandboxed shell"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
# The plugin API of the agent it is loaded into.
rig-harness = { path = "../../crates/rig-harness" }
# The `shell` tool the sandboxed one runs its wrapped command with.
rig-tools = { path = "../../crates/rig-tools" }
# The tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The app on a session store and the scripted model the tests run on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The default `shell` the plugin turns off.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
