[package]
name = "corpus-fh-rich-tool-rendering"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-19: 19. Rich tool call rendering"

[lints]
workspace = true

[dependencies]
rig-harness = { path = "../../crates/rig-harness" }
# The diff of a replacement (`fs::file_change`) and what `search` publishes.
rig-tools = { path = "../../crates/rig-tools" }
# The terminal view this plugin draws in: its renderers, keys and transcript view.
rig-tui = { path = "../../plugins/rig-tui" }
serde_json = { workspace = true }

[dev-dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
# The default tools whose looks this plugin replaces.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
