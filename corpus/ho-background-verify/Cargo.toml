[package]
name = "corpus-ho-background-verify"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H15: Debounced background check after edits"

[lints]
workspace = true

[features]
default = ["tui"]
# `check ✓` / `check ✗ 3 errors` / `check …` in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
# The pool a check's command waits on.
bevy_tasks = { workspace = true }
# The files whose edits schedule a check.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
