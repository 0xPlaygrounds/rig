[package]
name = "corpus-oc-coverage-gap-nudge"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-14: 14. Untested-change nudge from coverage"

[lints]
workspace = true

[features]
default = ["tui"]
# `coverage running…` in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool a coverage run waits on.
bevy_tasks = { workspace = true }
# The `sources` globs of `coverage.toml`.
glob = { workspace = true }
# Cobertura XML reports.
quick-xml = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `coverage.toml`; the version rig-harness already reads settings with.
toml = "1"

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
