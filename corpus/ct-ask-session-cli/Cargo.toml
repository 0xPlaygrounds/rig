[package]
name = "corpus-ct-ask-session-cli"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (conversation-over-time fresh held-out): CT-23: 23. `rig ask-session`"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# `last`: the newest saved session, as `/resume` lists them.
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
# What the run's model calls cost, for `--json`.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
