[package]
name = "corpus-ho-conversation-surgery"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H20: Cut messages out of a conversation"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The token estimate, as compaction makes it.
rig-memory = { path = "../../crates/rig-memory", default-features = false }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The arguments of the test's `shell`.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
