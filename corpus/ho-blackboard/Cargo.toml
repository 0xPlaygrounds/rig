[package]
name = "corpus-ho-blackboard"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H18: Shared blackboard for agents"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# A post's time, as the model reads it.
chrono = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The board's panel in the terminal view.
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
