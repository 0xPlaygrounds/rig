[package]
name = "corpus-voice"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 49. Voice input and spoken answers"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_log = { workspace = true }
# The pool a transcription waits on.
bevy_tasks = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
# `RIG_HOME/voice.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
bevy_time = { workspace = true }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
