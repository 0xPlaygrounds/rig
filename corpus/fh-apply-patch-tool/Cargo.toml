[package]
name = "corpus-fh-apply-patch-tool"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-07: 07. Multi-file patch tool per model"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Already in Cargo.lock (through the launcher's dependencies); parses patch.toml.
toml = "1"
# A patch's offer goes after a mode's, and its group before early tool starts.
corpus-fh-early-tool-start = { path = "../fh-early-tool-start", default-features = false }
corpus-permission-modes = { path = "../permission-modes" }

[dev-dependencies]
corpus-fh-encrypted-sessions = { path = "../fh-encrypted-sessions" }
corpus-fh-remote-workspace = { path = "../fh-remote-workspace" }
corpus-fh-transcript-search = { path = "../fh-transcript-search" }
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
