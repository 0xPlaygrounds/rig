[package]
name = "corpus-sn-bookmarks"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-17: 17. Conversation bookmarks"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The session format: a bookmark's message id, and the saved history read
# back from a copy of the session as it was before a condensing.
rig-cassette = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The marker's look, and scrolling to and selecting a bookmarked message.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
