[package]
name = "corpus-long-term-memory"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 26. Long-term memory"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The default plugins' request edits the recall goes between: the default
# prompt before, compaction's measurement after.
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction" }
# `/memory edit` runs $EDITOR in the terminal view.
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-ecs = { path = "../../crates/rig-ecs" }
serde_json = { workspace = true }
