[package]
name = "corpus-output-truncate"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 21. Tool output truncation with spill files"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The `shell` that returns all of its output, for this plugin to cut.
rig-tools = { path = "../../crates/rig-tools" }
# The `[truncate]` settings table.
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
