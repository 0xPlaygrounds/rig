[package]
name = "corpus-ho-session-recall"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H11: Recall from past sessions"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
# The pool the index is built on.
bevy_tasks = { workspace = true }
# Dates of the sessions a hit names.
chrono = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# A past session's name and date, from its listing cache.
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
