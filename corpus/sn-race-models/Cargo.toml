[package]
name = "corpus-sn-race-models"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-22: 22. Race two models, keep the faster"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The input tokens a cancelled member was sent, estimated.
rig-memory = { path = "../../crates/rig-memory", default-features = false }
# `/model race-fast`.
rig-models = { path = "../../plugins/rig-models", default-features = false }
# What a cancelled member is counted as spending.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde = { workspace = true, features = ["derive"] }
# `race.toml` (already in the lock file through rig-harness).
toml = "1"

[dev-dependencies]
futures = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
schemars = { workspace = true }
serde_json = { workspace = true }
