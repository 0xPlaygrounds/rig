[package]
name = "corpus-rf-03"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: one outside consumer of rig's public API (0.45 review round)."

[lints]
workspace = true

[features]
default = ["tui"]
tui = ["dep:rig-tui"]

[dependencies]
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
