[package]
name = "corpus-sn-web-fetch"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-06: 06. Web fetch tool with domain policy"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
# HTML to Markdown: its tokenizer. Already in Cargo.lock (through ammonia).
html5ever = "0.39"
# The HTTP client rig-harness already builds on (through rig-reqwest).
reqwest = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# DNS lookups and the fetch's deadline, on the agent's `TokioRuntime`.
tokio = { workspace = true, features = ["net", "time"] }
# `RIG_HOME/fetch.toml`; the version rig-harness reads settings.toml with.
toml = "1"

[dev-dependencies]
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
