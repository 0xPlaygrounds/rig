[package]
name = "corpus-fork-session"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 43. Fork and branch sessions"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The session's logs, read and written through a store.
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
# `SwitchSession`, `/resume`, the listing cache.
rig-sessions = { path = "../../plugins/rig-sessions" }
rig-tools = { path = "../../crates/rig-tools" }
# The pickers, and showing the branched agent.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
