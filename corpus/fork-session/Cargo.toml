[package]
name = "corpus-fork-session"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 43. Fork and branch sessions"

[lints]
workspace = true

[features]
# `/branch --files`: puts the files back as spec 31's checkpoints kept them.
checkpoints = ["dep:corpus-checkpoint-rewind"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
corpus-checkpoint-rewind = { path = "../checkpoint-rewind", optional = true }
rig-harness = { path = "../../crates/rig-harness" }
# The sessions' titles and `/resume` labels, and the listing `/tree` walks.
rig-sessions = { path = "../../plugins/rig-sessions" }
rig-tools = { path = "../../crates/rig-tools" }
# The pickers, the input line, and showing the branched agent.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-core = { workspace = true, features = ["test-utils"] }
