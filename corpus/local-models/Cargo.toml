[package]
name = "corpus-local-models"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 58. Local models (Ollama / llama.cpp)"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_tasks = { workspace = true }
rig-compaction = { path = "../../plugins/rig-compaction" }
rig-harness = { path = "../../crates/rig-harness" }
# The shared HTTP client the probes and the warm-up send on, the one model
# calls use.
rig-reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-cassette = { workspace = true }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# `/model`, which the test chooses the local model with.
rig-models = { path = "../../plugins/rig-models", default-features = false }
