[package]
name = "corpus-sp-structured-config-edit"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-03: 03. Structured config edits"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
serde_yaml = { workspace = true }
# Already in Cargo.lock; edits TOML keeping every byte it is not asked to change.
toml_edit = "0.25"

[dev-dependencies]
# A read-only mode as the user has it, and the built-in `edit` to compare.
corpus-plan-mode = { path = "../plan-mode" }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
