[package]
name = "corpus-few-shot-examples"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 13. Few-shot examples"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# File globs in an example's `when`.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The sets the examples go between: after the default prompt, before
# compaction measures the request.
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
