[package]
name = "corpus-rf-01"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: one outside consumer of rig's public API (0.45 review round)."

[lints]
workspace = true

[[bin]]
name = "shared-thread"
path = "src/main.rs"

[dependencies]
rig-agent = { workspace = true }
# `test-utils` only for the offline demo binary's scripted model.
rig-core = { workspace = true, features = ["test-utils"] }
rig-memory = { path = "../../crates/rig-memory" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
