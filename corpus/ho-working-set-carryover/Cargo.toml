[package]
name = "corpus-ho-working-set-carryover"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H12: Working set kept across compaction"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The session store a restore reads from.
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
# The test/build command pattern.
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
