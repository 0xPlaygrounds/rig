[package]
name = "corpus-oc-rate-limit-status"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-20: 20. Provider quota status item"

[lints]
workspace = true

[features]
default = ["tui"]
# The status line item, in the terminal view.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Anthropic's reset times are RFC 3339 dates (already in Cargo.lock).
chrono = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }

[dev-dependencies]
# The clock the test moves by hand.
bevy_time = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
