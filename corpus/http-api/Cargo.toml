[package]
name = "corpus-http-api"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 46. HTTP API front"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
crossbeam-channel = { workspace = true }
rig-activity = { path = "../../plugins/rig-activity", default-features = false }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
# Pickers other plugins open, answered over HTTP.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The bearer token.
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
