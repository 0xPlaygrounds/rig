[package]
name = "corpus-http-api"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 46. HTTP API front"

[lints]
workspace = true

[dependencies]
# The connections' requests, read as a `Running::stream`.
async-channel = { workspace = true }
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The pool the requests' `Running::stream` runs on.
bevy_tasks = { workspace = true }
rig-activity = { path = "../../plugins/rig-activity", default-features = false }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The bearer token.
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
