[package]
name = "corpus-oc-approval-batching"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-01: 01. Batched approvals for parallel tool calls"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The dialog is a panel of the terminal view.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `approve.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The real `read` and `shell` tools whose calls the plugin holds.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
