[package]
name = "corpus-oc-approval-batching"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-01: 01. Batched approvals for parallel tool calls"

[lints]
workspace = true

[features]
default = ["tui"]
# The question's own keys in the terminal view (Space, a, n, e).
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Only for ordering after its restart check (`SubagentSystems::StopRestored`).
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `approve.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The real `read` and `shell` tools whose calls the plugin holds.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
