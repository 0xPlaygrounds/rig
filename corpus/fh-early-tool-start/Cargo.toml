[package]
name = "corpus-fh-early-tool-start"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-24: 24. Start tools while the reply is still streaming"

[lints]
workspace = true

[features]
default = ["tui"]
# The running turn's count of early calls in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
futures = { workspace = true }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
schemars = { workspace = true }
serde_json = { workspace = true }
