[package]
name = "corpus-text-tool-calls"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 59. Tool calls for models without native tool calling"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Transforming the model's reply stream.
futures = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
