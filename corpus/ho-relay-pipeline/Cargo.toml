[package]
name = "corpus-ho-relay-pipeline"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H17: Configured agent pipelines with a feedback loop"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# `pass_when`; already in Cargo.lock.
regex = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Each stage is a one-job helper agent spawned through `SpawnSubagent`.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
serde = { workspace = true, features = ["derive"] }
# `pipelines.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
