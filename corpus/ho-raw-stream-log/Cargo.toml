[package]
name = "corpus-ho-raw-stream-log"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H26: Raw provider stream log"

[lints]
workspace = true

[dependencies]
# The writer thread's lines in, its events back out as a stream.
async-channel = { workspace = true }
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the writer's events stream on.
bevy_tasks = { workspace = true }
# Tapping a reply's stream as it passes.
futures = { workspace = true }
# The secret patterns.
regex = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde_json = { workspace = true }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
