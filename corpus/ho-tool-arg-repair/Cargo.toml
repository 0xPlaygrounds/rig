[package]
name = "corpus-ho-tool-arg-repair"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H31: Repair broken tool-call arguments"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The before and after of each repair, in the debug log.
bevy_log = { workspace = true }
# Arguments are repaired before the coding tools give a call its directory.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
schemars = { workspace = true }
