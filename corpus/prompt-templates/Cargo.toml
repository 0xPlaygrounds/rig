[package]
name = "corpus-prompt-templates"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 11. Prompt templates"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
# The templates' frontmatter.
serde_yaml = { workspace = true }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
# The app on a session store and the scripted model the test runs on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
