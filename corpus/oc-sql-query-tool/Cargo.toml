[package]
name = "corpus-oc-sql-query-tool"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-05: 05. Read-only SQL query tool"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# SQLite, bundled as rig-sqlite already builds it; already in Cargo.lock.
# `hooks` for the progress handler that times out and cancels a query.
rusqlite = { workspace = true, features = ["bundled", "hooks"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `<project>/.rig/db.toml`; the version rig-harness reads settings.toml with.
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
