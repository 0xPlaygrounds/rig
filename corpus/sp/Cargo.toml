[package]
name = "corpus-sp"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: The plugins of the splits series (SP): one plugin per module, each written only against the harness's public API."

[lints]
workspace = true

[features]
default = ["tui"]
tui = []

[dependencies]
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction", default-features = false }
rig-harness = { path = "../../crates/rig-harness" }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { version = "1" }
toml_edit = { version = "0.25" }

[dev-dependencies]
corpus-shared = { path = "../shared" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-models = { path = "../../plugins/rig-models" }
