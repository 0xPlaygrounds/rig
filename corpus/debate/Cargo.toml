[package]
name = "corpus-debate"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 36. Debate"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Each debater's spend, which the verdict lists.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
# RIG_HOME/debate.json.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
