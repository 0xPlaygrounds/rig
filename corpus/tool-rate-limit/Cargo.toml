[package]
name = "corpus-tool-rate-limit"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 05. Tool rate limits"

[lints]
workspace = true

[features]
default = ["tui"]
# The "fetch: waiting 12 s" status item.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_log = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
# `RIG_HOME/limits.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
futures = { workspace = true }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# Checks the stage systems are ordered against the default plugins.
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
schemars = { workspace = true }
serde_json = { workspace = true }
