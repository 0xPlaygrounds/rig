[package]
name = "corpus-fh-import-sessions"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-17: 17. Import sessions from other coding agents"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
chrono = { workspace = true }
rig-cassette = { workspace = true }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
