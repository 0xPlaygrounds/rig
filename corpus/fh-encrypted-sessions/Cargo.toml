[package]
name = "corpus-fh-encrypted-sessions"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-18: 18. Encrypted sessions at rest"

[lints]
workspace = true

[dependencies]
# Already in Cargo.lock (through rustls and others): authenticated
# encryption, randomness and HMAC from ring, the slow KDF from argon2.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-cassette = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
ring = "0.17"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
