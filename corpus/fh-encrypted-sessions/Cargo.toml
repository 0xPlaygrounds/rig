[package]
name = "corpus-fh-encrypted-sessions"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (fresh held-out): FH-18: 18. Encrypted sessions at rest"

[lints]
workspace = true

[features]
default = ["tui"]
# Keeps typed prompts out of the terminal view's plain prompt history.
tui = ["dep:rig-tui"]

[dependencies]
# Already in Cargo.lock (through rustls and others): authenticated
# encryption, randomness and HMAC from ring, the slow KDF from argon2.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
ring = "0.17"
serde = { workspace = true, features = ["derive"] }
toml = "1"

[dev-dependencies]
bevy_reflect = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde_json = { workspace = true }
