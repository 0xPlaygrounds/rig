[package]
name = "corpus-sp-subagent-result-cache"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-06: 06. Subagent answer cache"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The `SpawnSubagent` requests it answers from a record, and the subagents
# whose first answer it records.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
# The real `read`, `search` and `shell` tools the subagents call.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
