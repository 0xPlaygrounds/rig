[package]
name = "corpus-model-fallback"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 15. Model fallback chain"

[lints]
workspace = true

[dependencies]
# Named by the ECS derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Routing after the default prompt went in.
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
# Ordered against compaction: routing before it measures, taking a failure
# over after it had its chance at an overflow.
rig-compaction = { path = "../../plugins/rig-compaction" }
# The `[model-fallback]` settings.
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
# The app on a session store and the scripted models the test runs on.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The manual clock the cooldown is advanced on.
bevy_time = { workspace = true }
# The 529 status of the scripted failure.
http = { workspace = true }
