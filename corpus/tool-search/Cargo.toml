[package]
name = "corpus-tool-search"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 24. Deferred tools with tool search"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Name globs of the deferred tools.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# `tool_search`'s parameters, and the settings table.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
