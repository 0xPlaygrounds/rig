[package]
name = "corpus-rf-02"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: one outside consumer of rig's public API (0.45 review round)."

[lints]
workspace = true

[[example]]
name = "app_chat"
path = "examples/app_chat.rs"

[dependencies]
rig-agent = { workspace = true }
rig-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
