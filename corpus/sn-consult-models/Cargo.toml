[package]
name = "corpus-sn-consult-models"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-13: 13. Second opinions from other models"

[lints]
workspace = true

[features]
default = ["tui"]
# How the terminal view draws a consult call, with its consultants' calls
# nested under it.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The consultants are helper agents spawned through `SpawnSubagent`.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# What each consultant spent.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-tui = { path = "../../plugins/rig-tui" }
