[package]
name = "corpus-ho-terminal-title"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H22: Terminal title and attention bell"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The session's name.
rig-sessions = { path = "../../plugins/rig-sessions" }
# The terminal view: its front, its events and its writer.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
bevy_time = { workspace = true }
