[package]
name = "corpus-sn-untrusted-quarantine"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-05: 05. Untrusted content quarantine"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The per-session nonce of the fences.
fastrand = { workspace = true }
# Untrusted tool names and paths.
glob = { workspace = true }
# Instruction-like text.
regex = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The real `read`, `shell` and `write` tools, and `task`.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
