[package]
name = "corpus-ct-test-runner-tool"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (conversation-over-time fresh held-out): CT-04: 04. Structured test runner tool"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool a run's output streams on.
bevy_tasks = { workspace = true }
# The channel a run's output comes through, as a stream.
futures = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
