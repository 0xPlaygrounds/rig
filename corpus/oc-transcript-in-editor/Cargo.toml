[package]
name = "corpus-oc-transcript-in-editor"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-09: 09. Edit the conversation in your editor"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# `$EDITOR` run with the terminal.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The arguments of the test's `shell`.
schemars = { workspace = true }
