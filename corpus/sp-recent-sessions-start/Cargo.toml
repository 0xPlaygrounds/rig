[package]
name = "corpus-sp-recent-sessions-start"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-15: 15. Recent-sessions start screen"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the listing is read on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Switching to the session picked.
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
# The screen's keys and the read-only view.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
