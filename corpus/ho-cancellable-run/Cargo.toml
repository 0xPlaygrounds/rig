[package]
name = "corpus-ho-cancellable-run"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H09: Long commands with live output and per-call cancel"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The pool a command's output streams on.
bevy_tasks = { workspace = true }
# The channel a command's output comes through, as a stream.
futures = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The `run` look in the transcript and `ctrl+k`.
rig-tui = { path = "../../plugins/rig-tui" }
# No longer used; kept while Cargo.lock is frozen for the rework.
bevy_reflect = { workspace = true }
libc = { workspace = true }
rig-print = { path = "../../plugins/rig-print" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
