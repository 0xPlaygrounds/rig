[package]
name = "corpus-sp-per-agent-compaction"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-20: 20. Per-agent compaction rules"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the rules files are read on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The summary machinery a `summary` rule drives, and the per-agent policy
# that keeps it off agents with other rules.
rig-compaction = { path = "../../plugins/rig-compaction", default-features = false }
# `task`'s spawn requests, which carry a subagent's type.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
