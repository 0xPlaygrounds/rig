[package]
name = "corpus-secret-redaction"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 10. Secret redaction"

[lints]
workspace = true

[dependencies]
# The component hook a model reply is redacted in.
bevy_ecs = { workspace = true }
# Warnings about what could not be redacted.
bevy_log = { workspace = true }
# The secret patterns.
regex = { workspace = true }
# The session store the log is redacted on its way into.
rig-cassette = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
# The coding tools, registered again behind the placeholder swap.
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
