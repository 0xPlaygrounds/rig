[package]
name = "corpus-sn-notebook-cells"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-07: 07. Jupyter notebook reading and cell editing"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Raw values give each cell's place in the file's text; preserve_order
# keeps a replaced cell's keys in their order.
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The `read` and `edit` tools the test calls.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
