[package]
name = "corpus-keybindings"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 53. Custom key bindings"

[lints]
workspace = true

[dependencies]
bevy_ecs = { workspace = true }
# The terminal view's key types, so a binding matches the events it reads.
crossterm = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
# `RIG_HOME/keys.toml`; already in the lock through other crates.
toml = "1"
