[package]
name = "corpus-ho-hunk-review"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H13: Hunk-by-hunk review after each turn"

[lints]
workspace = true

[dependencies]
# Named by the `Component` derive.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The file tools' names and the atomic write.
rig-tools = { path = "../../crates/rig-tools" }
# The line diff hunks are cut from, as the file tools diff.
similar = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
