[package]
name = "corpus-ho-script-tools"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H08: Tools from shell scripts, live"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# A script tool's definition, handler and result.
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Running a script under the shared launcher, killed with its group.
rig-tools = { path = "../../crates/rig-tools" }
serde_json = { workspace = true }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
# The built-in `read` a script may not take over.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
