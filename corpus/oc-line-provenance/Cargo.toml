[package]
name = "corpus-oc-line-provenance"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-21: 21. Which prompt wrote this line?"

[lints]
workspace = true

[dependencies]
# Named by the `SystemParam` and `Resource` derives.
bevy_ecs = { workspace = true }
# Why a change could not be recorded.
bevy_log = { workspace = true }
# A record's day, in the user's time zone; already in Cargo.lock.
chrono = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Line diffs that carry each line's origin forward, as rig-tools' `edit` diffs.
similar = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
