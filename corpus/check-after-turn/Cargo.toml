[package]
name = "corpus-check-after-turn"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 32. Run checks after the agent edits"

[lints]
workspace = true

[features]
default = ["tui"]
# "checking: <name>" in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
# The pool a check's command waits on.
bevy_tasks = { workspace = true }
# File globs of a check's `when`.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# `Shell`, which runs a check's command as `Processes` say.
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `<project>/.rig/checks.toml`; already in Cargo.lock.
toml = "1"

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
