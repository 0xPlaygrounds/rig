[package]
name = "corpus-permission-modes"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 07. Permission modes"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Subagents inherit their parent's mode when they are spawned.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# The status item and shift+tab.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
# A mode refuses or asks after the path guard refused, before a destructive command is asked about.
corpus-confirm-destructive = { path = "../confirm-destructive" }
corpus-protected-paths = { path = "../protected-paths" }
# Both take tools out of a turn's requests: a mode after plan mode.
corpus-plan-mode = { path = "../plan-mode" }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
