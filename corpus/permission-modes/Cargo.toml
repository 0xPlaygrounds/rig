[package]
name = "corpus-permission-modes"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 07. Permission modes"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The default plugins' request edits, ordered around: the default prompt
# before, compaction's measurement after.
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction" }
# Subagents inherit their parent's mode when they are spawned.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# The status item and shift+tab.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
