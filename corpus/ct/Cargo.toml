[package]
name = "corpus-ct"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: The plugins of the conversation-over-time series (CT): one plugin per module, each written only against the harness's public API."

[lints]
workspace = true

[features]
default = ["tui"]
tui = []

[dependencies]
async-channel = { workspace = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
regex = { workspace = true }
rig-compaction = { path = "../../plugins/rig-compaction" }
rig-harness = { path = "../../crates/rig-harness" }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
rig-subagents = { path = "../../plugins/rig-subagents" }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
