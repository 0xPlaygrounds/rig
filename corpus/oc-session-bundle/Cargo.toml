[package]
name = "corpus-oc-session-bundle"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-12: 12. Portable session bundle"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Both already in Cargo.lock: a bundle is a gzip-compressed tar archive.
flate2 = "1.1.9"
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = "0.4.46"

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
