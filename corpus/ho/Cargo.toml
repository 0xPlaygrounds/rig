[package]
name = "corpus-ho"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: The plugins of the held-out series (H): one plugin per module, each written only against the harness's public API."

[lints]
workspace = true

[features]
default = ["tui"]
tui = []

[dependencies]
corpus-shared = { path = "../shared" }
async-channel = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
rig-basics = { path = "../../plugins/rig-basics" }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-memory = { path = "../../crates/rig-memory", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["rt", "process", "io-util"] }
toml = { version = "1" }

[dev-dependencies]
bevy_time = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
