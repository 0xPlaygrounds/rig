[package]
name = "corpus-code-search-index"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 25. Semantic code search (RAG)"

[lints]
workspace = true

[features]
default = ["tui"]
# Index progress in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
rig-compaction = { path = "../../plugins/rig-compaction" }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
