[package]
name = "corpus-review-agent"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 35. Review agent"

[lints]
workspace = true

[features]
default = ["tui"]
# "reviewing" in the terminal view's status line.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the git snapshots run on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde_json = { workspace = true }
