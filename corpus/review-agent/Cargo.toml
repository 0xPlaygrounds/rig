[package]
name = "corpus-review-agent"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 35. Review agent"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the git commands wait on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# `Processes` hands out its `Launcher`, which the git commands start from.
rig-tools = { path = "../../crates/rig-tools" }
# The reviewer is a helper agent spawned with `SpawnSubagent`.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# The `[review]` settings table.
serde = { workspace = true, features = ["derive"] }
# The review effect's record.
serde_json = { workspace = true }

[dev-dependencies]
# Checks the stage systems are ordered against the default plugins.
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
