[package]
name = "corpus-sn-model-params"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-04: 04. Per-model request parameters"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde_json = { workspace = true }
# The version rig-harness reads settings.toml with: no new crate.
toml = "1"

[dev-dependencies]
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-models = { path = "../../plugins/rig-models" }
rig-subagents = { path = "../../plugins/rig-subagents" }
