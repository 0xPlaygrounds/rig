[package]
name = "corpus-ho-socket-attach"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H23: Attach to a running session over a socket"

[lints]
workspace = true

[dependencies]
# What the connections and the thin client hand the app, read as a
# `Running::stream`.
async-channel = { workspace = true }
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
# The pool the streams run on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
