[package]
name = "corpus-summarize-tool-output"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 18. Cheap summarizer for big tool outputs"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The default `shell`'s own cut, which this plugin turns off to see whole outputs.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde_json = { workspace = true }
