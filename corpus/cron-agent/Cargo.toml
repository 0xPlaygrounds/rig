[package]
name = "corpus-cron-agent"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 23. Scheduled prompts (cron agent)"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Cron fields are read in the local time zone, as a user writes them.
chrono = { workspace = true, features = ["clock"] }
rig-harness = { path = "../../crates/rig-harness" }
# Each run is a helper agent spawned through its SpawnSubagent effect.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# The `schedule` tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
