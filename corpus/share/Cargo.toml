[package]
name = "corpus-share"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 42. Share a session"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The IO pool the upload runs on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The shared HTTP client the targets are sent with.
rig-reqwest = { workspace = true }
# The terminal view, which copies the link (OSC 52).
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
