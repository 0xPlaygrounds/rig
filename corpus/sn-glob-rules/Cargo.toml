[package]
name = "corpus-sn-glob-rules"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-09: 09. Path-scoped project rules"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# Path globs with gitignore's rules: a glob without `/` matches a name anywhere.
ignore = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The rule files' front matter.
serde_yaml = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-compaction = { path = "../../plugins/rig-compaction", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
serde_json = { workspace = true }
