[package]
name = "corpus-confirm-destructive"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 01. Confirm destructive shell commands"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
bevy_log = { workspace = true }
regex = { workspace = true }
rig-core = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The real `shell` tool the plugin takes the place of.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
