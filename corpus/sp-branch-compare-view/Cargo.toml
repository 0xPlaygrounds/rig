[package]
name = "corpus-sp-branch-compare-view"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-17: 17. Side-by-side branch comparison"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The two transcript panes, their looks, the keys and the header box.
rig-tui = { path = "../../plugins/rig-tui" }
# The session's effect log: what each turn of an earlier run spent.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
# The real `read` and `edit` tools, whose calls say what they touch and change.
rig-coding-tools = { path = "../../plugins/rig-coding-tools" }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
