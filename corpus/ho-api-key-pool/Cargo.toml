[package]
name = "corpus-ho-api-key-pool"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H05: API-key pool with failover"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Taking a failure over before compaction, which only takes overflows.
rig-compaction = { path = "../../plugins/rig-compaction" }
serde = { workspace = true, features = ["derive"] }
# `RIG_HOME/key-pool.toml` (already in Cargo.lock, through rig-harness).
toml = "1"

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
# The 429 and 401 replies of the scripted keys.
http = { workspace = true }
serde_json = { workspace = true }
