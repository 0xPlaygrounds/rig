[package]
name = "corpus-ho-api-key-pool"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (held-out): H05: API-key pool with failover"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# A request's head, kept to send it again on another key.
http = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# Unused since the pool wraps the transport; kept only so Cargo.lock does not
# change in this rework (drop it with the lock update).
rig-compaction = { path = "../../plugins/rig-compaction" }
serde = { workspace = true, features = ["derive"] }
# `RIG_HOME/key-pool.toml` (already in Cargo.lock, through rig-harness).
toml = "1"

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
