[package]
name = "corpus-chat-bridge"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 47. Chat bot bridge (Slack/Matrix)"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
rig-ecs = { path = "../../crates/rig-ecs" }
rig-harness = { path = "../../crates/rig-harness" }
# The `[chat]` settings table.
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
# The scripted `read` tool's arguments.
schemars = { workspace = true }
serde_json = { workspace = true }
