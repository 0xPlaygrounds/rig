[package]
name = "corpus-notify"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 50. Notifications"

[lints]
workspace = true

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The terminal view: its front, its focus and its writer.
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-core = { workspace = true, features = ["test-utils"] }
bevy_time = { workspace = true }
