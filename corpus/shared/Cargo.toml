[package]
name = "corpus-shared"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: The plugins other corpus plugins build on: confirmations, plan mode, protected paths, permission modes and few-shot examples."

[lints]
workspace = true

[dependencies]
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-basics = { path = "../../plugins/rig-basics", default-features = false }
rig-tools = { path = "../../crates/rig-tools" }
rig-tui = { path = "../../plugins/rig-tui" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { version = "1" }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
