[package]
name = "corpus-sp-shell-env-policy"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-01: 01. Environment policy for agent commands"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The policy's `allow` and `deny` globs.
glob = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The default `shell`'s output cut and timeout, for an agent's own shell.
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents" }
rig-tui = { path = "../../plugins/rig-tui" }
