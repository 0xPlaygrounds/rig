[package]
name = "corpus-sp-session-doctor-library"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-19: 19. Session doctor (library program) (library program)"

[lints]
workspace = true

[[bin]]
name = "session-doctor"
path = "src/main.rs"

[dependencies]
# A plain program on rig's library crates: no Bevy, no harness.
rig-core = { workspace = true }
rig-memory = { path = "../../crates/rig-memory", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
