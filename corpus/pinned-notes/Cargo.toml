[package]
name = "corpus-pinned-notes"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 27. Pinned notes that survive compaction"

[lints]
workspace = true

[features]
default = ["tui"]
# The "📌 n" status item.
tui = ["dep:rig-tui"]

[dependencies]
# Named by Bevy's derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The summary call a compaction makes, told about the pins.
rig-compaction = { path = "../../plugins/rig-compaction" }
# `inherit_pins` on `task`.
rig-subagents = { path = "../../plugins/rig-subagents" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
