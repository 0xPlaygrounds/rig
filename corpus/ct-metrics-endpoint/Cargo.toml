[package]
name = "corpus-ct-metrics-endpoint"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (conversation-over-time fresh held-out): CT-21: 21. Prometheus metrics endpoint"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The session's `/name`, its `session` label.
rig-sessions = { path = "../../plugins/rig-sessions", default-features = false }
# The process's logged errors, by plugin.
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
serde_json = { workspace = true }
