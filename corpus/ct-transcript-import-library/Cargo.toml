[package]
name = "corpus-ct-transcript-import-library"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (conversation-over-time fresh held-out): CT-25: 25. Build a session from a chat transcript (library program)"

[lints]
workspace = true

[dependencies]
# A plain program on rig's library crates: no Bevy, no harness.
rig-core = { workspace = true }
rig-memory = { path = "../../crates/rig-memory", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The launcher protocol (`rig::harness_protocol`: the rig home, session
# directories, names): std only, no Bevy.
rig = { path = "../..", default-features = false }

[[bin]]
name = "transcript-to-session"
path = "src/main.rs"

# Only to check that the harness resumes what the program writes.
[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness = { path = "../../crates/rig-harness" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
