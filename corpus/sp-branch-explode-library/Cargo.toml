[package]
name = "corpus-sp-branch-explode-library"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-14: 14. Branch explode (library program) (library program)"

[lints]
workspace = true

[[bin]]
name = "session-explode"
path = "src/main.rs"

[dependencies]
# A plain program on rig's library crates: no Bevy, no harness.
rig-core = { workspace = true }
rig-memory = { path = "../../crates/rig-memory", features = ["fs"] }
# The `RIG_HOME` layout (`rig::harness_protocol`: session ids, names and
# markers): std only, no Bevy.
rig = { path = "../..", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Only the test builds its fixture in the harness and resumes an output.
[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness = { path = "../../crates/rig-harness" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
