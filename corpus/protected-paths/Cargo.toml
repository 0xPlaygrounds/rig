[package]
name = "corpus-protected-paths"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus: 02. Protected paths"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
glob = { workspace = true }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tools = { path = "../../crates/rig-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Already in Cargo.lock (through the launcher's dependencies); parses paths.toml.
toml = "1"
# A call that names a protected path is refused before anyone asks about it.
corpus-confirm-destructive = { path = "../confirm-destructive" }

[dev-dependencies]
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-cassette = { workspace = true }
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
