[package]
name = "corpus-oc-architect-editor"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (one-conversation fresh held-out): OC-15: 15. Architect and editor models"

[lints]
workspace = true

[features]
default = ["tui"]
# How the terminal view draws an `implement` call with the editor's work
# under it.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
# The pool the listed files are read on.
bevy_tasks = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
# The editor is a helper agent spawned with `SpawnSubagent`.
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
# The `implement` call's look.
rig-tui = { path = "../../plugins/rig-tui", optional = true }
# The `implement` tool's parameters.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-coding-tools = { path = "../../plugins/rig-coding-tools", default-features = false }
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
