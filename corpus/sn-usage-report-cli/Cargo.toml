[package]
name = "corpus-sn-usage-report-cli"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-24: 24. `rig usage` report from the shell"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
# Local calendar days for `--since`, `--until` and `--by day`.
chrono = { workspace = true, features = ["clock"] }
rig-cassette = { workspace = true, features = ["jsonl"] }
rig-core = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
rig-subagents = { path = "../../plugins/rig-subagents", default-features = false }
rig-telemetry = { path = "../../plugins/rig-telemetry", default-features = false }
