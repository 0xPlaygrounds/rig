[package]
name = "corpus-sp-branch-cherry-pick"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (splits fresh held-out): SP-13: 13. Cherry-pick turns between branches"

[lints]
workspace = true

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-defaults-test-support = { path = "../../test-support/rig-defaults-test-support" }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# The terminal view the picker is drawn in, without a terminal.
rig-tui = { path = "../../plugins/rig-tui" }
schemars = { workspace = true }
