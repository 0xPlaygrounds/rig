[package]
name = "corpus-sn-plugin-profiler"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Plugin corpus (stack-next fresh held-out): SN-21: 21. Which plugin is slowing me down"

[lints]
workspace = true

[features]
default = ["tui"]
# Timing the terminal view's key bindings, for stalls while handling a key.
tui = ["dep:rig-tui"]

[dependencies]
# Named by the Bevy derives.
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
rig-harness = { path = "../../crates/rig-harness" }
rig-tui = { path = "../../plugins/rig-tui", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
schemars = { workspace = true }
