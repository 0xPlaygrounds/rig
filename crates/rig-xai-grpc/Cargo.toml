[package]
name = "rig-xai-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Rig's code is MIT; the vendored xAI protos under `proto/` are Apache-2.0.
license = "MIT AND Apache-2.0"
readme = "README.md"
description = "xAI gRPC API integration for Rig"
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false }
async-stream = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-webpki-roots", "zstd", "gzip"] }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
protoc-bin-vendored = "3"

[dev-dependencies]
anyhow = { workspace = true }
rig-agent.workspace = true
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false, features = [
    "test-utils",
] }
tokio = { workspace = true, features = ["full"] }
