[package]
name = "rig-verify"
version = "0.0.0"
edition = { workspace = true }
publish = false
description = "The effect bus's behavioural verification suite: properties over the public API of rig-core and rig-agent. Not published; builds in seconds because it depends on nothing else."

[lints]
workspace = true

[lib]
doctest = false

[dependencies]

[dev-dependencies]
rig-core = { path = "../rig-core", features = ["test-utils"] }
rig-agent = { path = "../rig-agent" }
rig-bus = { path = "../rig-bus" }
rig-ecs = { path = "../rig-ecs" }
rig-effect-log = { path = "../rig-effect-log" }
# The world interpreter (tests/world_replay.rs) builds its own App.
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
futures = { workspace = true }
proptest = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
