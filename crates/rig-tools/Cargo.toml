[package]
name = "rig-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Coding tools for Rig agents: read, write, edit, search and shell, and the file and process helpers they share."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
# Images attached to a message.
base64 = { workspace = true }
# The answer of a tool's blocking work.
futures = { workspace = true }
# `search` walks the tree as git ignores it.
ignore = { workspace = true }
# `Local::watch` hears of changes from the system instead of polling.
notify = { workspace = true }
regex = { workspace = true }
rig-core = { path = "../rig-core", version = "0.45.0", default-features = false }
# Each tool's parameters, derived from its arguments type.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The unified diff `edit` returns.
similar = { workspace = true }
# Why a checkpoint of a call could not be taken.
tracing = { workspace = true }
# `shorten` cuts by the columns a terminal draws.
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

# The tools' hot paths on generated files (`cargo bench -p rig-tools --bench
# tools`). CI only compiles it.
[[bench]]
name = "tools"
harness = false
