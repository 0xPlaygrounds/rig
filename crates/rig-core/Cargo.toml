[package]
name = "rig-core"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
exclude = [
    "tests/macro_hygiene.rs",
    "tests/fixtures/telemetry_macro_consumer",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_core"
path = "src/lib.rs"
doctest = true

[dependencies]
as-any = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
epub = { workspace = true, optional = true }
futures = { workspace = true }
glob = { workspace = true }
indexmap = { workspace = true }
lopdf = { workspace = true, optional = true }
mime_guess = { workspace = true }
ordered-float = { workspace = true }
quick-xml = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
rig-derive = { version = "0.42.0", path = "../rig-derive", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
http = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }
fastrand = { workspace = true }
eventsource-stream = { workspace = true }
pin-project-lite = { workspace = true }
futures-timer = { workspace = true }
mime = { workspace = true }
# The bundled transport, behind the non-default `reqwest` feature. rig-core
# stays transport-agnostic by default: nothing below is compiled unless the
# feature is named.
reqwest = { workspace = true, optional = true, features = [
  "json",
  "stream",
  "multipart",
] }
reqwest-middleware = { workspace = true, optional = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
] }
# futures-timer's default backend uses a background timer thread, which cannot
# drive timers on wasm. Pull in its wasm-bindgen (setTimeout) backend whenever
# the target is browser wasm — regardless of feature flags — so
# `wasm_compat::timeout` and the SSE retry backoff actually fire instead of
# hanging. Scoped to `target_os = "unknown"` (browser) rather than the whole
# `wasm` family because the gloo-timers/setTimeout backend needs a JS host and
# would be wrong-by-construction on WASI.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
# `lopdf` pulls `getrandom` through its PDF encryption support. Browser WASM
# cannot select a randomness backend from the target triple alone, so opt in to
# lopdf's Web Crypto backend only for Rig's supported browser target.
lopdf = { workspace = true, optional = true, features = ["wasm_js"] }

# The bundled transport needs a tokio reactor on native. When the caller has
# none (Bevy task pools, smol, futures::executor), `http_client::runtime`
# lazily starts a single-threaded fallback runtime and drives reqwest futures
# there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, optional = true, features = [
  "rt",
  "rt-multi-thread",
  "time",
] }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
# Self-dependency: feature unification compiles the lib with `test-utils`
# for every rig-core test target (unit, integration, doctest), so the
# sequence laws panic in ALL of rig's own suites while staying log-only in
# downstream builds.
rig-core = { path = ".", features = ["test-utils"] }
# identity-leak compile-fail tests (tests/identity_leak.rs)
# 1.0.111: the compiler-output normalization the trybuild cases were written against.
trybuild = "1.0.111"
# streaming identity/merge law property tests
proptest = "1"
assert_fs = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-test = { workspace = true }
# the moved websocket conformance suite drives a local ws server
tokio-tungstenite = { workspace = true, features = ["handshake"] }
redis = { workspace = true, features = ["tokio-comp", "aio", "vector-sets"] }
serde_path_to_error = { workspace = true }
base64 = { workspace = true }
# required for otel
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }


[features]
default = ["derive"]
audio = []
image = []
# The bundled reqwest transport. Deliberately NOT default: rig-core names no
# transport unless asked, so wasm and custom-transport consumers pay nothing.
# The `rig` facade turns it on in its own default set, so the common path is
# unchanged.
reqwest = ["dep:reqwest", "dep:tokio"]
socks = ["reqwest", "reqwest/socks"]
rustls = [
  "reqwest",
  "reqwest/rustls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "tokio-tungstenite?/rustls-tls-webpki-roots",
]
native-tls = [
  "reqwest",
  "reqwest/native-tls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "tokio-tungstenite?/native-tls",
]
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-rustls = ["dep:reqwest-middleware", "rustls", "reqwest-middleware/rustls"]
reqwest-middleware-native-tls = ["dep:reqwest-middleware", "native-tls"]
# `websocket` is a convenience alias for the rustls flavor. The module gates on
# either flavor, so `websocket-native-tls` alone yields a usable module too.
websocket = ["websocket-rustls"]
websocket-rustls = ["dep:tokio-tungstenite", "tokio-tungstenite/connect", "rustls"]
websocket-native-tls = ["dep:tokio-tungstenite", "tokio-tungstenite/connect", "native-tls"]
derive = ["dep:rig-derive"]
test-utils = []
pdf = ["dep:lopdf"]
epub = ["dep:epub", "dep:quick-xml"]
rayon = ["dep:rayon"]
