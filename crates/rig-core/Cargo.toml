[package]
name = "rig-core"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
exclude = [
    "tests/macro_hygiene.rs",
    "tests/fixtures/telemetry_macro_consumer",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_core"
path = "src/lib.rs"
doctest = true

[dependencies]
rig-http = { workspace = true }
rig-reqwest = { path = "../rig-reqwest", version = "0.42.0", optional = true, default-features = false }
async-stream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
epub = { workspace = true, optional = true }
futures = { workspace = true }
glob = { workspace = true }
lopdf = { workspace = true, optional = true }
mime_guess = { workspace = true }
ordered-float = { workspace = true }
quick-xml = { workspace = true, optional = true }
rig-derive = { version = "0.42.0", path = "../rig-derive", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
http = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }
fastrand = { workspace = true }
mime = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-tungstenite = { path = "../rig-tungstenite", version = "0.42.0", optional = true, default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio-tungstenite = { workspace = true, features = ["handshake"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `lopdf` pulls `getrandom` through its PDF encryption support. Browser WASM
# cannot select a randomness backend from the target triple alone, so opt in to
# lopdf's Web Crypto backend only for Rig's supported browser target.
lopdf = { workspace = true, optional = true, features = ["wasm_js"] }

[dev-dependencies]
anyhow = { workspace = true }
# Self-dependency: feature unification compiles the lib with `test-utils`
# for every rig-core test target (unit, integration, doctest), so the
# sequence laws panic in ALL of rig's own suites while staying log-only in
# downstream builds.
rig-core = { path = ".", features = ["test-utils", "websocket"] }
# streaming identity/merge law property tests
proptest = "1"
assert_fs = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-test = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "aio", "vector-sets"] }
serde_path_to_error = { workspace = true }
base64 = { workspace = true }
# required for otel
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }


[features]
# A TLS policy alone does not activate either optional transport. Standalone
# `--features reqwest` supports HTTPS; native-only TLS selects no defaults.
default = ["derive", "rustls"]
audio = []
image = []
derive = ["dep:rig-derive"]
test-utils = ["rig-http/test-utils"]
pdf = ["dep:lopdf"]
epub = ["dep:epub", "dep:quick-xml"]
# Contracts are portable; bundled websocket execution is native-only.
websocket = ["rig-http/websocket"]
reqwest = ["dep:rig-reqwest"]
tungstenite = ["websocket", "dep:rig-tungstenite"]
rustls = ["rig-reqwest?/rustls", "rig-tungstenite?/rustls"]
native-tls = ["rig-reqwest?/native-tls", "rig-tungstenite?/native-tls"]

[[test]]
name = "default_transport_no_ca_store"
required-features = ["reqwest", "rustls"]

[[test]]
name = "streaming_conformance_websocket"
required-features = ["tungstenite"]

[[test]]
name = "websocket_off_runtime"
required-features = ["tungstenite"]

[[test]]
name = "websocket_handshake_rejection"
required-features = ["tungstenite"]
