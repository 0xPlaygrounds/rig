        rebuild: "Copy the streaming control and, in the recorded response stream only, replace the last `input_json_delta`'s `partial_json` with `\"\\u0001}\"` so the assembled input is invalid JSON; the request section stays byte-identical to the control's. `assert_fixture_is_corrupt` re-asserts the control byte."
