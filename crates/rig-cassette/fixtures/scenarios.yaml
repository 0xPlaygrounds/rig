        reason: "The same corruption plus the two follow-up turns the `Retry` recovery issues."
        rebuild: "Apply the control-byte edit as above, then derive two follow-ups from the control's turn 2: the healthy tool call, then the tool-result follow-up carrying the full five-message history, each answered with the control's own recorded responses."
