      - "with_openai_tool_lifecycle_cassette_result"
      - "with_openai_terminal_metadata_cassette_result"
      - "with_openai_history_roundtrip_cassette_result"
      - "with_openai_transcription_cassette"
      - "with_openai_audio_cassette"
      - "with_openai_websocket_cassette"
    live:
      - "response_metadata_matrix/numeric_top_p_blocking_tool_call"
      - "response_metadata_matrix/numeric_top_p_streaming_terminal_usage"
      - "stateless_replay_matrix/phase_round_trips_on_follow_up"
    derived:
      - scenario: "response_metadata_matrix/object_top_p_blocking_tool_call"
        sources:
          - "openai/response_metadata_matrix/numeric_top_p_blocking_tool_call"
        reason: "Pins the object-shaped `top_p` echo an OpenAI-compatible gateway returns and the real OpenAI API never will (#2483)."
        rebuild: "Copy the numeric sibling fixture and, in every response body only, replace each `\"top_p\":1.0` with `\"top_p\":{\"value\":1.0}`; leave every request byte identical so replay still matches. `assert_recorded_top_p_is_object` re-asserts the edit from the fixture's own bytes."
      - scenario: "response_metadata_matrix/object_top_p_streaming_terminal_usage"
        sources:
          - "openai/response_metadata_matrix/numeric_top_p_streaming_terminal_usage"
        reason: "The same object-shaped `top_p`, on the streaming terminal frame that carries usage (#2493)."
        rebuild: "Copy the numeric streaming sibling and apply the same `top_p` substitution inside the `data:` payload of every SSE frame that echoes it; requests untouched."
      - scenario: "stateless_replay_matrix/compaction_item_decodes_on_the_response"
        sources:
          - "openai/stateless_replay_matrix/phase_round_trips_on_follow_up"
        reason: "A `compaction` item cannot be captured through rig: the client has no `/responses/compact` call (#2269)."
        rebuild: "Copy the round-trip cell and insert a `compaction` item at the head of turn 2's request `input[]` and at the head of turn 1's response `output[]`, in the shape `/responses/compact` returns; every other byte identical."
    unrecorded:
      - scenario: "corpus_matrix_chat/shaping_thinking_second_turn"
        reason: "gpt-5-mini low reported zero reasoning tokens on the second turn in all three attempts; record-openai-chat-shaping-thinking-second-turn-attempt-{1,2,3}.log; three attempts exhausted"
      - scenario: "corpus_matrix_responses/causal_completion_concurrent"
        reason: "gpt-5-mini on the Responses wire calls `lookup` with `leaf: true`, so the tool answers without nesting a completion; three recordings agreed"
      - scenario: "corpus_matrix_responses/causal_completion_serial"
        reason: "gpt-5-mini on the Responses wire calls `lookup` with `leaf: true`, so the tool answers without nesting a completion; three recordings agreed"
      - scenario: "corpus_matrix_responses/causal_completion_streamed"
        reason: "gpt-5-mini on the Responses wire calls `lookup` with `leaf: true`, so the tool answers without nesting a completion; three recordings agreed"
      - scenario: "corpus_matrix_responses/shaping_max_tokens_second_turn"
        reason: "the Responses wire's `max_output_tokens` floor is 16; the corpus's second-turn cap is 5"
      - scenario: "corpus_matrix_responses/shaping_thinking_second_turn"
        reason: "the Responses wire's `max_output_tokens` floor is 16; the corpus's second-turn cap is 5"
      - scenario: "reasoning_matrix_chat/text_unary"
        reason: "gpt-5-mini at reasoning_effort low reported zero reasoning tokens in attempts 1, 2 and 3 (2026-09-13, record-openai-chat-text-unary-attempt-{1,2,3}.log); exhausted the prompt's three-attempt limit"
      - scenario: "reasoning_matrix_chat/tool_streamed"
        reason: "gpt-5-mini low reported zero reasoning tokens on the second turn in all three attempts; record-openai-chat-shaping-thinking-second-turn-attempt-{1,2,3}.log; three attempts exhausted"
      - scenario: "reasoning_matrix_chat/tool_unary"
        reason: "gpt-5-mini low reported zero reasoning tokens on the second turn in all three attempts; record-openai-chat-shaping-thinking-second-turn-attempt-{1,2,3}.log; three attempts exhausted"
      - scenario: "reasoning_matrix_responses/off"
        reason: "the Responses wire's `max_output_tokens` floor is 16; the corpus's second-turn cap is 5"
      - scenario: "reasoning_matrix_responses/tool_unary"
        reason: "gpt-5-mini low: attempts 1 and 3 reported zero reasoning tokens on the tool turn; attempt 2 failed an over-strict final-turn assertion before cassette export; record-openai-responses-tool-unary-attempt-{1,2,3}.log; three attempts exhausted"
    scripted:
      - family: "openai_compatible_reasoning_content"
        fixture: "openai_compatible/reasoning_content_tool_roundtrip"
        module: "tests/providers/openai/cassette/openai_compatible_reasoning_content.rs"
        sources: []
        reason: "Handwritten Responses replies from the former LocalReasoningContentServer, not live provider traffic. Maintain the fixture manually and replay its round-trip test."
        cases:
          - "nonstreaming_reasoning_content_tool_roundtrip"
      - family: "ecs_faults_chat"
        module: "tests/providers/openai/cassette/ecs_faults_chat.rs"
        sources:
          - "openai/corpus_faults_chat/setup_unary"
          - "openai/corpus_matrix_chat/hooks_patch_tool_args_streamed"
          - "openai/corpus_matrix_chat/shaping_extra_context_streamed"
        reason: "Cuts, rewrites and status-substitutes the Chat wire's own recorded streams: truncated prefixes, in-band error frames, refusal and content-filter terminals, empty transports, and the recorded setup failure replayed under 429/503."
        cases: &ecs_fault_cases
          - "cancel_at_first_tool_call_delta"
          - "error_after_text"
          - "failing_load"
          - "failing_load_streamed"
          - "filtered_empty"
          - "filtered_with_text"
          - "refusal"
          - "status_429"
          - "status_503"
          - "status_503_retried"
          - "truncated_after_text"
          - "truncated_after_tool_call"
      - family: "ecs_faults_responses"
        module: "tests/providers/openai/cassette/ecs_faults_responses.rs"
        sources:
          - "openai/corpus_faults_responses/setup_unary"
          - "openai/corpus_matrix_responses/hooks_patch_tool_args_streamed"
          - "openai/corpus_matrix_responses/shaping_extra_context_streamed"
        reason: "The same injected failures on the Responses wire: truncated prefixes, in-band `error` events, refusal parts, empty transports, and the recorded setup failure replayed under 429/503."
        cases: *ecs_fault_cases
      - family: "ecs_matrix_long_loop_chat"
        module: "tests/providers/openai/cassette/ecs_matrix_long_loop_chat.rs"
        sources:
          - "openai/corpus_faults_chat/setup_unary"
          - "openai/long_loop_matrix_chat/long_unary"
        reason: "Replays the Chat long-loop recording through a sequenced transport with one turn rewritten: tool arguments of the wrong type, or a retryable 503 inserted before turn k."
        cases: &long_loop_fault_cases
          - "invalid_args_midway"
          - "provider_fault_midway"
      - family: "ecs_matrix_long_loop_responses"
        module: "tests/providers/openai/cassette/ecs_matrix_long_loop_responses.rs"
        sources:
          - "openai/corpus_faults_responses/setup_unary"
          - "openai/long_loop_matrix_responses/long_unary"
        reason: "Replays the Responses long-loop recording through a sequenced transport with one turn rewritten: tool arguments of the wrong type, or a retryable 503 inserted before turn k."
        cases: *long_loop_fault_cases
      - family: "ecs_stream_faults"
        module: "tests/providers/openai/cassette/ecs_stream_faults.rs"
        sources: &openai_stream_sources
          - "openai/streaming/streaming_smoke"
          - "openai/streaming_tools/streaming_tools_smoke"
        reason: "The ECS twin of this provider's `stream_faults` family: the same cut and error-terminated streams, driven through the runtime rather than the agent runner."
        cases: &openai_stream_fault_cases
          - "error_event_after_content_fails_with_the_provider_error"
          - "truncation_after_a_complete_tool_call_never_runs_the_tool"
          - "truncation_after_content_fails_the_run_and_keeps_the_prefix"
      - family: "stream_faults"
        module: "tests/providers/openai/cassette/stream_faults.rs"
        sources: *openai_stream_sources
        reason: "Serves a recorded stream cut before its item completes, or followed by the error frame the adapter's own unit tests pin, through the sequenced transport instead of the cassette proxy."
        cases: *openai_stream_fault_cases
