        reason: "The same corruption plus the `Skip` recovery's follow-up turn, whose request history no live capture produces."
        rebuild: "Apply the control-byte edit as above, then derive turn 2's request from the control's turn 2 by substituting the recovery history (the malformed call with `{}` input plus a `tool_result` carrying the hook's text) and answer it with the control's own recorded final-text response."
