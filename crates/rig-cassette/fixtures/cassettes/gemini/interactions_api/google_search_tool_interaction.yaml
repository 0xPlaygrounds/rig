ZIYQECwRZ457wUMyVq1Mbn6eGuLk1evo26K8ZuGuOJMqflvzi9uTjvobwa4xnL1EaMTEawkilF_UX9VwdaK9-Vc08z860P8R9_Zjo2qrhJQBDziJNUU6q_sZwVZBYaIKUhd6Xn"},{"end_index":707,"start_index":588,"title":"wikipedia.org","type":"url_citation","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHoJfueYw75SL9AtPvxqmfptv_8hWNTUdidUvh2O_pndJZXz2HHAaGT5TsZOL7x5-k3VmKUdGDzisUvZ2nQH0eyTvP4XhdxAaG-CWIOB6VjUlAlmZ2w4McDH1ltB9qv9NWgRZFYcMPFeg=="}],"text":"**Spain** won the UEFA Euro 2024 tournament, defeating England **2–1** in the final held on July 14, 2024, at the Olympiastadion in Berlin.\n\nKey details of Spain''s victory include:\n*   **Final Scorers:** Nico Williams opened the scoring for Spain in the 47th minute. After England''s Cole Palmer equalized in the 73rd minute, Mikel Oyarzabal scored the winning goal for Spain in the 86th minute.\n*   **Record-Breaking Title:** This was Spain''s fourth European Championship title (following wins in 1964, 2008, and 2012), making them the most successful team in the tournament''s history.\n*   **Perfect Run:** Spain became the first team to win all seven matches in a single European Championship tournament.\n*   **Individual Awards:** Spain''s **Rodri** was named the Player of the Tournament, and **Lamine Yamal** was named the Young Player of the Tournament.","type":"text"}],"type":"model_output"}],"updated":"1970-01-01T00:00:00Z","usage":{"grounding_tool_count":[{"count":1,"search_query_count":1,"type":"google_search"}],"input_tokens_by_modality":[{"modality":"text","tokens":50}],"model_invocation_token_counts":[{"candidates_tokens_details":[{"modality":"text","tokens":26}],"prompt_tokens_details":[{"modality":"text","tokens":188}],"thoughts_tokens_details":[{"modality":"text","tokens":38}]},{"candidates_tokens_details":[{"modality":"text","tokens":233}],"prompt_tokens_details":[{"modality":"text","tokens":5753}],"thoughts_tokens_details":[{"modality":"text","tokens":166}]}],"non_grounding_model_invocation_token_counts":[{"cand