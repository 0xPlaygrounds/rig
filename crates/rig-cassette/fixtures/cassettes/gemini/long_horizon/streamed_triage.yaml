                            0\ngood first issue       1      1                            0\n"}},{"text":"The open issues mentioning the lexer are:\n\n- **#41**: lexer panics on empty input (labels: `bug`)\n- **#57**: lexer is slow on large files (labels: `bug`, `perf`)\n- **#63**: lexer drops trailing comments (labels: `bug`, `good first issue`)\n\n---\n\n### Label Count Comparison (Parser vs. Lexer)\n\n| Label | Parser Count | Lexer Count | Difference |\n| :--- | :---: | :---: | :---: |\n| **bug** | 3 | 3 | 0 |\n| **perf** | 1 | 1 | 0 |\n| **good first issue** | 1 | 1 | 0 |\n\nBoth sets of issues have an identical label distribution."},{"text":"","thoughtSignature":""}],"role":"model"},{"parts":[{"text":"Which single label is most common across both searches?"}],"role":"user"}],"generationConfig":{"thinkingConfig":{"includeThoughts":true}},"systemInstruction":{"parts":[{"text":"You triage issues. Use search_issues, then count with code."}]},"toolConfig":{"includeServerSideToolInvocations":true},"tools":[{"functionDeclarations":[{"description":"Search open issues. Returns id, title and labels.","name":"search_issues","parametersJsonSchema":{"properties":{"query":{"type":"string"}},"required":["query"],"type":"object"}}]},{"codeExecution":{}}]}'
