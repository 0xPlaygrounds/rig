  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"messages":[{"content":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"content":"The user wants to know the current weather in Tokyo, Japan. I''ll call the get_weather tool to get the weather data.Sure! Let me check the current weather in Tokyo right away!","role":"assistant","tool_calls":[{"function":{"arguments":{"city":"Tokyo, Japan"},"name":"get_weather"},"id":"toolu_01A4omUVVJHVoNTG7baPsK2U","type":"function"}]},{"content":"Weather in Tokyo, Japan: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_call_id":"toolu_01A4omUVVJHVoNTG7baPsK2U","tool_name":"get_weather"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"qwen3:4b","options":{"num_predict":1024},"stream":false,"think":false,"tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: application/json; charset=utf-8
  body: '{"created_at":"1970-01-01T00:00:00Z","done":true,"done_reason":"stop","eval_count":333,"eval_duration":5107615123,"load_duration":14893941209,"message":{"content":"Okay, let''s see. The user asked if they should pack an umbrella or sunscreen based on the weather in Tokyo. The tool response says it''s 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW.\n\nHmm, sunny with light clouds. So the main thing here is whether it''s raining or not. Since it''s sunny with light clouds, probably not raining. But they mentioned light clouds, which sometimes can mean a chance of rain, but the description says \"sunny with light clouds,\" which might be a clear sky with some clouds. The wind is 8 mph NW, which isn''t strong. Humidity is 4:45%, which is a bit low, so probably not humid enough for rain.\n\nWait, the user wants to know if they should pack an umbrella or sunscreen. Umbrella is for rain, sunscreen for sun. Since it''s sunny, they should pack sunscreen. But the weather says \"sunny with light clouds,\" so it''s likely that the sun is out, so sunscreen is needed. There''s no mention of rain, so no umbrella. The answer should be that they should pack sunscreen because it''s sunny.\n\nLet me check again. The tool response: \"sunny with light clouds\" – so the primary condition is sunny. Light clouds might mean scattered clouds, but not enough to cause rain. So sunscreen is the right choice. Umbrella would be for rain, which isn''t indicated here. So the answer is to pack sunscreen.\n</think>\n\nBased on the current weather in Tokyo being sunny with light clouds, you should pack sunscreen.","role":"assistant"},"model":"qwen3:4b","prompt_eval_count":369,"prompt_eval_duration":5798328417,"total_duration":26464575209}'
