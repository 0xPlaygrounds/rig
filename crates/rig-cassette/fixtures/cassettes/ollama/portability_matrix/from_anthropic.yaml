  body: '{"messages":[{"content":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"content":"Sure! Let me check the current weather in Tokyo right away!","role":"assistant","thinking":"The user wants to know the current weather in Tokyo, Japan. I''ll call the get_weather tool for Tokyo.","tool_calls":[{"function":{"arguments":{"city":"Tokyo"},"name":"get_weather"},"id":"toolu_017BvVzjTGv88pPQmjCJJjGm","type":"function"}]},{"content":"Weather in Tokyo: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_call_id":"toolu_017BvVzjTGv88pPQmjCJJjGm","tool_name":"get_weather"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"qwen3:4b","options":{"num_predict":1024},"stream":false,"think":false,"tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: application/json; charset=utf-8
  body: '{"created_at":"1970-01-01T00:00:00Z","done":true,"done_reason":"stop","eval_count":342,"eval_duration":5387153880,"load_duration":3999299584,"message":{"content":"Okay, let''s see. The user wants to know if they should pack an umbrella or sunscreen based on the weather in Tokyo. The tool response says it''s sunny with light clouds, 72F (22C), humidity 45%, wind 8 mph NW.\n\nFirst, I need to figure out what the weather conditions imply. Sunny with light clouds usually means there''s some sun but not heavy rain. The presence of light clouds might suggest that it''s not raining heavily, but maybe there''s a chance of occasional rain. However, the user is asking specifically about umbrella or sunscreen.\n\nSunscreen is typically for when there''s direct sun, which is indicated here since it''s sunny. Umbrella is for rain. The weather description says \"sunny with light clouds,\" so it''s probably not raining. The humidity is 45%, which is low, so less likely to have rain. Wind is 8 mph NW, which isn''t strong enough to cause rain.\n\nSo, since it''s sunny, they should pack sunscreen. There''s no mention of rain, so no need for an umbrella. The answer should be concise: \"Since it''s sunny with light clouds, you should pack sunscreen but not an umbrella.\"\n\nWait, the user wants one sentence. Let me check again. The tool response says \"sunny with light clouds\". So, the main point is sun exposure. Sunscreen is needed for sun protection. Umbrella is for rain. Since it''s not raining (the weather doesn''t mention rain), no umbrella. So the answer is to pack sunscreen.\n</think>\n\nSince it''s sunny with light clouds in Tokyo, you should pack sunscreen but not an umbrella.","role":"assistant"},"model":"qwen3:4b","prompt_eval_count":339,"prompt_eval_duration":2049313750,"total_duration":12103927584}'
