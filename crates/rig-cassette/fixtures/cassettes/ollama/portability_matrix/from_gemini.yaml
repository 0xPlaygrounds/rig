when:
  path: /api/chat
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"messages":[{"content":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"content":"","role":"assistant","thinking":"**My Weather-Based Packing Considerations**\n\nOkay, so someone''s asking about the current Tokyo weather and whether they need an umbrella or sunscreen. That''s a straightforward request. My process here is pretty clear: I need to utilize the `get_weather` tool. The key is to specify the city correctly; \"Tokyo, Japan\" translates to just \"Tokyo\" as the city input for the tool. I will send that parameter to the weather tool now.\n\nOnce I have the weather data, I''ll quickly analyze it. High probability of rain? Umbrella recommendation. Bright sunshine? Definitely sunscreen. The goal is a concise, actionable response: a brief weather update and a clear packing suggestion. Easy enough!\n","tool_calls":[{"function":{"arguments":{"city":"Tokyo"},"name":"get_weather"},"type":"function"}]},{"content":"Weather in Tokyo: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_name":"get_weather"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"qwen3:4b","options":{"num_predict":1024},"stream":false,"think":false,"tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: application/json; charset=utf-8
  body: '{"created_at":"1970-01-01T00:00:00Z","done":true,"done_reason":"stop","eval_count":353,"eval_duration":5720302104,"load_duration":4260809875,"message":{"content":"Okay, let''s see. The user wants to know if they should pack an umbrella or sunscreen based on the current weather in Tokyo. The tool response says it''s 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW.\n\nFirst, I need to figure out what the weather conditions imply. Sunny with light clouds usually means there''s some sun but not heavy rain. The humidity is 45%, which is a bit low, so maybe not too much moisture in the air. Wind is 8 mph from the northwest, which isn''t strong.\n\nUmbrella is typically for rain, but the description says \"sunny with light clouds,\" so maybe there''s a chance of light rain? But the user is asking based on the retrieved weather. The tool response doesn''t mention rain, just sunny with light clouds. So probably no rain expected. Sunscreen is for sun exposure. Since it''s sunny, they should pack sunscreen.\n\nWait, the question is whether to pack an umbrella or sunscreen. The answer should be based on the current conditions. If it''s sunny, sunscreen is needed. Umbrella would be for rain. Since there''s no rain mentioned here (it''s sunny with light clouds), maybe no umbrella needed. So the answer is sunscreen.\n\nBut the user says \"should I pack an umbrella or sunscreen?\" So the answer is sunscreen because it''s sunny. Let me check again. The tool response says \"sunny with light clouds\" so the main thing is sun, so sunscreen. No rain mentioned, so no umbrella. So the answer is to pack sunscreen.\n</think>\n\nBased on Tokyo''s current sunny conditions with light clouds, you should pack sunscreen but not an umbrella.","role":"assistant"},"model":"qwen3:4b","prompt_eval_count":326,"prompt_eval_duration":3208533708,"total_duration":13845036041}'
