when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"max_tokens":1024,"messages":[{"content":[{"text":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","type":"text"}],"role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"content":"**Analyzing the Weather Query**\n\nOkay, so I have a user who needs a weather update for Tokyo. They''re trying to figure out if they should pack an umbrella or sunscreen, a pretty standard query. My process here is straightforward: I need to use the `get_weather` tool. The first step, obviously, is to call that tool, providing it with the necessary information. Let''s see, the city is Tokyo, so I''ll feed `get_weather` the argument `city=''Tokyo''`. Once I have the data from the tool call, then I''ll analyze it for the precipitation levels and sun levels so that I can provide advice on an umbrella or sunscreen.\n","role":"assistant","tool_calls":[{"function":{"arguments":"{\"city\":\"Tokyo\"}","name":"get_weather"},"id":"tool-0","type":"function"}]},{"content":"Weather in Tokyo: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_call_id":"tool-0"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"qwen3:4b","reasoning_effort":"none","tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: application/json
  body: '{"choices":[{"finish_reason":"stop","index":0,"message":{"content":"Okay, let''s see. The user wants to know if they should pack an umbrella or sunscreen based on the weather in Tokyo. I already called the get_weather tool and got the results: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW.\n\nFirst, I need to interpret the weather conditions. It''s sunny with light clouds. So, there''s some sun, but light clouds might mean less rain. The humidity is 45%, which is moderate. The wind is 8 mph from the northwest, which probably isn''t a lot.\n\nFor an umbrella: Usually, umbrellas are for rain. If there''s light clouds but no mention of rain, maybe it''s not necessary. The description says \"sunny with light clouds,\" so maybe it''s not raining. So probably no need for an umbrella.\n\nSunscreen: Since it''s sunny, there''s a lot of sun, so sunscreen is likely needed. The light clouds might not block the sun much, so sunscreen would be a good idea.\n\nThe user is asking to choose between umbrella or sunscreen. The weather report doesn''t mention rain, just light clouds and sunny. So they should pack sunscreen, not an umbrella. Need to phrase it in one sentence.\n</think>\n\nBased on Tokyo''s current weather of sunny with light clouds, you should pack sunscreen but not an umbrella.","role":"assistant"}}],"created":0,"id":"chatcmpl-271","model":"qwen3:4b","object":"chat.completion","system_fingerprint":"fp_ollama","usage":{"completion_tokens":283,"prompt_tokens":464,"total_tokens":747}}'
