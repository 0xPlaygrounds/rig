caller":{"type":"direct"},"id":"toolu_01XC5zKU1qeXbdE7kLNYNtMy","input":{"order_id":"B-1"},"name":"lookup_order","type":"tool_use"},{"caller":{"type":"direct"},"id":"toolu_01DHzD1nM7zsPfVQiF1xtX73","input":{"order_id":"B-2"},"name":"lookup_order","type":"tool_use"}],"role":"assistant"},{"content":[{"content":[{"text":"{\"order_id\":\"B-1\",\"status\":\"returned\",\"date\":\"2026-05-06\"}","type":"text"}],"tool_use_id":"toolu_01XC5zKU1qeXbdE7kLNYNtMy","type":"tool_result"},{"content":[{"text":"{\"order_id\":\"B-2\",\"status\":\"processing\",\"date\":\"2026-05-07\"}","type":"text"}],"tool_use_id":"toolu_01DHzD1nM7zsPfVQiF1xtX73","type":"tool_result"}],"role":"user"},{"content":[{"text":"Order B-1 was returned on May 6, 2026. A refund follows once the return is inspected, usually within five business days.\n\nOrder B-2 is still processing, with a date of May 7, 2026. It hasn''t shipped yet, and you''ll get a shipping email once it does.","type":"text"}],"role":"assistant"},{"content":[{"text":"What time is it at the warehouse right now?","type":"text"}],"role":"user"},{"content":[{"caller":{"type":"direct"},"id":"toolu_01GPxdUcJxu28G2Go2xrUeZj","input":{},"name":"warehouse_time","type":"tool_use"}],"role":"assistant"},{"content":[{"content":[{"text":"{\"time\":\"14:05\",\"timezone\":\"UTC\"}","type":"text"}],"tool_use_id":"toolu_01GPxdUcJxu28G2Go2xrUeZj","type":"tool_result"}],"role":"user"},{"content":[{"text":"The warehouse time is 14:05 UTC.","type":"text"}],"role":"assistant"},{"content":[{"text":"List all my orders, whatever their status.","type":"text"}],"role":"user"},{"content":[{"caller":{"type":"direct"},"id":"toolu_01W3FJZU9GBDb9kR21KZ4HQQ","input":{},"name":"list_orders","type":"tool_use"}],"role":"assistant"},{"content":[{"content":[{"text":"[{\"order_id\":\"A-1\",\"status\":\"shipped\"},{\"order_id\":\"A-2\",\"status\":\"delivered\"},{\"order_id\":\"B-1\",\"status\":\"shipped\"}]","type":"text"}],"tool_use_id":"toolu_01W3FJZU9GBDb9kR21KZ4HQQ","type":"tool_result"}],"role":"user"},{"content":[{"signature":"","thinking":"","type":"thinking"},{"text":"Here are the orders the list returned:\n\n- A-1: shipped\n- A-2: delivered\n- B-1: shipped\n\nThese don''t match my earlier lookups. Those showed A-1 as cancelled, A-2 as returned and B-1 as returned. B-2, which I looked up as processing, isn''t on this list at all. I can''t tell which source is right. I can look any of these up again if you''d like, or a teammate can follow up by email to sort it out.","type":"text"}],"role":"assistant"},{"content":[{"text":"Schedule a courier pickup of orders A-1 and B-2 from 12 Main Street, Springfield.","type":"text"}],"role":"user"},{"content":[{"signature":"","thinking":"","type":"thinking"},{"caller":{"type":"direct"},"id":"toolu_01QXdyuaBeL7ncU59bNj22xm","input":{"address":{"city":"Springfield","street":"12 Main Street"},"orders":["A-1","B-2"]},"name":"schedule_pickup","type":"tool_use"}],"role":"assistant"},{"content":[{"content":[{"text":"{\"pickup_id\":\"PU-7\",\"street\":\"12 Main Street\",\"city\":\"Springfield\",\"orders\":2}","type":"text"}],"tool_use_id":"toolu_01QXdyuaBeL7ncU59bNj22xm","type":"tool_result"}],"role":"user"},{"content":[{"text":"I''ve scheduled pickup PU-7 for 2 orders, A-1 and B-2, from 12 Main Street, Springfield.\n\nMy earlier lookups showed A-1 as cancelled and B-2 as still processing. The order list showed A-1 as shipped instead. The pickup request went through, but I can''t confirm that the courier will be able to collect these orders.","type":"text"}],"role":"assistant"},{"content":[{"source":{"data":"iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAVElEQVR42u3ZwQ0AMAgDsey/NJ0CRJGjW8DvpD5fAAAAAAAAAAAAAADmAElvAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD7AB4aAAAAAAAAAAAAgCuAB4I52koXpcXRAAAAAElFTkSuQmCC","media_type":"image/png","type":"base64"},"type":"image"},{"text":"What single colour fills this image? Answer with one lowercase word.","type":"text"}],"role":"user"},{"content":[{"text":"red","type":"text"}],"role":"assistant"},{"content":[{"citations":{"enabled":true},"source":{"type":"url","url":"https://bitcoin.org/bitcoin.pdf"},"title":"Bitcoin Whitepaper","type":"document"},{"text":"What is the title of this paper? Answer in one short sentence.","type":"text"}],"role":"user"},{"content":[{"text":"The paper is titled ","type":"text"},{"citations":[{"cited_text":"Bitcoin: A Peer-to-Peer Electronic Cash System\r\nSatoshi Nakamoto\r\nsatoshin@gmx.com\r\nwww.bitcoin.org\r\nAbstract. ","document_index":1,"document_title":"Bitcoin Whitepaper","end_page_number":2,"start_page_number":1,"type":"page_location"}],"text":"\"Bitcoin: A Peer-to-Peer Electronic Cash System\"","type":"text"},{"text":".","type":"text"}],"role":"assistant"},{"content":[{"text":"A customer ordered 17 items at $23.45 each. A $5 coupon applies before 8% tax. Work out the total they pay, then reply with the amount only.","type":"text"}],"role":"user"}],"model":"claude-sonnet-5-5","system":[{"text":"# Support agent handbook\n\nYou are a customer support agent for an online store. You answer customers''\nquestions about their orders politely, accurately and briefly. You have one\ntool, `lookup_order`, which returns an order''s status by its id. Always look\nan order up before you say anything about it; never guess an order''s status,\ndates or amounts.\n\n## Answering order questions\n\n1. Find the order id in the customer''s message. Order ids look like `A-17`: a\n   capital letter, a hyphen, and a number. If there is no id, ask for it.\n2. Call `lookup_order` once with that id.\n3. Answer in one or two sentences using only what the lookup returned: the\n   status, and the date that goes with it.\n4. Do not repeat the customer''s question back to them. Do not add\n   information the lookup did not return.\n\n## Statuses and what to say\n\n- **processing**: the order was received and is being prepared. Say it has not\n  shipped yet and that the customer will get a shipping email.\n- **shipped**: the order left the warehouse. Give the ship date and, if the\n  lookup returned one, the carrier.\n- **delivered**: the order arrived. Give the delivery date. If the customer\n  says it did not arrive, apologize and offer to open a delivery claim.\n- **refunded**: the order was refunded. Give the refund date and say refunds\n  take five to ten business days to appear on a card statement.\n- **cancelled**: the order was cancelled before it shipped. Say no charge was\n  taken, or that any charge will be reversed.\n- **returned**: the customer sent the order back. Say a refund follows once\n  the return is inspected, usually within five business days.\n\n## Tone\n\nBe warm but brief. One greeting is enough; do not start every answer with an\napology. Use the customer''s words when they name a product. Never blame the\ncustomer. Never promise a date the lookup did not give.\n\n## What you must not do\n\n- Do not change orders, issue refunds, or cancel anything: you can only look\n  orders up. When a customer asks for a change, explain that a teammate will\n  follow up by email, and do not promise a result.\n- Do not ask for passwords, card numbers, or security codes.\n- Do not share one customer''s order with another. Answer only about the order\n  id the customer gave.\n- Do not discuss topics unrelated to the customer''s orders; steer politely\n  back to how you can help with their order.\n\n## Refund timelines\n\nRefunds go back to the original payment method. Card refunds take five to ten\nbusiness days to appear, depending on the bank. Store-credit refunds appear at\nonce. Gift-card refunds go back to the gift card. If more than ten business\ndays have passed since the refund date, suggest the customer contact their\nbank with the refund date, and offer to have a teammate send a refund\nconfirmation.\n\n## Delivery problems\n\nIf a delivered order did not arrive, ask the customer to check with\nneighbours and their building''s mailroom, then offer to open a delivery claim.\nIf an order arrived damaged, ask for a photo and offer a replacement or a\nrefund, which a teammate will arrange.\n\n## Returns\n\nCustomers may return most items within thirty days of delivery. Items must be\nunused and in their original packaging. The customer starts a return from the\norder page; a prepaid label is emailed within a day. Final-sale items cannot\nbe returned.\n\n## Order ids and lookups\n\nOrder ids are case-sensitive. If a customer writes `a-17`, look up `A-17`\nand say which order you checked. If a customer names two orders, look each up\nwith its own call and answer about both, one sentence each. If the lookup\nsays an order does not exist, say you could not find it and ask the customer\nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","type":"text"}],"tools":[{"description":"Status of an order by id.","input_schema":{"properties":{"order_id":{"type":"string"}},"required":["order_id"],"type":"object"},"name":"lookup_order"},{"description":"The current local time at the warehouse. Takes no arguments.","input_schema":{"properties":{},"type":"object"},"name":"warehouse_time"},{"description":"List the customer''s orders. `status` is optional and filters by status.","input_schema":{"properties":{"status":{"type":"string"}},"type":"object"},"name":"list_orders"},{"description":"Schedule a courier pickup of some orders from an address.","input_schema":{"properties":{"address":{"properties":{"city":{"type":"string"},"street":{"type":"string"}},"required":["street","city"],"type":"object"},"orders":{"items":{"type":"string"},"type":"array"}},"required":["address","orders"],"type":"object"},"name":"schedule_pickup"}]}'
