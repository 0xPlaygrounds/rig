when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":8,"messages":[{"content":"Reply with exactly: cobalt","role":"user"}],"model":"mistral-small-latest","n":2,"stream":true}'
