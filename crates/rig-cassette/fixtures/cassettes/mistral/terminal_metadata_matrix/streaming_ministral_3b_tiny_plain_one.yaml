when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: text/event-stream
  - name: content-type
    value: application/json
  body: '{"max_tokens":1,"messages":[{"content":"Write the word cobalt exactly 100 times, separated by spaces.","role":"user"}],"model":"ministral-3b-latest","stream":true}'
then:
  status: 200
  header:
  - name: content-type
    value: text/event-stream; charset=utf-8
  - name: mistral-correlation-id
    value: req_REDACTED_1
  body: |+
    data: {"choices":[{"delta":{"content":"","role":"assistant"},"finish_reason":null,"index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"ministral-3b-latest","object":"chat.completion.chunk"}

    data: {"choices":[{"delta":{"content":"Here"},"finish_reason":"length","index":0}],"created":0,"id":"chatcmpl-REDACTED_1","model":"ministral-3b-latest","object":"chat.completion.chunk","p":"ab","usage":{"completion_tokens":1,"prompt_tokens":18,"prompt_tokens_details":{"cached_tokens":0},"service_tier":"standard","total_tokens":19}}

    data: [DONE]

