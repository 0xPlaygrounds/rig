n’t a modern phenomenon: Throughout history, people have come up with all kinds of codes to allude to things they wanted to keep secret, from the movement of troops to information about gold coins.\n...\n1. 763\n2. Do you drink, officer?\n3. Hornet\n4. Fleece\n5. Bacon and Magic\n6. ...","source":"web","title":"12 Historical Code Words and Phrases - Mental Floss","url":"https://www.mentalfloss.com/history/historical-code-words"},{"date":null,"last_updated":"2026-10-02","place_metadata":null,"snippet":"`/resume` returns to an earlier conversation, `/branch` branches the current one to try a different direction, and `/fork` copies it into a new [background session](/docs/en/agent-view).\n...\n| `/compact [instructions]` | Free up context by summarizing the conversation so far.\nOptionally pass focus i...","source":"web","title":"Commands - Claude Code Docs","url":"https://code.claude.com/docs/en/commands"},{"date":"2026-04-23","last_updated":"2026-09-23","place_metadata":null,"snippet":"The fastest backup method is the ChatCache Chrome extension: open any conversation, click Export, and choose a format - Markdown, PDF, HTML, TXT, JSON, CSV, or PNG.\nSelective export lets you save specific messages rather than entire threads.\n...\nUnlike copy-pasting or basic printing, ChatCache ensur...","source":"web","title":"The Ultimate Guide to Backing Up Your ChatGPT Chat History","url":"https://getchatcache.com/blog/backup-chatgpt-chat-history"},{"date":"2026-03-23","last_updated":"2026-09-23","place_metadata":null,"snippet":"`claude --resume` (or `claude -r`) opens a picker to browse all recent sessions.\n...\nClaude Code saves every conversation you have.\nEvery single one, sitting right there in `~/.claude/history.jsonl`.\n...\nThe custom `/history` command reads the raw `history.jsonl` file, which logs every individual pr...","source":"web","title":"How to resume, search, and manage Claude Code ...","url":"https://kentgigger.com/posts/claude-code-conversation-history"},{"date":"2026-10-01","last_updated":"2026-10-02","place_metadata":null,"snippet":"codex resume reopens a previous interactive session by ID, name, or through an interactive picker, preserving the full conversation history.","source":"web","title":"OpenAI Codex CLI Cheat Sheet 2026 — 71 Entries | Toolsbase","url":"https://toolsbase.dev/en/reference/codex-commands"},{"date":"2026-06-28","last_updated":"2026-10-02","place_metadata":null,"snippet":"Keep all conversation turns in the context window until the limit is hit, then either truncate (drop the oldest turns) or error out.\n...\nKeep only the N most recent turns.\nOlder turns are dropped entirely.\n...\nrecent_history = history[-MAX_HISTORY_TURNS:]\n...\nPeriodically convert old conversation tu...","source":"web","title":"Conversation History Management for AI Agents: 2026 Guide","url":"https://explainx.ai/blog/conversation-history-management-ai-agents-2026"},{"date":"2025-07-22","last_updated":"2026-10-02","place_metadata":null,"snippet":"Hermes Agent automatically saves every conversation as a session.\nSessions enable conversation resume, cross-session search, and full conversation history management.\n...\nResume previous conversations from the CLI using `--continue` or `--resume`:","source":"web","title":"hermes-agent/website/docs/user-guide/sessions.md at main","url":"https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/sessions.md"},{"date":"2026-09-17","last_updated":"2026-10-01","place_metadata":null,"snippet":"Every one of the five coding tools I checked, Claude Code, Cursor, Codex, VS Code and Windsurf, already ships a working way to reopen the previous conversation.\n...\nClaude Code documents five entry points, among them a flag for the most recent session in the current directory and a picker, and state...","source":"web","title":"My LLM agents forget conversation history when I restart them, how ...","url":"https://dev.to/izgorodin/my-llm-agents-forget-conversation-history-when-i-restart-them-how-do-i-fix-this-2c4c"},{"date":"2025-01-31","last_updated":"2026-10-01","place_metadata":null,"snippet":"The chat history object is used to maintain a record of messages in a chat session.\nIt is used to store messages from different authors, such as users, assistants, tools, or the system.\n...\n- Truncation: The oldest messages are removed when the history exceeds a predefined limit, ensuring only recen...","source":"web","title":"Creating and managing a chat history object","url":"https://learn.microsoft.com/en-us/semantic-kernel/concepts/ai-services/chat-completion/chat-history"},{"date":"2026-08-08","last_updated":"2026-10-02","place_metadata":null,"snippet":"Claude Code saves every conversation as you work and reopens it by recency, name, session ID, branch, or pull request.\n...\n- Transcripts are plaintext JSONL at `~/.claude/projects/<project>/<session-id>.jsonl`, deleted after 30 days by default.\n...\nResume restores conversation context, and only that...","source":"web","title":"Claude Code session management: resume, restore","url":"https://continuumcode.ai/guides/claude-code-session-management/"},{"date":null,"last_updated":"2026-09-30","place_metadata":null,"snippet":"A change to the conversation layer leaves the system prompt and project context cached.\nA change to the system prompt invalidates everything, because all later content now sits behind a different prefix.\n...\nBy design, this invalidates the conversation layer, since the next request has a new, shorte...","source":"web","title":"How Claude Code uses prompt caching","url":"https://code.claude.com/docs/en/prompt-caching"},{"date":"2026-09-08","last_updated":"2026-10-02","place_metadata":null,"snippet":"Here, agent memory covers information or execution state that persists beyond a single model call and can be made available to the agent later.\n...\nThe simplest form of memory is preserving enough of an interaction for the next turn or session.\nOpenAI''s Conversations API, for example, provides durab...","source":"web","title":"Agent memory: patterns, tradeoffs, open problems","url":"https://aaif.io/blog/agent-memory-patterns-tradeoffs-open-problems"},{"date":null,"last_updated":"2025-12-20","place_metadata":null,"snippet":"Word coding, the ancient practice of transferring ideas into tangible communication,3 was refined during enslavement when it was especially useful for resistance and liberation efforts.\n...\nUsing colors, shapes, patterns or particular pieces of material, enslaved Black women, coded messages into qui...","source":"web","title":"[PDF] liberatory expressions: black women, resistance and the coded word ...","url":"https://scholarshare.temple.edu/server/api/core/bitstreams/9680ba47-5749-4c07-8df5-cfd27fcc515c/content"},{"date":null,"last_updated":"2026-10-02","place_metadata":null,"snippet":"Claude Code keeps a history of the prompts you type, and Up-arrow recall reaches prompts from past sessions of the same project:\n...\nThe question and answer never enter the conversation history.","source":"web","title":"Interactive mode - Claude Code Docs","url":"https://code.claude.com/docs/en/interactive-mode"},{"date":null,"last_updated":"2026-10-02","place_metadata":null,"snippet":"/recap generates a one-line summary of the session, and /export writes a rendered plain-text transcript for the record [30], [35].\n...\nThe previous conversation is not lost: resume it with /resume, or reach it from the rewind menu’s previous-session entry in the same process [30].\n...\n|To|Set|Where|...","source":"web","title":"Claude Code Complete User Handbook - arXiv","url":"https://arxiv.org/html/2608.26742v1"},{"date":null,"last_updated":"2026-09-27","place_metadata":null,"snippet":"- Some chat services allow you to set up the platform so that when the conversation is ended by the advocate, the chat window on the survivor’s device is automatically closed and the conversation history is erased.\n...\nCode words can be used at the beginning of each conversation to confirm the ident...","source":"web","title":"Chat with Survivors: Best Practices","url":"https://www.techsafety.org/chat-best-practices"},{"date":"2026-09-22","last_updated":"2026-09-23","place_metadata":null,"snippet":"The real limitation shows up with long conversations, code blocks, or tables, though.\nBrowser printing captures only what''s currently loaded on the page.\nA very long chat may get cut off.\nFormatting like code blocks can come out messy too.\n...\nExport Data downloads your entire ChatGPT history at onc...","source":"web","title":"ChatGPT to PDF: 4 Easy Ways to Export Any Conversation","url":"https://aibusinessweekly.net/p/chatgpt-to-pdf"},{"date":"2026-07-04","last_updated":"2026-08-09","place_metadata":null,"snippet":"Use /resume\n...\nI just used --resume, and it was precisely what I was looking for.\nNow I can view all my previous sessions, which is incredibly useful.","source":"web","title":"How do you manage conversation history in Claude Code","url":"https://www.reddit.com/r/ClaudeAI/comments/1ue2y6z/how_do_you_manage_conversation_history_in_claude/"},{"date":null,"last_updated":"2026-10-02","place_metadata":null,"snippet":"- Live `chat` events are delivery state, while `chat.history` is rebuilt from the durable session transcript.","source":"web","title":"Chat - OpenClaw Docs","url":"https://docs.openclaw.ai/web/control-ui/chat"}],"usage":{"completion_tokens":10,"cost":{"input_tokens_cost":0.00006,"output_tokens_cost":0.00001,"request_cost":0.005,"total_cost":0.00507},"prompt_tokens":59,"search_context_size":"low","total_tokens":69}}'
