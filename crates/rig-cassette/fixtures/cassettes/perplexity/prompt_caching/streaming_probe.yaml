_v2.pdf"},{"date":"2025-02-25","last_updated":"2026-08-24","place_metadata":null,"snippet":"Prime + Probe attacks target L1/L3 caches and have two stages: Prime, in which the attacker creates an eviction set and fills the cache with it, and a probe stage, in which the attacker re-accesses the eviction set after victim execution.","source":"web","title":"Advancements in cache management: a review of machine ...","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11893820/"},{"date":"2023-12-21","last_updated":"2025-07-05","place_metadata":null,"snippet":"- Each cache that receives the cache probe sends a probe response back to the coherency synchronizer indicating the appropriate cache operations have completed.","source":"web","title":"Processor-guided execution of offloaded instructions using fixed function operations","url":"https://patents.google.com/patent/US12153926B2/en"},{"date":null,"last_updated":"2025-05-22","place_metadata":null,"snippet":"Multiple Cache Probe Units: Multiple cache probe units add extra hardware complexity, but saves execution cycles by improving the probability of a hit. The results with different factors such as 2, 3, and 4 are shown in Figure 6.5b. As expected, more probe units give better perfor-","source":"web","title":"Reducing Cache Contention On GPUs","url":"https://egrove.olemiss.edu/cgi/viewcontent.cgi?article=1453&context=etd"}],"usage":{"completion_tokens":1,"cost":{"input_tokens_cost":0,"output_tokens_cost":0,"total_cost":0},"prompt_tokens":4365,"search_context_size":"low","total_tokens":4366}}

