 way of the Sun’s light and casts its shadow on Earth.\nThat means during the day, the Moon moves over the Sun and it gets dark.\n...\nThe name tells you what gets dar...","source":"web","title":"Lunar Eclipses and Solar Eclipses","url":"https://spaceplace.nasa.gov/eclipses/en/"},{"date":"2023-05-25","last_updated":"2026-09-22","place_metadata":null,"snippet":"When the Earth, Moon, and Sun line up in space, we can see an eclipse.\n...\nAn eclipse is an awe-inspiring celestial event that drastically changes the appearance of the two biggest objects we see in our sky: our Sun and Moon.\nOn Earth, people can experience solar and lunar eclipses when Earth, the M...","source":"web","title":"Eclipses - NASA Science","url":"https://science.nasa.gov/eclipses/"},{"date":"2019-09-01","last_updated":"2026-08-21","place_metadata":null,"snippet":"A solar eclipse occurs when the shadow cone of the Moon intersects the surface of the Earth and is observable by anyone within this shadow zone (see Figure 1).","source":"web","title":"Solar Eclipses Overview - ESA Science & Technology","url":"https://sci.esa.int/web/observational-astronomy/-/37889-overview"},{"date":"2017-08-10","last_updated":"2026-09-22","place_metadata":null,"snippet":"An eclipse occurs when the light of a body outside Earth's atmosphere (Sun, Moon, planets, etc.) is temporarily blocked by another body.\n...\nA solar eclipse occurs when the Moon comes between Earth and the Sun, casting a shadow on Earth.\n...\nDepending on the distance between the Sun and the Moon and...","source":"web","title":"Your guide to solar eclipses | Canadian Space Agency","url":"https://www.asc-csa.gc.ca/eng/astronomy/eclipses/solar-eclipses.asp"},{"date":"2022-10-14","last_updated":"2026-09-22","place_metadata":null,"snippet":"A solar eclipse happens when the Moon passes directly between the Sun and Earth.\nWhen the Moon completely blocks the Sun, it is called a total solar eclipse.\nWhen the Moon only blocks part of the Sun, it is called a partial eclipse.\nAn annular eclipse is s special type of partial eclipse that happen...","source":"web","title":"Eclipses Frequently Asked Questions","url":"https://science.nasa.gov/eclipses/faq/"},{"date":"2024-03-29","last_updated":"2026-09-21","place_metadata":null,"snippet":"A **solar eclipse** happens when, at just the right moment, the Moon passes between the Sun and Earth.\n...\nA solar eclipse happens when, at just the right moment, the Moon passes between the Sun and Earth.\nSometimes the Moon only blocks part of the Sun’s light.\nThis is called a partial solar eclipse...","source":"web","title":"What Is a Solar Eclipse? | NASA Space Place – NASA Science for Kids","url":"https://spaceplace.nasa.gov/eclipse-snap/en/"},{"date":"2024-05-13","last_updated":"2026-08-25","place_metadata":null,"snippet":"An eclipse happens when any celestial body passes in front of another.\nFrom Earth, a solar eclipse occurs when the Moon passes between the Sun and Earth and either partially or completely blocks the Sun.\nAn even more precise term is an occultation; when a planet or moon moves across the face of anot...","source":"web","title":"Eclipse Science - NSO","url":"https://nso.edu/for-public/eclipse-science/"},{"date":null,"last_updated":"2025-11-03","place_metadata":null,"snippet":"A solar eclipse happens when the moon, on its journey around Earth, happens to pass between the sun and Earth for a moment.\nA solar eclipse can only happen during a new moon, a phase of the lunar cycle where the moon lies between Earth and the sun.\nAt night, the moon is totally dark during a new moo...","source":"web","title":"Eclipse","url":"https://education.nationalgeographic.org/resource/eclipse/"},{"date":"2026-08-07","last_updated":"2026-09-22","place_metadata":null,"snippet":"An eclipse happens when the Moon passes directly between the Sun and Earth, blocking the Sun’s light for a short time.\nThis allows those in the path of the Moon's fullest shadow (which is called totality) to experience unique lighting conditions that resemble 360-degree sunrise or sunset.","source":"web","title":"Helio and You: Studying Eclipses Near and Far - NASA Science","url":"https://science.nasa.gov/helio-and-you-studying-eclipses-near-and-far/"},{"date":null,"last_updated":"2026-06-21","place_metadata":null,"snippet":"An eclipse is a celestial event that occurs when one astronomical object moves into the shadow of another object, resulting in a temporary obscuration or darkening of the first object.\n...\nA solar eclipse happens when the Moon passes between the Sun and the Earth, blocking some or all of the Sun's l...","source":"web","title":"Understanding a Solar Eclipse - College of Science","url":"https://www.purdue.edu/science/K12/eclipse.html"},{"date":"2024-03-05","last_updated":"2026-09-23","place_metadata":null,"snippet":"It is never safe to look directly at a partially or uneclipsed Sun without proper eye protection.\nOnly during the brief moments of totality during a total solar eclipse, when the Moon completely covers the Sun, can you look directly at a solar eclipse without eye protection.","source":"web","title":"What to Expect: A Solar Eclipse Guide - NASA Science","url":"https://science.nasa.gov/feature/solar-eclipse-guide/"}],"usage":{"completion_tokens":7,"cost":{"input_tokens_cost":0,"output_tokens_cost":0,"total_cost":0},"prompt_tokens":24,"search_context_size":"low","total_tokens":31}}

