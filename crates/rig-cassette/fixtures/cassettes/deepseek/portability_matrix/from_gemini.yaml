  body: '{"max_tokens":512,"messages":[{"content":[{"text":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","type":"text"}],"role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"content":"**Analyzing the Weather Query**\n\nOkay, so I have a user who needs a weather update for Tokyo. They''re trying to figure out if they should pack an umbrella or sunscreen, a pretty standard query. My process here is straightforward: I need to use the `get_weather` tool. The first step, obviously, is to call that tool, providing it with the necessary information. Let''s see, the city is Tokyo, so I''ll feed `get_weather` the argument `city=''Tokyo''`. Once I have the data from the tool call, then I''ll analyze it for the precipitation levels and sun levels so that I can provide advice on an umbrella or sunscreen.\n","reasoning_content":"","role":"assistant","tool_calls":[{"function":{"arguments":"{\"city\":\"Tokyo\"}","name":"get_weather"},"id":"tool-0","type":"function"}]},{"content":"Weather in Tokyo: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_call_id":"tool-0"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"deepseek-v4-flash","tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
