  body: '{"choices":[{"finish_reason":"stop","index":0,"logprobs":null,"message":{"content":"With Tokyo''s sunny skies, light clouds, and no rain in the forecast, you should pack sunscreen rather than an umbrella.","reasoning_content":"The user wants a one-sentence answer. The weather is sunny with light clouds, 72F, humidity 45%, wind 8 mph. No rain mentioned. So sunscreen.\n\nThe instructions said never guess weather data — I already have the data. One sentence, no tool call.","role":"assistant"}}],"created":0,"id":"9e6b80b6-5a8b-49a8-ad21-1eec6952b02b","model":"deepseek-flash","object":"chat.completion","system_fingerprint":"aeb56401ca74e127821c4f9126dcb669","usage":{"completion_tokens":84,"completion_tokens_details":{"reasoning_tokens":58},"prompt_cache_hit_tokens":384,"prompt_cache_miss_tokens":253,"prompt_tokens":637,"prompt_tokens_details":{"cached_tokens":384},"total_tokens":721}}'
