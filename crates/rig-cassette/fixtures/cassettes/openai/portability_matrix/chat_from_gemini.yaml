when:
  path: /v1/chat/completions
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"max_tokens":512,"messages":[{"content":[{"text":"You are a weather assistant. You have access to a get_weather tool. You must call the get_weather tool for any weather question and never guess weather data. After receiving the tool result, provide a concise summary of the weather.","type":"text"}],"role":"system"},{"content":"I''m planning a trip. What is the current weather in Tokyo, Japan? Based on the weather conditions, should I pack an umbrella or sunscreen? Use the get_weather tool to check before answering.","role":"user"},{"reasoning_content":"**Analyzing the Weather Query for Tokyo**\n\nOkay, so the user wants the weather for Tokyo. They''re trying to decide between an umbrella and sunscreen – a pretty standard travel planning question. My immediate course of action is clear: I need to fetch the weather data for Tokyo. The tool is there for a reason, right? So, I''ll use the `get_weather` tool, feeding it the city name, \"Tokyo.\" After I''ve got that data in hand, I can analyze the temperature, cloud cover, and precipitation forecasts. Then, based on the information, I can formulate a recommendation: Umbrella? Sunscreen? Maybe both? The goal is to give the user a simple, practical answer to their question. That’s the end goal, and this tool is the starting point.\n","role":"assistant","tool_calls":[{"function":{"arguments":"{\"city\":\"Tokyo\"}","name":"get_weather"},"id":"call_REDACTED_1","type":"function"}]},{"content":"Weather in Tokyo: 72F (22C), sunny with light clouds, humidity 45%, wind 8 mph NW","role":"tool","tool_call_id":"call_REDACTED_1"},{"content":"Using the weather you already retrieved, should I pack an umbrella or sunscreen? Answer in one sentence and do not call any tool.","role":"user"}],"model":"gpt-4.1-mini","tools":[{"function":{"description":"Get the current weather for a city. Must be called for weather questions.","name":"get_weather","parameters":{"properties":{"city":{"description":"City name to get weather for","type":"string"}},"required":["city"],"type":"object"}},"type":"function"}]}'
then:
  status: 200
  header:
  - name: content-type
    value: application/json
  - name: x-request-id
    value: req_REDACTED_1
  body: '{"choices":[{"finish_reason":"stop","index":0,"logprobs":null,"message":{"annotations":[],"content":"You should pack sunscreen for your trip to Tokyo, as the weather is sunny with light clouds and no indication of rain.","refusal":null,"role":"assistant"}}],"created":0,"id":"chatcmpl-REDACTED_1","model":"gpt-4.1-mini-2025-04-14","object":"chat.completion","service_tier":"default","system_fingerprint":"fp_REDACTED_1","usage":{"completion_tokens":25,"completion_tokens_details":{"accepted_prediction_tokens":0,"audio_tokens":0,"reasoning_tokens":0,"rejected_prediction_tokens":0},"prompt_tokens":222,"prompt_tokens_details":{"audio_tokens":0,"cached_tokens":0},"total_tokens":247}}'
