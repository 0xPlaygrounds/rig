nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6-astra","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqvHZ91ccnUQfXkBHEhWmkgblkhnQr2t2xdvrAcLfnR15gsn-KM9A3nd3ZRZw8tsBoQyu7Kj2a9fQSwdOML6UU5NH62tn5PhpV9VAnV_uDXx9Qx1aRWQQ4deSJwH0suRxKCxhslpUmo2mswxFfg866y3esHDu0cfnpxtEh7EaK4-C-Kxc_JDtVkS-G8R893wm0ZjnacivGCMvRStM7L-5r-GTv7jEyfZtvu47vb2-3zMLdxtHLzu7La2LzZy92YldLiGsvIGcG0muY7pxtMQHRqyvjTERuq0cYNR8EEWINIJlcREi0x7gGRJpBUX-iT1r0oNQxqGkS9Wc_I4mSQUFFb6Bo42P-sUuwvqS_p8JK6M1XM8f995e0JozO-HB8iFJ4RwqRUtdrJt0yFZTpEnAayBjLGcM5JfyvomKEMvcuFugqQsNNIvMGAlODESdI4Sj2V37eYRT_r0rVBBuGOT3V7sLUE5Zxn2WHGSdvKd72da9Q3jPxXg7R-Vs0A7r570YrgwETfr_aH95IPccDpjoWz0skvyustvkZzM1mOXbz3RgHQUnxApOpalkoCWI8Bg9vrDjpMfQT5L_dpd-c0dInHV-C-itAfQIFOKjkg7cbER_5lkisPzcI5rA5Tg5TnwAzED29Vvqi982DtfC0LoUNzUxYnI5OgaKALAwF98yaU3hKxce0q_0BeZ06n5QZcsjNKJR-iqVqDLsm8eF-J53CmYMrLll31ylmvkukFu7iEQfBzB3BKeEGJGNi27qCLp5FtIGfXv-JsHPtWzfGMS89EHMRc6zU1Sza9XjnmKwFuYMg7l0Vp6Q3m6Rb8qdFuCouhgkknDxmDZYyMfcked2TrPvx8kRE1rM_Oaoj_Sdis-EIiiCPc6jl0wHTfRoV8MUdmNXciigoyidGxtTbCL-JOc-Jvc5lq9zWmGu1r6hzWL_Z-2C_Xg8J52Edxlm0LKcTEm-v5aaDFtQwnhu9i0qp7cFlMUCPEa5vyLrr_ccxbVTdayXg-tvND8D9patY5Age13ep508NUhi2t17nDuiLddM4QeAHC8wCaosbUqJM0TK0jWvWDyMQKaRCi7DGee9t_FPyz7HBkPdhZSeJE6RpJdU52Ranc5NOsUm12lK3s0XsyJgOBseWYpTTV1pmxGeCHbdmgu2BMj4DECOMvlcsMEUIIv_91jmlE5tfzSfCqP2A2UD03rJxbgCMDvEkQkmfGcW-OVwDycqlh9i7_ofgaAhaBN0IzafL3KXt3-1OLsR5uhKbh8Sj2q9t1c11YefX-EBQnD2uOKuX5R6AqKcioF3wwdHIZT04NejhNaPJRDAFmWS4krbm_Qvo4BGb