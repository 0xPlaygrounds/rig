nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6-astra","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqwUhX52rYILa4gmBFYTNNswG1guvMcvf_h0iuHQNySRNzr1h1syOW9lwk5vQRQgUbBPSrt0eXZhBs2cFMaxxhTKpznokpgtdEBVgfpwrHOIyMxWFMSpiHw2lSn7IoZ4j70qg77o4Ie7b3ni5mtZuMysyJFYAnxUMRDtuSNtXyCPmMcER6mcHxzJqoCzSvIu5pR04garPtXO_ZLFVXAw94Qjna4N7U0Hnj8iAXwFtcWzVqQGirGa64OVssMhe9S9WSjHaWUjTO-nM7T9iNs008eZKw10YuOEUKpuZaZvAnR7vGYla503GB55H-h-vwrx8YGioHf6u37lTzE-W_9Rl6WZEHHVMh8o2Qn4WB7-EEatxF2eiX293YjfjtNpmT6JmZuCHb0yIoUdjIvzVgUsYP-XSGaxaiCDeJGFMW8RhVsV1dC6tJDR_YzYOSVQg2noInMf--qSH7_JHuwQy9QzxvN198Jp9xEyTi1LSY9GIXDfQngGFTvvjJlrqbQsesAdbnwKQDIVigRxha7UDkXoK3FKXxMylLidOBvBRW15KwosgqcjQaU3IBII-OwnOF6VXITs_ZnXFgx0ip2WFmmQNmAGubvG3Kr_vUpUKdgqdBkOiRIpN4WcnhLLOttZQLN3ZEycKsuZwdHnA3sZbFTp5afGz6ZS24QO7SFmObix4GZGfCXuonE3uqNNx1M_TjIj1MrX3spIB8Ki3DoRJ5-6q6hi-z-Mc_xX87aME2cI29tur2j47attrtMJeR2YNQrMlCB9fB-qbFr-VaZryRIIrnA3bfouw47gKqfqLkTK_A4v1TJqapGxppg-GHOiu9rlpsrhLm8FJ_puIZLcFRrgXibtfY-bpzuhAqG6k_xHosG1VtM3PT8zx1_dm7FCEMRz-1CG1U1xiRkCaX5mN893h2m3MNUThgVDDau_gm69Mx4rhRbfu46b9SPhIwZnVi3LUWUiWkkIO8CewqF4AzzKGdDyb54PThV57i4Pf3RVyc5JiyBTcpNA-rxMEY2UCMeDy8J2LR1e8N7yHtYDjEVeWLP3LhMLoqYBRVnvkj2c9m8IKiqqZb7FwRCNSUM9PNE4phQr22YhDFeXfRnYN7sVrLXhMut1_Utz6M68QEOhH9sVLYEa6Hn00vCL79ClD-Pg8BcxTT-9GradhXPjqCoqgm_oFhISqDm2fWL7B_2qg1Kng_AtFpdkq2i2XJFKje9y1a24VPnchbCor5hgO7rS_Qfw90zQ==","id":"rs_00ba94c70c5ae933016ac14856951887d09c21bf8ee69d441e","summary":[],"type":"reasoning"},