r two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6-astra","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqvCcrxqhptsg2pR7xt9RRr_snymmcmdUPTPd09hNZyYq_rhywY-ITa6LW6pr_RPyoBWdjpRHzGw4snX5vjuzOSDtgk3uLagKhMq97AfIcLx_QCGGJcqs6Mw7o-NNnkGespq33PC7tss7w-5bh9yknZPpKDyKMsZLc5sXrUcAnWlke8O-kG3uC-e60tfbH_zg5_FZOYqLPwRAGxjO5aHYSOLBuZ2MiQoZ9ZiqB49ZuqXkIJd_6vZf9ypuo3QC1ocD58ZZRRXunV7idva8pMtji-bCkHIfynqYjNCQmDxPPcsAFnYqC_JHql06-VC6b-D81k4biJc4oTUXXKCYtEkaBuOCwidWSAp1qJrosuzOAwChcuQQckuFKkm0pPIOh4EUGe30dghSwdlDN1JwO4pWC7x6nQf9IVY0w4f3xp1cyBkZAIjnSvNPPf-ZXg2rxikDHVnjKoyhpcPjLbjrH7Dg3tyor0J4sIJ-rrYjdrksuttbDIu38O4rF3R2LFB-y0GzwKpj39eri80rHqWYplDqtDzcDtRdEdpx68OrxZP-UefC6IYu3_OHE63RM4F8HNXzQFqLU4A8caM_p651lpzsB5cvYwh5INqG4U5dStVtEQ8lGl5KXay3TpAZDzCVp5VA8awyxexovVPGlRBzIfrQ2dtY6TFfrHd6aHhZPfhf3Lvp-t4jtkW6gYRUlLbQMGE8XaEXMJj7ho9-nZvz5JjIk3MvwS6fUlAcjmZ_Y4qijx1F3UK0wPlFL7SluOkQaayM1UvECtB6_rCF46e7tJ2q8yUoZhjwhOoQj8qLaJaox5zRsko8Nm_kxanEabMI4xql7qlfQRidHHeWIvID5p46IKr9JvFPTV5L9Tk8rMl1T5FLwS-C9KXF0UPf1okasXDluqw-Ahe6eVvkwY023JPxqRVv8nPtOUySVYVv6JA4XMDFLXdcpkZ0yp00dmjDpWEQUxYLoXAt8v-WxdH2qxJgJjyZl3FdF3L9C2DJ3NqyOPtGDifFWpJJNg7bbKT6wFzoj9haYakdg3gKCIuBh9VKDqkrPDL-fGo5rcl88vlKA5SXFslPNiknjBVBBedIX9nGpArE_dqGX9TDYlTC0QmXB8viNus2S7VdAZDaxiDFsD1hj0G0ru69ckzP0HD1nLyQQHFUeQ-ToB5CVfKRJJCbVEpMm0CI3wJWhRL1BXekFwZ2dMkjFxEURNuhZkr8Eh_tEzn2imefQ6W16yu32qRqRncaurQ==","id":"rs_096e6b4305926b0a016abc272b094887d0b12c4f898611f827","summary":[],"type":"reasoning"},