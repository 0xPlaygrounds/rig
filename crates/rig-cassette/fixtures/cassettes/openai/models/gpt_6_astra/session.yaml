nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6-astra","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqv2OzhGVia_tXJSe3LqkY_bDx7xU88ynvsmdSHSAzeYczBOjgoQfrZFTRBDIc7anH7czVe_sxDcsnRohV_38Craz6pTN44WSgqZEFdlRaM_ma1FCOGgi0ZTzhG7GUkojESRH5_akAdjFvCn6A4wz-LCeCEJu-HSC5Sz5OTFunIwoBXStfGGHVtfuc75EKzsnaBrlWtC3G4Pnt17LwUNE4BJYJB4EKQs6th_P0rIZRwJa2FUCyyiRmWPcRW3wa_qqwSdHCx6SzDL2qT8GFlI0nI8rV9uH3SyOE1ydyyS7znc5y3rK6iA7fBEln3dBvu4AljmJWSWlF5O359UFstpfTU9INgEDGOkFWLDjGzoKZJIGAHfC-YV7GG3qXdn1LfhW5lSZVfKFfyYeJVk4puYTC-mfBQgBatSRI1FSN1a6xlYu1HFo060kMdZyWVZIg8I0M6X2l6pYUdFjnWg5OIVr_PZTaVjCegbQsQWRkWI4-5b1C0o0gM-3woXkY58ZznLprzd_vztLgKhdv7JvIArO2T1Go1BXHe8zchE38dVr4VL-GxhOnqoRorxR5LhSoXoDr4YG84gX3oamMKUyy4Y57WksYfelBhRMjoNapc5c6vkDEvVK-6duBDzjqytL4P5LkKKCc4VjsCATPOybI-257TOyDSEN_hLXpfRtOiY6lZUJsbPO9AaowjMVO9bJrzwCEjD1zARBfi0S7sldbqIpO6foqZ4sfHCs9CTBmUtAiQ1vlFlrDxZUgEE8kVdAJVRcoXl5cwlrO3s7s6ZaAPYRQA9kVwKsgpGSdtd_0DwJr13F5NapgmJMrJ-PQ6S9HIgUPOE6_XQ3L7-Gd3rUslj9RRqcw9f0hw3MQoYe-qGbKK1rm7yBZDLK8bcLmDdxcyt4tPixocKBUvLUJ3dXBlR4aSEr1rUBFFNjT38WM7DY9m2_wFAF_i1dHv7qLiCQpc45-HRqr9LSooRKOvo_cm2R3IeYt88RhmK1tgDDD30VJJBU5BlBbUnO6DkTZdVMis-CLtHxasFWHaSaRtwNomA9fw3SS1j4F29YBbErmXkQ236YBBwlwLVi_H4nwh5RRDHYkB4ieErZDFJFym1HnktF63cQHO8wRUR4C1Yqvk9E7Q57cq7rr3640vWmYQb3L9C8cjgEAKOEvpQZQ3xb3h9jO1u9f3TUpM9z-Kj65hMGitQ7AXVm7ZNeTQL5vUo_lhrt8YgbWANAEiFpULICUxZWYhrdMYQ==","id":"rs_0832f432df446026016abf63b287cc87d0824c8e13c60afb54","summary":[],"type":"reasoning"},