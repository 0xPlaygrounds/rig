ir confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I'd be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order's status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-5.4-2026-03-05","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqv2IMCxTvN3vpjEFAMHgO1t_xrXinZS3mGFyAPyITofUOKpvtmAx8GxmEvW8HE_rghgnhBV9NwZAFAeVIxsPwoWr93XrwRbF_e9444zuEo84qmAV6r7uvevcXLh-Ag0kX3nglCDpVJ2qkZtxlS4KhJ5UfkmSt-nN4pKjmmeirXPfkm3Z1am3HzLPXvqZRT1f0hfZrtzV4UXNU4WF1MgR-RKf27ahUnFPbV77mD4V1u0nWiXMTcuVRvVzJrMFxPLylSfrRtGUTpadM8-ucBswjvboba-72WAsxTdsx6iAkHjHgYny47KCaJqVGe5t9huAbjLJNd_AyNIQv3PgVXD4Y4keeOfcubkfDsosNCr8-Lw5ElNQXIeSHY3UG-BM2dJP_mImV4nIkChP34J3-mUTSqMYMaK_L9vlNbXL_8crqq07tg1PuruHiLeQLhSeHQnEWnUso4f5fJahVwsS0nvzKlw7P-G5X5CPwy__ibkgEIuI0P60-QrwFeWEYMxFTHLk-YQ_EQH4jJ_2S2ZrCXLWiUuASdW0nrYnFLDq3QlttUNzdU1YM-HhORvRxQB7bi6PaxTol_ILqyRaOBjFzwYG320UbWanqIdpJ7hY6ie5ETx9aaRfE4VEOrj_WD4nVYXu8fIfKTfD4vAtAMhGTQVWrQaEpgDCFGb1tKSZIJ1i8oPOzN5IsNS25ctKVOmutM9TSD0LpUZS98cpUSYBjYpXXj0Hz4zoQQamgze_RT9f3x_PEPxF8WycR_So6yeyXFQ8Zh6aTbvyqlLId8KHT_J67lhKMw8mB5-w7YZ4Ep4y1pHwHMUpHbkpHYz2sqb_guKjbaz1-ob8fYWdLSbzYr-dFecL3aHvauDGqMJetxBbk1CzC0hb7-Ft26wbWsiQsDzgvM13EXz_YVqbf42U8teozP_1KKGK2mhFPKDCRKdOi0E8JubEvEVK1wzWjAMR-HgDpqLRdCpRYowFpJvQMLj4a7_Ku1f5LLAwRi3Q_wubiSZ0R5MIjgy4p0MXkduDWbf9HPqTDquohaf7TOBDus6GHhRqdL0khQDu0dPprvRfbrkJwAA9Rqx2n-vENXbkQbwOCPWzl3RpFfW133cw6o-8fUH69C6An3kj9sO6MVUFNkWaRta8eS1heFGeoyahKzwARpIOvVqXp5ksscKMEFVLGRHUBpowzxyuOTtYQ_gvvvi8eaT8sJjW5PD-hup7FwnZQMDdSqAHDWlQme63HZWduQ5r3PUzPfqQZweYn6NHxdzaa_9Uy6xUiRQdKkpGjrzvXAaPV","id":"rs_0b16bf12bbf6fd0a016abf620c429c87d0af0e94e8a327847b","summary":[],"ty