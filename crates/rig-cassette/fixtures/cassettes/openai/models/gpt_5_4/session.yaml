r two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-5.4-2026-03-05","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqwBiMom60DQ5EHigeo45CsFawZ3mZ9KeL6tqNBzuZxYqPKtRj30RlTSfNHliYYC2Bd2KlxI_bMK4fJ1DXFGRlKJJix4-DtghRo2lE-sphHBv36skQS1JXk9VGgmhP_QornCWjVkmT93tjpiIQHbdif5bNI2o_uzu1DtL6rKRcIiYmbnkJYb4WPIbLLfa6L0PcvDVZfCf2JjwW1ppLmQrKhdxsQLuNrQNiz1l2DvvuUIOKUrI-S5WS7HO8tvG7GG5Q4SFGI8fZely4DCdatP7ULDGQQ0JYnkhHKSN5yv2RqwTTjl5Pzy_TUDQRyrCIIr1WjCxYdhdrzIuE3H0sk7oYgR_KLtT3KzbSmGw5bSrVFJyq1M0Z1IdQ9Y2mqWlU_UBtFl6w3w1Pn-4f7kV3geZebLBawjD8k_770K2T5tj91rupDPGoqnrcxwk_sMnaQ94l2vuYy5a2h17l5XDuyvUNDqeRxHPN6MVV_m-PrMO3FRMhjpoMU1geGnlqiYIgCkpa8A7pqMJFrj8co_BUt9nhXf7CuKrwt0ggfChwIrbdVw3G-OSOS70jLiBdLElIN5bq784dEShtY3w-bhxrk0oINRZ4lMkKxBcv-kKiAHQpqtfcsnc8i-zDgXU9b_BVHD8LIgZGjvYCt7s96PC2Lc5II1WBB4YZxLIeT972YugenZ5vexG8z_E15s36fKmqEtYf6WLDAL5HJFaC4abIz1MUtwINdPrLYRzU5hvRzfTX58VB0-VUlvDc7E-aUafidiSwavtEilTiXvSEYnseHIc5Wl0CJ7AclpZNdVdEeB9GhsNyK6LZf_T60AJ1ELkNw7nrcH1a4FToczq17S9Jp47Lnd9LVWz_xeK9ml7QOI9Hw9ou1KKKfQ5F5L6xwePs7Ev3lHeuLIivmHgBPdYtBAPbgUC1AZq5iBBldHJussO2Q6ic11YEYMRmuS4MUv77yMalTuabXio8DJ8C4BKmnxrb1jUNgP3FSLWtK0q8eFxH6UyVT_NwJOl8jSPd4oj_p-WmNHbXNPtEIxet-soR1Ufy3FvGyKwHfGvdTHZbP4WtNa-IA_nEZdcenL4BPNYdN8liMQduH8NdrHJo-JGmreV_85dJNTN0W8pRbWaPnBGiAGFnxsghNLSlCRJxHeWur-FedKqkg0OhDAsWV5QwoUr26FEm8bKn5HuNiCX8awlbzKoQgdqWFBkTzzakyBzovVtq8iPVL5QJM_piE3a-8dg1yqIYB80X2vRdSu9ElAvNpT9JHdqgbXhMevK0Wkg0Y2jT4RIAH-whACTPSbHWmoJpksVDNU3oDqZSLa5jkhtg8y0yyzTBdqbXh