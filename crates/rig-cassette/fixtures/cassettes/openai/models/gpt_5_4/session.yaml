ot promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order's status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-5.4-2026-03-05","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqvHT6cqSFkehvIPFZVbmfJhyOrjtCiIii2dczo_PPCAIT174iuRBbGJFxW-ehIMILVaJ4FCRx9oMDp1KcPBwwYr0-n_9jQhsYhhLOI2CyAWlzkeO1-h_JEG1l8l3BwTZrGeXEHDBgKEkEqyXZN1H6jOhxg9ktKPUwIF7-FXl9O2TVg6G13bBys3aye-H68_rH889iS9t9_BYm6-12ZiMFmd73BHOz02TZ6BXModQjj3amUUqjSu0QTUfPmIS1GB1LQkAZN9rjsyXhC_JF-WD2_gNeJ1n2Km6edxNrkR8K4c_aMw9ybRoJwt4LaZnRUeZyn67e4BJcwfQ9p-AVKkUzC6sawneBmouWNUJEn4R_6DsjIkiDXk5pWfjn_nQu82K4uhxizZOSb82e5n2UgGZgm70qiYHvy9T51CcPOeeT27g_6Vcze9I2QThbqCbX2uRdk1cUtkidletmaR35KwIw9wN-l9J-8_QOP5Px6scWwN9QDTmxLuXRycqpccn-Nf6oij20W4xuA5JEN2HWQ3G8tJsKyy0vuoOVz_WCv2kr-Arf_KXevX6txVAGP6e-UQXeFG9sjztvFzzkl1NqwBE-mRJWDaAEZdXyBRqoMlBddsByjqBrpy5G7ucaLZWTDeVz44LhlHmrsVSbEf7Tg6qTWTAw65vlOfWffBsBdxoMg2ikeFQ03fbET8seeVJ4h30K69KIIWzLVKs3_bVWd34iVqlJmeKsKdyc9vrJGCQhzBhZb0XDUEKmhNRQ2XgciXXiVyyNHYsBYOPEOz4lH7MQr5d90zbS8aqRNFnKJvjoVAqsarWh1jM5pNuNskKzCVE89fb8Op_rhTsi1XBB8caxZL8Stz0QNMkP8jiTqLaNHVjw7o6j5_L39RdDYkZCJOpg2Xk9-ZRwqR4HMDNUvqvo0zYAsM3xy4ctYrIaHLCF7NBlpMZdSF2lyR03XGdupPV_m6S7Qy30u61FEPxW2Kq8v6UR046t3hIYZQNIg7VpkuiVp0Em8PMDV3dTfPEs77DB8gq-XAYZf4xmkjOeajFq6yFzcSYNDfk5V5nxNKamtRn5mkXZ1cr41bMB5BHjWCbVi0BjNFmlZ4zWqubd1FmPhIL4VqJFthBJ_YD-w1uybsRbOmn_cMzDzd0VNemshZMdqkRKRhus7bnaOHijA6TdVpCTMqC3AIcCpKLn5h4qKjjju8rAmLFW_2sf8KukrEK2FqJasU9e7glM3iC78ybhmGmTgerQ_pOUYz4jzVSlT_gulb9lqDEXiq-nMzndMPvhoj53","id":"rs_0df52995b78c724c016abc74f9ab0c87d0a6bc387dfdfa5d58","summary":[],"ty