ule_pickup","output_schema":null,"parameters":{"properties":{"address":{"properties":{"city":{"type":"string"},"street":{"type":"string"}},"required":["street","city"],"type":"object"},"orders":{"items":{"type":"string"},"type":"array"}},"required":["address","orders"],"type":"object"},"strict":false,"type":"function"}],"top_logprobs":0,"top_p":0.98,"truncation":"disabled","usage":null,"user":null},"sequence_number":0,"type":"response.created"}

