  body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"MAIN SESSION. Hello! In one sentence, what can you help me with?","type":"input_text"}],"role":"user","type":"message"},{"content":[{"annotations":[],"logprobs":[],"text":"I can help with order status, shipping, returns, refunds, and delivery issues.","type":"output_text"}],"id":"msg_085d46eaa1dfe4a9016abf641732d887d094977eed8588c413","phase":"final_answer","role":"assistant","status":"completed","type":"message"},{"content":[{"text":"Look up order A-1. After you have its status, look up order A-2.","type":"input_text"}],"role":"user","type":"message"},{"arguments":"{\"order_id\":\"A-1\"}","call_id":"call_AGIsWdFN1LsTJzta8OdhL2Z5","id":"fc_085d46eaa1dfe4a9016abf6418ab0087d0a6dd4801d2d302f8","name":"lookup_order","status":"completed","type":"function_call"},{"arguments":"{\"order_id\":\"A-2\"}","call_id":"call_qTc40pq3qiFLjWq1sqDUjqoV","id":"fc_085d46eaa1dfe4a9016abf6418ab1487d0bcb9a56dcf78d440","name":"lookup_order","status":"completed","type":"function_call"},{"call_id":"call_AGIsWdFN1LsTJzta8OdhL2Z5","output":"{\"order_id\":\"A-1\",\"status\":\"cancelled\",\"date\":\"2026-05-17\"}","status":"completed","type":"function_call_output"},{"call_id":"call_qTc40pq3qiFLjWq1sqDUjqoV","output":"{\"order_id\":\"A-2\",\"status\":\"returned\",\"date\":\"2026-05-18\"}","status":"completed","type":"function_call_output"},{"content":[],"encrypted_content":"gAAAAABqv2QZe2FPuWySLCNFqxoe_D_E27PuqR1g6wVBwIJUtD4qpp-hddPdnTXQDX6UlH-P-9j31eE3dJ-4NxLRE1shkR_8ARWiGd7dnepw0ujq_2AGTLTy52oce_rf03JsrEFBYmO0bKrdepVpsRiJgt97Pn9RZRJaCDhnFapclJvoIBWllIefcWT75RzDdL9LObQhYAxZVTalOKxWhSl6mp3WSZxwFtALl9mDKqG-w7a86todXP2wyNn8TgBqUcajZlH2S7gkmUQx4aOEfGC0vZ4rW7JTRiXCho1pgh2ku2yfzYTB9TMuUsTiu7LcDnlsoGz4bcpFVyMLeG0WTBP0EHksWi8pRDQU-xYY-qv7NHfTYwlczI8kOKg1-I8Mks5UPe8EpYNQCdOuYyxvNWCNf-6s79zRhtVnIXGRE2BFDShDfNVbaIz403pgsMk6K6YvlM3PZrgf_enMD2okQoUND4qA0GyyvPWU4hkpWCsmx7YbAiksjpF-WxWf8vSeUSrjARAWJ_-mYR4Y4kElO6BGuQMOnOnASwhknXjHw