wer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"model":"gpt-6-luna","prompt_cache_key":"rig-model-session-gpt-6-luna","reasoning":{"effort":"low"},"store":false,"tools":[{"description":"Status of an order by id.","name":"lookup_order","parameters":{"properties":{"order_id":{"type":"string"}},"required":["order_id"],"type":"object"},"strict":false,"type":"function"},{"description":"The current local time at the warehouse. Takes no arguments.","name":"warehouse_time","parameters":{"properties":{},"type":"object"},"strict":false,"type":"function"},{"description":"List the customer''s orders. `status` is optional and filters by status.","name":"list_orders","parameters":{"properties":{"status":{"type":"string"}},"type":"object"},"strict":false,"type":"function"},{"description":"Schedule a courier pickup of some orders from an address.","name":"schedule_pickup","parameters":{"properties":{"address":{"properties":{"city":{"type":"string"},"street":{"type":"string"}},"required":["street","city"],"type":"object"},"orders":{"items":{"type":"string"},"type":"array"}},"required":["address","orders"],"type":"object"},"strict":false,"type":"function"}]}'
