nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6-luna","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqwUiyhyHZRNZs1JYfRHkVyuuPMFuOVzoh70jOoXbW8bfwSOKSFOgi_Dj3FjTTy5kS3VXjJhXbYnv82geq3Cg6kSVYYFKLemE3dTfZNSlFAAFkYApVc1c0NLlcamza_8Ydo8qEoViuXDoDg7hFibapIg96QU3YnZD17SrEozIe93s84y89OtRlfhd4_79QFfkUunt8b0HYONKJJ_qvRjHqxmOhi0U3Dv0d6QC1JgbIB3thlIF68aBuHdxVPe1SKkW6oTy_xCkImeInzs-ZHUko4HtkjbP6OOHM7zvA4CZ0uqx-WFADAuaKk5eb1sYFmu7VE6Fdf5xGebHx7pTVwc9j-VV7wNWdXLjNDK6kjCmpU9TvrFcpg5cq_2zfF_O-Hf9ohAhDKmEOYA-4F_KwDgafsLoVZO6imdafcig3PA6kvJumv0QioekPgEmUCQ5pbWSeHYy305E4sQkySYM18GdGJ5nEQzL-2fQbUf3sDK227awfiu_hK5klmFJPutuDIfLtBcltZklsuHZazLMWctCwXaocQfLHL0SxrMCCR04Bheu6hjbYj7JKMBq2hC-wezK0nyJP73wf-t9Uoz2id9iJWF9RyuHa34AmqHsEZIkd4RSKsPWOQ81VkN3uqEz2RFciMfNxzKTRK3sy6j6lY_2BcDZWxqUNDGlmJ4x5f22x2HzDU4L03en5DcQT_-SLm3a90bUwAEk4QMCld8OlRY0lgs2e7giP2JQiu7hdntFkyids-HJN1BbSY-EArcj_jCsb_clWFy429FN7qilpjOSwp-t6-4xjKfIfEvnc289bF57UG9VKPYqwYJ8sDFcmgJat5Mpbw536IFvcQWGzGfA1qS-zi17EAk2Zf-H6Rgeaj9QKNb8eBSTQV1Tbqsj-_H8vG5iz6rykNO3OZBk-8Dz65KAtuvitomEnfTVtcAlB0f4vlHlpqN3j-qBsmPdTWw36xMdLOqsivVWHh_lnrv7XNhr0S9N9mUBIhY_7jKOhd7pwBPR-_6bPVzrPfDmYC1SCor7TYn27U1OGwKeJ3bI6ofmjjpyWxOAjZ2Yme09lV6hZRFIOoPMSl0RZxuGXBQCCfM074ye4e1dBS5smawunurXA_aF0FCmpmZ2vfhbwT9D2GBKoFAWTxJ0mk41vgsn1GayEkqEFpQ5IGh0wn3j3CNm-vbj_XyHOtUBE2AsljQHbnYcVALZfo9yhUiPErAs7k0ZXNgv56-4Lt5fmr4fNfrC3Bsm2mqSCMnB_flKezUQrH1mtexsV5cTrdy40ENfaSRNUwizDY6E98-qhv3xNWlchGA==","id":"rs_049642f058f35e06016ac1