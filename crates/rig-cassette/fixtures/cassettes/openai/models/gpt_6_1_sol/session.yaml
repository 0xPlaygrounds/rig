nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6.1-sol","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqwBmmEiTqpFi1D-DzbS5AnSWxmeOD77Vuh3k5jbdQiho7aEy1OIruA_SUWObAnJJ-lrXREbO6wKQ5jlRQBPlmvzJnKpb6PqA34DLA-brc_AEVAzIkiKIjKl92ZEc4L3IAdllJBttkSCMjRiXsERy9PCPTR8bMV7i71hXHyz2ZtjMONJ5HPSkgkVwxfonE-29HU_GC1HXq06H5i8TR4eCYQj4zrgZzX3A3C_rjjINR95d8kmBM3Jaoca5DC2knJpxVSOkXZ9zHq65xFiHKjBZxX1qyT3V2JGSvATlFGyvANfDQqm2sQFtfClj66vyBPl1Zs8HiCxa0d--hlrSlhuFcqgqN85vCHMuJORHz9i0IwqzJkELuqMhngUbOFhuIe1bZYoHvxtwvBWWmuqhmMu2DqGkVj8QhrSl4AyUbaZ3LzQqk5MYb4T0Fs6MsTPAO6RaoUpRsC-Hp55I6PTEoKmR2jk6q_gJCKHUoYBkk5sHrVJwHnVFB7mQfluwYHANmB3tUJcxgg6SwfWqmHAH6qMm3MSHPK0WwwEs0uHpBu5yzZyN03whiJ8aKN0fBPlV74_lc46NYWw_E4OIWjZy_Bz3Lv4B3PJ6SnAqfyln6ZK9wvrBHWVqg-RAqIr3ejda98Yc4nGtX6NxZk9GeY0rkY9OHqX6Va0NBeFU3bAYSwSKX4iRHnDyWTLC5nsnJPrpGHf9aUfa9klcPlGDs3GbUprjLnMIMbDeOLyu4S7Wx2NgzDKWOHTxHBkcwte6-3Q5x9QJJle_BKo-P0q3EfW0mjMtlhinR1GI_HuV1lTFzapa21HdpaC_3iocel8EOsw-DDcNT4PcWP8wNRHr_KFK8EzJx2CtzQhII3gLA4_p_94SoUuQXPl0NS9NMLbYMAttpVMhf5FhuTrKzp8B7iLnBz-jNGfb-PqTrVRlH1noUPRwJJeFMGAE4NuZvkSQpkNhw6pu6FqdkbZU_EewtvcYgneZpFLtRTjPZF20r0znhQEKMUitWel5NcNu0gjQtXPumw_w3LBNAm8rUFNzHjRMRwxZeyFJqeMO9MyKDjRdp7kEPc37zjGxSO-Q8y80hA4mavWS602CPrUhyrvI_gu038SiwpwfizMBoqB4h57DC1x-ekHRzbpteGDa_ZH17hnlZg4k5xD4zDIUE7b_I6yvkc8LnD-2i5uzlOR4a9irlQb4FmyokcV_lr_jS0-zB36ty7UmjueM9Cv-RQeujswLJpgiDVlFn2w==","id":"rs_06cfbf203cb9ddf7016ac019a5167087d0a8c1916e5946e3b5","summary":[],"type":"reasoning"},