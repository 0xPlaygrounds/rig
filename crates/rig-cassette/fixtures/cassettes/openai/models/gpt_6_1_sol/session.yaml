r two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6.1-sol","moderation":null,"object":"response","output":[{"arguments":"{\"order_id\":\"B-1\"}","call_id":"call_T52yZ5kA5oZTsQJWyhQqoiAx","id":"fc_0e8fa769371a1199016abf6302a8f887d08699968828ce932b","name":"lookup_order","status":"completed","type":"function_call"},{"arguments":"{\"order_id\":\"B-2\"}","call_id":"call_D79vP8cDDGsh6JGCom6Br6l1","id":"fc_0e8fa769371a1199016abf6302a90887d0b42465f3661793ee","name":"lookup_order","status":"completed","type":"function_call"}],"parallel_tool_calls":true,"presence_penalty":0.0,"previous_response_id":null,"prompt_cache_key":"rig-model-session-gpt-6.1-sol","prompt_cache_retention":"24h","reasoning":{"context":"all_turns","effort":"low","mode":"standard","summary":null},"safety_identifier":null,"service_tier":"default","status":"completed","store":false,"temperature":1.0,"text":{"format":{"type":"text"},"verbosity":"medium"},"tool_choice":"auto","tool_usage":{"image_gen":{"input_tokens":0,"input_tokens_details":{"image_tokens":0,"text_tokens":0},"output_tokens":0,"output_tokens_details":{"image_tokens":0,"text_tokens":0},"total_tokens":0},"web_search":{"num_requests":0}},"tools":[{"description":"Status of an order by id.","name":"lookup_order","output_schema":null,"parameters":{"properties":{"order_id":{"type":"string"}},"required":["order_id"],"type":"object"},"strict":false,"type":"function"},{"description":"The current local time at the warehouse. Takes no arguments.","name":