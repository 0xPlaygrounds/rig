p_order","parameters":{"properties":{"order_id":{"type":"string"}},"required":["order_id"],"type":"object"},"strict":false,"type":"function"},{"description":"The current local time at the warehouse. Takes no arguments.","name":"warehouse_time","parameters":{"properties":{},"type":"object"},"strict":false,"type":"function"},{"description":"List the customer''s orders. `status` is optional and filters by status.","name":"list_orders","parameters":{"properties":{"status":{"type":"string"}},"type":"object"},"strict":false,"type":"function"},{"description":"Schedule a courier pickup of some orders from an address.","name":"schedule_pickup","parameters":{"properties":{"address":{"properties":{"city":{"type":"string"},"street":{"type":"string"}},"required":["street","city"],"type":"object"},"orders":{"items":{"type":"string"},"type":"array"}},"required":["address","orders"],"type":"object"},"strict":false,"type":"function"}]}'
