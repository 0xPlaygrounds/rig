nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6.1-sol","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqvHYQppBUrMd486Md4KlwVQXEOCVBdqY0kDEWLPTP8MDOlR761ySxkfsano_f3o161NTGvpo6j9u0TuB01Qqx604B8AsW_fV1kjrGTkg_ihbIb5i30GnumGS9oRy0iOzJTu3UMvAXIQZi3n7QthNbAXrprHCo2jp6xbFQigZqlhK7rzZ8WSTIv8TEpCVCLkE7Y-rEWVmb6wLYWbkGDrhLngmctGo9SuTElSWxocv82eq6eeoBCOxRcAqeRWeN641qQa1GWtj0zIFGDQTj93u9irhqmHYrPpc3mnllSX2S2zwUyX2zl8Qh0XETSkNS6B-rrybrhMDvpGvubII5n3NMnbvdKePurD386SbtZMtKB_goVeLEgtk12OOytnL8AKtQpEMgNl5lhJNfjlwMWPoHHt4RZPFQrXeQBBTtr9FpYa8BGu8KAlK14OMDoIb3nMUnOHN8RlyCedZuPt244mwIHs-reZVr3EDgGm8zzF8YlCQEaqkWCHScBqxte6kRBBeyCoSMUvY8WAVh_d6qp-uPO43NvIewl76R6qd4BlmBQRmtT_2XhASiU2eFm62yOzXVjLQPCHc4qLauHqTVqZT8fGDCFW_HO_2im4gtqe2OmRvRkd-EQtyvzO3tk6hA_vcwXXBZLd1mtKrqCQmEx82up-xMfpD-bXvaopVAZEEqN7rqTrUzlB-8Tyfpc-ZFOej0aQe-Um0T6w5RqjHDvjj4SkuaU07puyByFX_R_zIiHdUqXKTrn9-cQEY9ZYTk8kUq1mSlpbFnFLhkepHBVy9onOGQFQGkZ0-Nh5faOg2vanWmjkn8TaLoBuK4KGSqicP9dP35Va1ZYrheTuLAl4MxjQWmiGP1R35KZ49FlXCHbParNPM-zTTJ9mlKmplGePWnGrWqWlQQhY9JF-zjjVjWPEnNl3Xa7U_t9VmyBCIF6ER4XcPbC6ypjfE7rndTdT_EANyuG4Cx0fSfCtlKUmcPhG3DAiX7azoXVByyU_9EJWdtesLSmyGNzhBeeXCcpLxTtQnsnV0fUOkGi8h07ziucSgyHq9d3UqsdL3P48Vxmq6GtGYjRCEFv4RLsPEXgjRlae4TPn3d_5m49fEF5HR_qZmvLYRfwa6JdZ4fFLO-kUYrM1xx2PwsgHJX_ecDcTYGVcYefUtJ_TQdARnKOym8Aki5WNNv350afm9X5PD-Qb0rc52f30gdNxLa4TNM4vH4ygc2vBStm9IO01QAMZsZIHLnOg==","id":"rs_06c87c7726ea2a09016abc760ff4d487d0af4999f9f96501fc","summary":[],"type":"reasoning"},