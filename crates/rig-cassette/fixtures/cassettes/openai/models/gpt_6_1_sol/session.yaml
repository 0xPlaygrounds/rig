nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-6.1-sol","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqwUfnUdJmFUdBrjst09ILXYXMsm2CDKn6hObvTIhjtOGkZ4G_QBko5m9i2itJU2ynBzHtbCMlzepS7T-CqXGCVs4BSvRlb8xmVF4j1EcEzbZOYxArUdyHMazw0f6f0i3tXXtUJHugkVn8J_5IO9fFBLFnzMVqsJz7hNyJDcIzxiw3VigbyFMLtcUwbWCdtKQQKnOmFOtyzf7Id0WbAJClHq3tQvKnrQhSCwfoqdnD4zP9liKOW6gMlpcDuL_quNneZQdkDLJhxxbuA-ordixTieyyz3lZeIgIhJLV7--UoSZlZWmQMf3ut8t1f03YT-LPQoEhC08z1uDLlW7rBMrRXndKhWxIJuEiJ8tvjBRU1UvfZxBgdVS3EF4UdfyN935EFKIAESHW0N_3NeJYrbEVHPr725NrIidZ-IRqD1F37mrocxXSS1AM-FtM4PPWxaPLWBQt0kvdVU0vj4BMyZ0DMl7pS4nmofrhyqOBPHfjMMiX7jYXcKYrbuu0dtEizw6OMNop5dLWcDILXZnBAyxWDFSN0jGJOWZtxqj0r-Rp1KS5lc3uGqTp-R6eeXjGFNRgv4tmb7nb8ltKugP9pmbNDkzvQNouB0Roct4KKz0sxdBjdJEFPU4NCxts0ZWFFkVYjaYc-oVb-l1v_yIAwF1Y6rOSBOddmz3inbGlg_o37MTQCxmtyGvUq6ytnb40Yi90dtZ9Bh2cSkvZwAOHEktYtkK5VTJObZI37CjhIauufKIFFY-NFaUiN7EzOiIyOhSCxSb_hisCdYh2aX3GbLlUM6Ie6gFQeQefBgSTY7gbYtJcqjpkn3BwApTVnRO-f_yf6_I-rbmPWN8TX20o-2LArEogSydsXTkknURwWYuay_JaEgK4gUJrsTEVu9KdAa2rbQwbkvlEfHk9kOGY4GOMSrkk1ZGKoOKXIzfpL_hA-bISBo9B3QTycgIu4BFLunZB_uk8EO5f-yQ9QljaB2V_EXlbph7jYmzafICnqUKA4xZ7jf_Z6ALLpf8GLLd_XENijcUW0wl1cbw38MmVw5_Lp5CR3sxUFav2Uk_pGz30yEXQjRW-RE5zXz6vjH_azLgGouabgQFwFEOHYVxOE6icwCCTgX2gj3wthls_wxcolFZOnWumiock4DTkRdVyBBvU_fTrVCow0FFY53hkCT_5veEhSRTEJq2arb7VbKIECa9o3kkdNXkik0rsG205az3A_b7p15GiIhL4if5p-PYTufP9Pg==","id":"rs_0054959b5560cbee016ac147e67c7487d0af368d151152b93f","summary":[],"type":"reasoning"},