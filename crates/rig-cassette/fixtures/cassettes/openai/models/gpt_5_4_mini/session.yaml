ot promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order's status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-5.4-mini-2026-03-17","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqvHVf_TqNn4mULgDQoPi0Dz24bji-WFh9zXQMo12UJ_gMjJA8UrXzMsIKKXjqCtQXxGZD8UVUNFD6Twjs-R5p8_YyDoEc6dz1Nq0JbOQFX_EvcroSMpt_XX7kdKGigADKg_ZE6_qMFjzvmxK3_CPkwVd-oynB2Wy8nLv_J_mu9t79lzF5GmYjN9yTIzq6R9DqWRANljbT9w8ll8gzheWdfxzrRDiF3P_-vN2j7Lbl1FBSX9_dirGXM43TwNDDjoKUiqEZNfXu1qNhYDCcpq9axZyEcQaMnK0xKfBQ-W2qZ2grxXhaKF5OmrrjURnX6TCJ-EEqnSCh_oN2PsOj20GkaDcauGEOrXBZOfRbi9un5tZtw5QJ1cbrM2mo_5ri0rKwqXjgX33V35kDRc-FEKzfj4xjy4PhDzl6Y1ptFkKsKV2uBoTGEIzkTnjJ1ET7XIxB_U14yvA7HZx8p_xIrHhUoFWM3dVEPmKquRrKZc-NFJ-02J1hpVw1pjgWE0Kj7KLj4zfXKBvV8lJE6wOk3sljuNITedGhX8iTJFGZzvYWcRxvnLQUQxI4f0oFg9J2vCpBSrZY7q7opOZxDX_R8RZrD9Aikf_7aWo9onaIB7IoGWcmuWuzmM_jqkemGuTdZRBlTBxu2ahU95d2mpQBvQyOmSBy3Q9eUw9lKlzTx4znh1nJ7evcCSxhaZCjiZfaiaRLKL7hMBsr9TusP2QRMIa_zB6x7MYrPQUyVt7T6kMw5Y3ygZkoFSED3rG6p-jaeZXd-PlgZeeRrMDYWpRjjT_t9GvvQPUyl9r3ku3zrwCKvdbEy9drkn2hAvF19EZT-bZwP11KgRdTFBn21BXYBkmU3OCV3TVUaH_Y2wdCY3vO4mCIUmSnriVMumZgm9ZTcpj9xBH8q6OLFp1zwCihtEyxewdy_yJ6V9YWG-DBEqatNBnDvbfndhFqNWBKPtPL2Ws49MfxnsgAp8GQ3dleQ0rApmcZ77pVUWr_RsnQe2tHdhVc7HmI87SVtDHA7kaLXgQvBwolfpCbwU46JIU-J_0uJbkYsWVnXyPQRZA5DLCgbMu0zv8VdgITyL8FBBUwBr6JiEJw_riLDxfFvBcFsI24ugC488FWUnPRHf_XE37vnplO5SjLzcPH3xYsoYAZgj8zvsfCTYfo0_Ny1qypog-TluDGO6mniq9XpKXLpO5pOIWwPicDRQp9dcVV7C8-5O7t--JjlmSaXlLQrE0hWk_9kv9YQA==","id":"rs_086e61049bc48c3b016abc755ef4a887d0b6bec4e00cf62999","summary":[],"type":"reasoning"},{"content":[{"anno