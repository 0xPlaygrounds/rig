nto check the id against their confirmation email. Never invent an order to\nfill the gap.\n\n## Shipping and carriers\n\nStandard shipping takes three to five business days after an order ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n\n\n## Tools in this session\n\nUse `lookup_order` for an order''s status, `list_orders` to list orders, `warehouse_time` for the warehouse clock and `schedule_pickup` to book a courier. Call a tool whenever a question needs one; never guess what a tool would return. In this session the customer also sends images, documents and questions that are not about orders: answer those directly and briefly, exactly as asked.","max_output_tokens":4096,"max_tool_calls":null,"metadata":{},"model":"gpt-5.4-mini-2026-03-17","moderation":null,"object":"response","output":[{"content":[],"encrypted_content":"gAAAAABqv2Jh60iCi2E3XEYWpT7h6uuLVE1nc5hIX6P5P1imxtrfnq2bIHqgHqtSF6z5Cc5k5MQ4Gmc1AAaPq0ShNJTi0l-akF3lH1upLmAgkbFvIlEsbTwyKO-SHFGmllJz_OVOrVbe3X-xviaSD4qX3G0eccELKw7FwZenyDgqB6aVxDrY2-pHnNm4ewjFAAa5dq64wAQR6gBNLAqDjL6I98DET0SnMmehmfaD4h2vqMlfUJjksxYODW-9yNnKGUI6irF6TmkREkaapv5_xZxcv39N3eiQnDFsfRfWv12nYZOFK2glULuG1-lH1A39g3Wlvqqi0evJO2xCWMg4Sr-1nJ5yHJLyHbl6n8knHfUuK02tIpjQ2YJu8wb7eVt2igdXAbrAA5yLU9FtJF3nQyWQ4GVkpVL_EKqraQcshwCmkB-6Y3y-m6t0TW2EnMhrb7zrbQkEjk99tE8_ULdWSqj9fh4UEVBVJwrIWLv7H_NPuH1dQHvOIxXHBMWoUkpIIS2Afe1Kb36J20SgvM7TbJQpuyOTIw8jLJbvGaQM5wgySLqw7z20ChW3fUxvh7duIGvrM_69iObdDcT5r9rl40wSciUDqFyBIIxX29gGsGVISFnpSQspJ_JDj2rK3YDjX-laho9uskvSEN3Z_noUac5sv1pYNm-ePyAz11aB0yVLb91jvylm3JRyZQUvys_k-IvG_cfqQ7wDQ1THK11OUS_3Vubt6fWuMfEpwjNtA8E9Bs01lqRgSxXtPqjmEKGZ8G7Cr8usQevMQEsbXMvluIP1n7WRYm7MrxQwvyYdKzodijWev5O2kG7QmVwW-ZKc3GyLTPEVBCsm1yt4rd1iz5mzCdxy2u2yLpZzO9M3pzw-9323_5ZQtE-cAfEFaFqR0nXZJWY72Bi_RVlvVWCejHg7Sa95_V-qWLHl2ZD7n13bfj75CinfYEfy7XfV1P8okuFTvbSgGvyXnxaUzOo5S-cJrajlFTMTq7PFcMkegcDkntYf6Y3O84hVlhcT6gL6taUYbiR3GmVLHFo-DGyjW9coKLGry_mcf-0Pm2yi9r24R0b115T99yjm7RgrUjf3z5Hj4Sb48-sxl4lqnCVER0AF7VTyw2X1YqMyszh4TeTG8aOIPPq077WelVeyUNlPdygxWoBOy8POtBwy-ZiqV-ejm6-ZvZRNqDsPjVhjZaqNi00NISlM6XMnP-FmQh3MYeEN4pWq65M1lU4jL8UT2XI1aqVp9T9KZg==","id":"rs_081c4eb1243f6852016abf62619ecc87d0aac2246cbd341a49","summary":[],"type":"