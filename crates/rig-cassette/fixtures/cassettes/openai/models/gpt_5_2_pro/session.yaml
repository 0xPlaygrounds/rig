  body: '{"include":["reasoning.encrypted_content"],"input":[{"content":[{"text":"MAIN SESSION. Hello! In one sentence, what can you help me with?","type":"input_text"}],"role":"user","type":"message"},{"content":[{"text":"I can help you check the status of your order (just share an order ID like A-17) and answer quick questions about shipping, delivery, refunds, or returns.","type":"output_text"}],"id":"msg_0397a7bb37cb5fb7016abc29e3034087d094c4ceb1dd2540d5","role":"assistant","status":"completed","type":"message"},{"content":[{"text":"Look up order A-1. After you have its status, look up order A-2.","type":"input_text"}],"role":"user","type":"message"},{"encrypted_content":"gAAAAABqvCnveoBsDpUy_cDMSgykwsdX9kToq8S60lFOXZtVKGPPWjGIvS9TfpJ0mL0MV9MIyvb4xRnKxsPQpxbI5SpfmNUBIbctAea3ac5Fx2E9T4UDOh4zgGbz4xPK_FwPA_PThFodGDsPOaV9JUPl_2l2MLrEb4GnZS_ML1KV6d7q0BzBKaU2i3BADO5t6loUkR8kPHd5mc47MkFqBZ3TBJ1In9_J5_fHG1vMbYQE4HOvJSDJ5fSVipydirYoUHjV46pQmEoZNu5DX0Qy8cN1IfZN3sU6bFL-5IWQ5aGSqN6L7pEUJLa8SoE_fJy3_3KaD5uk5HtdrvHGQsLOa9K45quThp49XnE2w-Nh46-kfaHgv4n8eteWzPc-xV8A7rq5hurFRTLXnp6misHsPON0LNUjadb72-Q8oi4DP-83kiuUPLHxCgITD1pwwLWAkYWMNg262Im2hCtVSk2QxcVdtMgxEYAYFnXCuO2fv60Hhn8BSpIwjobMqoUEV9v11WPAAiFKwX1y02kwthfyndUMvbfPcmgFZRmDRtK3VwqXVNw_9PVXSYtwDEHuhz79qaxixleEJ_rTqd9cT3vo5h5GV4he0yp1Z5-lYV49phRWzPJzg9WQLhQ5F58FHq75MJI7ttRX8dD-xmdWM8J8P7jAWs5jZWUY51jct1ezAPkVtCRwICYnVd_lWoRMdM-jRXKf6ETR-tqm3zrqU6GuMveJXhAN48VlHs20VzNFjZPi0Z0Zsnu3cE3AEWKEfZ8nQaROKvLS2-Zcg6gJgFSoxdY32ZkHZCrBxat_4Ssfp4CNnkLU1yc-o7CMN-R948pczOpGIxLB3l_sZzOPjShIvH3ybiI5awlQmshV13ZymUa7yVo_ev8WfNivyFoQlwOydlggXxXna3UlP9In6gpBHEgNfLos-QcIpZ9NGCZ0au8h_eeJruhiSU0UHVp5M6VCrt8hR_NUQeqcI1uQISF-VqSRcPhyIozg9LrZfOjmYcYeK3gTQ03Bxl4fmlsebqqdn_LpCgE8lMr6-YowcdgeswBkk4gIXrdkqq7PnxYIC-uAG1O-NM0exK4QjZn5WkiUpa8m2mhCpmv2xVpBhuNt-gC9jbHYNSfpr0jb2NWV48Ap9L0g9UXRNC9-8s5pakTeJ_vtFulV-SIKHhXUIn2mqau8tbvau9M9hp3Y9n5ipjKu1QnposLJqT5yOqnRUQJzpvtfEqyueXc1lHGxt7PY9Ylq_8HekVtSAcmIsa6VG5wPeBXCYSjuGZHcYurEXvrmQ4cY324gVTmTWXigDtRmi3SVlJ1L8DyW3YI