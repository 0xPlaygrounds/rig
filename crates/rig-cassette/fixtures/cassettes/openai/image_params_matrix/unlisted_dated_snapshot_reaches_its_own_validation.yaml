when:
  path: /v1/images/generations
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"model":"gpt-image-2-2026-04-21","prompt":"a plain red circle on a white background","size":"3x3"}'
then:
  status: 400
  header:
  - name: content-type
    value: application/json
  - name: x-request-id
    value: req_REDACTED_1
  body: '{"error":{"code":"invalid_value","message":"Invalid size ''3x3''. Width and height must both be divisible by 16.","param":"size","type":"image_generation_user_error"}}'
