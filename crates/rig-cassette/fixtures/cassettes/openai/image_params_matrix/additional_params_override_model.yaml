when:
  path: /v1/images/generations
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  body: '{"model":"rig-nonexistent-image-model","prompt":"a plain red circle on a white background","size":"1024x1024"}'
then:
  status: 400
  header:
  - name: content-type
    value: application/json
  - name: x-request-id
    value: req_REDACTED_1
  body: '{"error":{"code":"invalid_value","message":"The model ''rig-nonexistent-image-model'' does not exist.","param":"model","type":"image_generation_user_error"}}'
