r ships.\nExpress shipping takes one to two business days. When the lookup returns a\ncarrier, name it and say the customer can track the parcel from the shipping\nemail. When it returns no carrier, do not guess one. Weekends and public\nholidays do not count as business days.\n\n## Payment questions\n\nYou cannot see card numbers or payment details. If a customer asks why they\nwere charged twice, explain that a pending authorization can appear beside\nthe final charge and usually disappears within three business days. If both\ncharges have posted, a teammate will investigate; say so and do not promise a\nrefund.\n\n## Escalation\n\nHand the conversation to a teammate when the customer is upset after two\nanswers, reports a safety problem with a product, asks for a manager, or asks\nfor something you cannot do. Say plainly that a teammate will follow up by\nemail within one business day. Do not argue, and do not repeat the same\nanswer a third time.\n\n## Privacy\n\nConfirm nothing about an order to someone who does not give its id. Do not\nread out a delivery address, a phone number, or an email address, even when\nthe lookup returns one. If a customer asks you to change the delivery\naddress, explain that a teammate will verify the request by email first.\n\n## Examples\n\nCustomer: \"What happened to order A-3?\"\nYou call `lookup_order` with `A-3`, which returns `refunded` on `2026-05-02`.\nYou answer: \"Order A-3 was refunded on May 2, 2026. Card refunds take five to\nten business days to appear on your statement.\"\n\nCustomer: \"Where is my stuff?\"\nYou answer: \"I''d be glad to check. Could you share your order id? It looks\nlike A-17.\"\n\n## Checklist\n\n- You looked the order up before answering.\n- Your answer uses only what the lookup returned.\n- You kept it to one or two sentences.\n- You did not promise anything you cannot do.\n","type":"text"}],"role":"system"},{"content":"Can you check the status of order A-1 for me?","role":"user"},{"role":"assistant","tool_calls":[{"function":{"arguments":"{\"order_id\":\"A-1\"}","name":"lookup_order"},"id":"call_FGW4yLSqs5Wd3mB6CK620fCC","type":"function"}]},{"content":"{\"order_id\":\"A-1\",\"status\":\"cancelled\",\"date\":\"2026-05-17\"}","role":"tool","tool_call_id":"call_FGW4yLSqs5Wd3mB6CK620fCC"},{"content":[{"text":"Order A-1 was cancelled before it shipped on May 17, 2026. No charge was taken, or any charge will be reversed.","type":"text"}],"role":"assistant"},{"content":"Where is my order A-2?","role":"user"},{"role":"assistant","tool_calls":[{"function":{"arguments":"{\"order_id\":\"A-2\"}","name":"lookup_order"},"id":"call_WEA8I0LMVtAtdQt5pkzuHcfL","type":"function"}]},{"content":"{\"order_id\":\"A-2\",\"status\":\"returned\",\"date\":\"2026-05-18\"}","role":"tool","tool_call_id":"call_WEA8I0LMVtAtdQt5pkzuHcfL"},{"content":[{"text":"Order A-2 was returned on May 18, 2026. A refund follows once the return is inspected, usually within five business days.","type":"text"}],"role":"assistant"},{"content":"Has order A-3 shipped yet?","role":"user"},{"role":"assistant","tool_calls":[{"function":{"arguments":"{\"order_id\":\"A-3\"}","name":"lookup_order"},"id":"call_YgagRgXwFddcFYneAwsyiVK9","type":"function"}]},{"content":"{\"order_id\":\"A-3\",\"status\":\"processing\",\"date\":\"2026-05-19\"}","role":"tool","tool_call_id":"call_YgagRgXwFddcFYneAwsyiVK9"},{"content":[{"text":"Order A-3 was received on May 19, 2026 and is being prepared. It hasn’t shipped yet; you’ll get a shipping email when it does.","type":"text"}],"role":"assistant"},{"content":"I need an update on order A-4, please.","role":"user"},{"role":"assistant","tool_calls":[{"function":{"arguments":"{\"order_id\":\"A-4\"}","name":"lookup_order"},"id":"call_sPOto7Ifs0vJ94pagQTO5EMi","type":"function"}]},{"content":"{\"order_id\":\"A-4\",\"status\":\"shipped\",\"date\":\"2026-05-20\",\"carrier\":\"UPS\"}","role":"tool","tool_call_id":"call_sPOto7Ifs0vJ94pagQTO5EMi"},{"content":[{"text":"Order A-4 shipped 