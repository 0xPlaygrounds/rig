  status: 404
  header:
  - name: content-type
    value: application/json
  body: '{"id":"a9a94239-15e6-469e-93de-b3557cb3b5b2","message":"model ''command-does-not-exist'' not found, make sure the correct model ID was used and that you have access to the model."}'
