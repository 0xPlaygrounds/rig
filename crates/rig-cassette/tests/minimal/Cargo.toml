[package]
name = "rig-cassette-minimal"
version = "0.0.0"
edition.workspace = true
publish = false
autotests = false
description = "Minimal-dependency execution of the shared cassette verification suites."

[lints]
workspace = true

# Only the cassette effect log and independent runtime adapters: no native HTTP
# engine, facade or helpers that enable preserve_order/float_roundtrip.
[dev-dependencies]
rig-core = { path = "../../../rig-core", features = ["test-utils"] }
rig-agent = { path = "../../../rig-agent" }
rig-ecs = { path = "../../../rig-ecs" }
rig-cassette = { path = "../..", default-features = false, features = ["agent", "ecs"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
futures.workspace = true
proptest = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "verify"
path = "../verify/main.rs"

[[test]]
name = "world_replay"
path = "../world_replay.rs"

[[test]]
name = "world_replay_world"
path = "../world_replay_world.rs"

[[test]]
name = "effect_log"
path = "effect_log.rs"
