[package]
name = "rig-cassette-minimal"
version = "0.0.0"
edition.workspace = true
publish = false
autotests = false
description = "Minimal-dependency execution of the shared cassette verification suites."

[lints]
workspace = true

# Only the cassette effect log and the classic-agent adapter: no native HTTP
# engine, facade or provider helpers.
[dev-dependencies]
rig-core = { path = "../../../rig-core", features = ["test-utils"] }
rig-agent = { path = "../../../rig-agent" }
rig-cassette = { path = "../..", default-features = false, features = ["agent"] }
futures.workspace = true
proptest = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "verify"
path = "../verify/main.rs"

[[test]]
name = "effect_log"
path = "effect_log.rs"
