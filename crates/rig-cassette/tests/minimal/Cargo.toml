[package]
name = "rig-cassette-minimal"
version = "0.0.0"
edition.workspace = true
publish = false
autotests = false
description = "Minimal-dependency execution of the shared cassette verification suites."

[lints]
workspace = true

# No cassette engine, facade or provider helpers: those enable serde_json's
# preserve_order/float_roundtrip features and erase this execution's coverage.
[dev-dependencies]
rig-core = { path = "../../../rig-core", features = ["test-utils"] }
rig-agent = { path = "../../../rig-agent" }
rig-ecs = { path = "../../../rig-ecs" }
rig-effect-log = { path = "../../../rig-effect-log" }
bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
futures.workspace = true
proptest = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "verify"
path = "../verify/main.rs"

[[test]]
name = "world_replay"
path = "../world_replay.rs"
