[package]
autotests = false
name = "rig-ecs"
version.workspace = true
edition = { workspace = true }
license = "MIT"
description = "rig inside a Bevy World: effects as entities, handlers as entities, the driver as a system."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet; rig-verify is the precedent.
publish = false

[lints]
workspace = true

[features]
default = ["replay"]
# `Replay` and the `EffectLog` resource: record a world's effects into a
# log and replay a log through a world.
replay = ["dep:rig-effect-log"]
# Thin Bevy App integration: RigPlugin installs the runtime and one Update driver.
app = ["dep:bevy_app"]
# Reusable fake handlers; no app or rig-core test-utils dependency.
# Native tick_until additionally requires `app`; wasm hosts yield between updates.
testing = []
# The inspector's view: `Reflect` on every component (remote wrappers for
# the rig-core types they hold), `reflect::install_reflect` registering
# them, `reflect::ReflectedScene` — the graph as reflected data beside the
# serde scene. rig-core takes no Bevy dependency: the wrappers live here.
reflect = ["dep:bevy_reflect", "bevy_ecs/bevy_reflect", "bevy_app?/bevy_reflect"]
# Prompts and tool definitions as assets: `assets::{PromptAsset, ToolDefinitions}`
# with `bevy_asset` loaders, and the systems that turn them into a
# `Preamble` and `Grant`s. Loaders need Bevy App but do not install RigPlugin.
assets = ["dep:bevy_asset", "app", "dep:bevy_reflect"]

[dependencies]
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
rig-effect-log = { path = "../rig-effect-log", version = "0.42.0", optional = true }
# The crate is bevy_ecs and bevy_tasks: the bus installs into a `World`,
# the host owns the loop. Each Bevy crate with default features off and
# exactly what the module needs: `std` for the executor-backed task pools;
# `multi_threaded` so handler futures run on pool threads natively (the
# single-threaded pool takes over on wasm).
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
bevy_reflect = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_app = { workspace = true, optional = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Bevy's web executor must be selected explicitly with default features off.
# Otherwise task wakes/cancellation wait for another local executor pump.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
bevy_platform = { workspace = true, features = ["web"] }
bevy_app = { workspace = true, optional = true, features = ["web"] }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", features = ["test-utils"] }
rig-effect-log = { path = "../rig-effect-log", version = "0.42.0" }
# Exercise the same optional public support used by downstream normal dependencies,
# including when the non-replay aggregates run with --no-default-features.
rig-ecs = { path = ".", default-features = false, features = ["app", "testing"] }
# Bus-only tests still drive the bus directly from Update.
bevy_app = { workspace = true }

# The module executed on `wasm32-unknown-unknown` (`tests/bus_wasm.rs`),
# under `wasm-bindgen-test-runner`, as rig-agent's `tests/bus_wasm.rs` is.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
bevy_app = { workspace = true, features = ["web"] }

# The feature suites: a test that needs a feature names it, so the default
# `cargo test` builds without it and `--all-features` runs it.
[[test]]
name = "reflect_roundtrip"
required-features = ["reflect"]

[[test]]
name = "reflect_scene"
required-features = ["reflect"]

[[test]]
name = "assets_prompt"
required-features = ["assets"]

[[test]]
name = "native_app"
required-features = ["app", "testing"]

[[example]]
name = "prompt_from_assets"
required-features = ["assets", "testing"]

[[test]]
name = "bus"
path = "tests/bus/main.rs"

[[test]]
name = "run"
path = "tests/run/main.rs"

[[test]]
name = "bus_wasm"

[[test]]
name = "run_wasm"

[[bench]]
name = "run_assembly_cost"
harness = false
required-features = ["app", "testing"]

[[example]]
name = "agent_with_tools"
required-features = ["app", "testing"]

[[example]]
name = "best_of_n"
required-features = ["app", "testing"]

[[example]]
name = "human_in_the_loop"
required-features = ["app", "testing"]

[[example]]
name = "streaming_ui"
required-features = ["app", "testing"]
