[package]
name = "rig-ecs"
# Replaces the older, different rig-ecs (0.43-0.44, removed in #2761) on
# crates.io: its first release must be versioned above 0.44.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "A Bevy agent runtime on rig-core: agents, turns and tool calls as entities, one recorded effect path, and session journals."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["subagents"]
# The `task` and `message` tools: agents that start and message agents.
subagents = []

[dependencies]
bevy_app = { workspace = true }
# `serialize`: entities read from and written as JSON.
bevy_ecs = { workspace = true, features = ["serialize"] }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
# The clock: `Time`, timers and the delayed commands a retried model
# call waits on.
bevy_time = { workspace = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
rig-cassette = { workspace = true }
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false }
# Open tools' parameters, derived from their arguments types.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# `Instant` and the wall clock, also on the web.
web-time = { workspace = true }

# Browser wasm: `web` makes Bevy's clock read the browser's (std's
# `Instant` panics there), and Web Crypto for the agents' v4 ids.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
bevy_app = { workspace = true, features = ["web"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# The scripted model (`test_utils::MockCompletionModel`) the kernel-only
# test runs a turn on.
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false, features = ["test-utils"] }
