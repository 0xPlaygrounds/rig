[package]
name = "rig-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "The core of the rig coding agent on rig-ecs: the session and the launcher protocol; every other part is a Bevy plugin crate."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[dependencies]
# `MinimalPlugins`, the base of `HeadlessPlugins`, and its clock.
bevy = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
crossbeam-channel = { workspace = true }
# `termination` also catches SIGTERM and SIGHUP (a closed terminal).
ctrlc = { workspace = true, features = ["termination"] }
# The launcher protocol (`rig::harness_protocol`), shared with the `rig` binary.
rig = { path = "../..", version = "0.44.0", default-features = false }
# The session kept as JSON-lines files in its directory.
rig-cassette = { workspace = true, features = ["jsonl"] }
# `reqwest`: the shared HTTP client rig-ecs connects models on.
rig-core = { workspace = true, features = ["reqwest"] }
# The agent runtime.
rig-ecs = { path = "../rig-ecs", version = "0.44.0" }
# The file and process helpers, and spill files.
rig-tools = { path = "../rig-tools", version = "0.44.0" }

[dev-dependencies]
# The terminal panel of the plugin guide's examples.
rig-activity = { path = "../../plugins/rig-activity" }
rig-tui = { path = "../../plugins/rig-tui" }
# Tool parameters derived from their arguments types, as the guide's
# plugins write them.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
