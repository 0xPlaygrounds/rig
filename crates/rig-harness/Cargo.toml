[package]
name = "rig-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "The harness of the rig coding agent on the rig-ecs kernel: the session and the launcher protocol; every other part is a Bevy plugin crate."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
# Bevy's span around every system run, which `SystemTimings` times.
trace = ["bevy_ecs/trace"]

[dependencies]
# `MinimalPlugins`, the base of `HeadlessPlugins`, and its clock.
bevy = { workspace = true }
bevy_app = { workspace = true }
# `debug` keeps the names of systems and data, which say which plugin added
# a system (`PluginSystems`) and what a stage conflict is on.
bevy_ecs = { workspace = true, features = ["debug"] }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
crossbeam-channel = { workspace = true }
# The launcher protocol, shared with the `rig` binary.
rig-harness-protocol = { path = "../rig-harness-protocol", version = "0.44.0" }
# `reqwest`: the shared HTTP client rig-ecs connects models on.
rig-core = { workspace = true, features = ["reqwest"] }
# The agent server's wire, and the client workers and views reach it with.
rig-protocol = { path = "../rig-protocol", version = "0.44.0" }
rig-client = { path = "../rig-client", version = "0.44.0" }
# The owner token the server writes to `run/token`.
getrandom = { workspace = true }
# The kernel.
rig-ecs = { path = "../rig-ecs", version = "0.44.0" }
# The session's store, kept by default in its directory (`fs`).
rig-memory = { path = "../rig-memory", version = "0.44.0", features = ["fs"] }
# The file and process helpers, and spill files.
rig-tools = { path = "../rig-tools", version = "0.44.0" }
# The tokio runtime rig's HTTP requests run on, shared with plugins.
rig-http = { path = "../rig-http", version = "0.44.0", features = ["tokio"] }
tokio = { workspace = true, features = ["rt"] }
# Questions' answers, and the user's settings for plugins.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "1"

# Signals to worker processes and their groups.
[target.'cfg(unix)'.dependencies]
# Signal handlers that install whatever disposition was inherited.
signal-hook = { workspace = true }
libc = { workspace = true }

# Ctrl-C on Windows: `termination` also catches a closed console.
[target.'cfg(windows)'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }

# A restricted worker's file sandbox.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
# The terminal panel, lists, stage sets, compaction, subagents and effect
# log of the plugin guide's examples.
rig-basics = { path = "../../plugins/rig-basics" }
rig-tui = { path = "../../plugins/rig-tui" }
# Apps, scripted models and frames for the tests.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# Tool parameters derived from their arguments types, as the guide's
# plugins write them.
schemars = { workspace = true }
# The scripted model of the tests.
rig-core = { workspace = true, features = ["test-utils"] }
