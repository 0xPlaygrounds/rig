[package]
name = "rig-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "The core of the rig coding agent on rig-ecs: the session and the launcher protocol; every other part is a Bevy plugin crate."
repository = "https://github.com/0xPlaygrounds/rig"
# Not published yet: the agent builds it from a rig checkout (RIG_SOURCE).
publish = false

[lints]
workspace = true

[dependencies]
# `MinimalPlugins`, the base of `HeadlessPlugins`, and its clock.
bevy = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
crossbeam-channel = { workspace = true }
# The clock a file watch waits on between looks.
futures-timer = { workspace = true }
# `termination` also catches SIGTERM and SIGHUP (a closed terminal).
ctrlc = { workspace = true, features = ["termination"] }
# The launcher protocol (`rig::harness_protocol`), shared with the `rig` binary.
rig = { path = "../..", version = "0.44.0", default-features = false }
# The session kept as JSON-lines files in its directory.
rig-cassette = { workspace = true, features = ["jsonl"] }
# `reqwest`: the shared HTTP client rig-ecs connects models on.
rig-core = { workspace = true, features = ["reqwest"] }
# The agent runtime.
rig-ecs = { path = "../rig-ecs", version = "0.44.0" }
# The file and process helpers, and spill files.
rig-tools = { path = "../rig-tools", version = "0.44.0" }
# The tokio runtime rig's HTTP requests run on, shared with plugins.
rig-reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
# Questions' answers, and the user's settings for plugins.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
# The terminal panel of the plugin guide's examples.
rig-activity = { path = "../../plugins/rig-activity" }
# The lists, stage sets, subagents and effect log of the plugin guide's
# examples.
rig-basics = { path = "../../plugins/rig-basics" }
rig-models = { path = "../../plugins/rig-models" }
rig-print = { path = "../../plugins/rig-print" }
rig-subagents = { path = "../../plugins/rig-subagents" }
rig-telemetry = { path = "../../plugins/rig-telemetry" }
rig-tui = { path = "../../plugins/rig-tui" }
# The plugin guide's test example.
rig-harness-test-support = { path = "../../test-support/rig-harness-test-support" }
# Tool parameters derived from their arguments types, as the guide's
# plugins write them.
schemars = { workspace = true }
# The scripted model of the headless run's tests.
rig-core = { workspace = true, features = ["test-utils"] }
