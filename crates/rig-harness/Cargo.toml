[package]
name = "rig-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "A terminal coding agent on rig-core and Bevy: agents are entities, and tools and slash commands come from Bevy plugins."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = ["tui"]
# The ratatui view. Without it the crate is the agent core alone: the agent
# loop, tools, effects and the session logs.
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:pulldown-cmark",
    "dep:unicode-width",
]

[dependencies]
base64 = { workspace = true }
bevy_app = { workspace = true }
# `serialize`: entities read from and written as JSON.
bevy_ecs = { workspace = true, features = ["serialize"] }
bevy_log = { workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
# The local date in the system prompt.
chrono = { workspace = true, features = ["clock"] }
crossbeam-channel = { workspace = true }
# `termination` also catches SIGTERM and SIGHUP (a closed terminal).
ctrlc = { workspace = true, features = ["termination"] }
futures = { workspace = true }
# The wait before a retried model call.
futures-timer = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
# The launcher protocol (`rig::harness_protocol`), shared with the `rig` binary.
rig = { path = "../..", version = "0.44.0", default-features = false }
rig-cassette = { workspace = true }
rig-core = { workspace = true, features = ["reqwest"] }
# The shared HTTP client `/login` and signed-in model calls read the
# credential through.
rig-reqwest = { workspace = true }
# The token estimate compaction decides by.
rig-memory = { path = "../rig-memory", version = "0.44.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The names of the images the session logs store.
sha2 = { workspace = true }
# The unified diff `edit` returns, and the diffs the terminal view draws.
similar = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
ratatui = { workspace = true, optional = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true, optional = true }
# Markdown in replies and the width of wrapped text, for the terminal view.
pulldown-cmark = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
