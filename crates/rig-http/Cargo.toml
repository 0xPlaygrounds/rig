[package]
name = "rig-http"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Rig's transport contracts: the HTTP client and websocket traits a transport implements, and the wasm-compatible bounds they are written with."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# `wasm_compat`'s timers. futures-timer's default backend uses a background
# timer thread, which cannot drive timers on wasm; its wasm-bindgen
# (setTimeout) backend is selected on browser wasm. WASI has neither threads
# nor a JS host, so there the timers are wstd's `wasi:clocks` pollables.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
futures-timer = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(target_os = "wasi")'.dependencies]
wstd = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[features]
# The transport-agnostic websocket contract (`ws_client`). Adds no dependency.
websocket = []
# HTTP client doubles (`test_utils`) for tests of code that sends through an
# `HttpClientExt`.
test-utils = []
