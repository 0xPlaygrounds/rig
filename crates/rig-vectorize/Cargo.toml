[package]
name = "rig-vectorize"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Cloudflare Vectorize vector store implementation for the Rig framework"
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
# This crate holds a `reqwest::Client` directly rather than an `H: HttpClientExt`,
# so the TLS backend is its own `rustls`/`native-tls` feature's choice. Without one
# of them, `reqwest` has no TLS backend and every HTTPS call to the Cloudflare API
# fails the handshake at runtime.
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
rig-reqwest = { path = "../rig-reqwest", version = "0.42.0" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[[example]]
name = "vectorize_vector_search"
required-features = ["rig-core/derive"]
