[package]
name = "rig-rmcp"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "MCP (Model Context Protocol) tool support for Rig via the rmcp SDK: MCP tools as portable rig-core tools, plus a client handler that keeps any ManagedToolSink (rig-agent's tool server, for example) in sync with the server's tool list."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
# MCP is native-only because rmcp ships no wasm-capable client transport: its
# streamable-HTTP client calls reqwest APIs absent on wasm (`redirect`,
# `pool_max_idle_per_host`), and every other transport is native by
# construction or blocked by rmcp's unconditional `Send` transport bounds.
# rmcp core itself is fine on wasm since 3.0 gated the `ClientHandler` bound
# behind `local`. The crate root raises a targeted `compile_error!` on wasm and
# carries the full rationale; scoping the SDK out of the wasm graph keeps that
# the only error.
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false, features = ["test-utils"] }
rig-agent = { path = "../rig-agent", version = "0.42.0", default-features = false, features = ["test-utils"] }
rmcp = { workspace = true, features = ["client", "server"] }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
serde_json = { workspace = true }

