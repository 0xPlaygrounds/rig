[package]
name = "rig-agent"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig's classic agent runtime."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false }
rig-derive = { path = "../rig-derive", version = "0.41.0", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

# MCP is native-only because rmcp ships no wasm-capable client transport: its
# streamable-HTTP client calls reqwest APIs absent on wasm (`redirect`,
# `pool_max_idle_per_host`), and every other transport is native by
# construction or blocked by rmcp's unconditional `Send` transport bounds.
# rmcp core itself is fine on wasm since 3.0 gated the `ClientHandler` bound
# behind `local`. Scoping the dependency out of the wasm graph keeps the wasm
# dependency tree honest; `tool/mod.rs` raises a targeted `compile_error!` if
# the feature is requested there anyway, and carries the full rationale.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rmcp = { workspace = true, optional = true, features = ["client"] }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
derive = ["dep:rig-derive", "rig-core/derive"]
test-utils = ["rig-core/test-utils"]
discord-bot = ["dep:serenity"]
rmcp = ["dep:rmcp"]
