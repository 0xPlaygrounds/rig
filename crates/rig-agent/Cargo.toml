[package]
name = "rig-agent"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig's classic agent runtime."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
rig-bedrock = { path = "../rig-bedrock", version = "0.41.0", optional = true, default-features = false }
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false }
rig-gemini-grpc = { path = "../rig-gemini-grpc", version = "0.41.0", optional = true, default-features = false }
rig-derive = { path = "../rig-derive", version = "0.41.0", optional = true }
rig-memory = { path = "../rig-memory", version = "0.41.0", optional = true, default-features = false, features = ["test-utils"] }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

[dev-dependencies]
anyhow = { workspace = true }
rig-memory = { path = "../rig-memory", version = "0.41.0", default-features = false, features = ["test-utils"] }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
derive = ["dep:rig-derive", "rig-core/derive"]
test-utils = ["rig-core/test-utils", "dep:rig-memory"]
discord-bot = ["dep:serenity"]
bedrock = ["dep:rig-bedrock", "dep:aws-sdk-bedrockruntime"]
gemini-grpc = ["dep:rig-gemini-grpc"]
