[package]
name = "rig-agent"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig's classic agent runtime."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
rig-core = { path = "../rig-core", version = "0.40.0", default-features = false }
rig-derive = { path = "../rig-derive", version = "0.40.0", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

# MCP is native-only. rmcp's `ClientHandler` requires `Send + Sync`
# unconditionally (its `local` feature relaxes only the future bounds), which
# rig's tool registry cannot satisfy on wasm, where `WasmCompatSend`/
# `WasmCompatSync` are no-op markers. Scoping the dependency out of the wasm
# graph keeps the wasm dependency tree honest; `tool/mod.rs` raises a targeted
# `compile_error!` if the feature is requested there anyway.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rmcp = { workspace = true, optional = true, features = ["client"] }

# `rig-core` relaxes its portable async bounds behind this feature. Enable it
# automatically for browser-WASM builds so `cargo check --target wasm32-unknown-unknown`
# remains a valid standalone `rig-agent` portability lane. Scoped to
# `target_os = "unknown"` (browser) rather than the whole `wasm` family — the
# same reasoning `rig-core` applies to its `futures-timer` backend, and the
# predicate the `Send`-relaxed stream aliases in `agent::prompt_request::streaming`
# must keep matching. WASI is not a supported target (see README).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rig-core = { path = "../rig-core", version = "0.40.0", default-features = false, features = ["wasm"] }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
derive = ["dep:rig-derive", "rig-core/derive"]
test-utils = ["rig-core/test-utils"]
discord-bot = ["dep:serenity"]
wasm = ["rig-core/wasm"]
rmcp = ["dep:rmcp"]
