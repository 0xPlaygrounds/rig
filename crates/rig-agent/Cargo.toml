[package]
name = "rig-agent"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig's classic agent runtime."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false }
rig-derive = { path = "../rig-derive", version = "0.41.0", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

# MCP is native-only. rmcp's `ClientHandler` requires `Send + Sync`
# unconditionally (its `local` feature relaxes only the future bounds), which
# rig's tool registry cannot satisfy on wasm, where `WasmCompatSend`/
# `WasmCompatSync` are no-op markers. Scoping the dependency out of the wasm
# graph keeps the wasm dependency tree honest; `tool/mod.rs` raises a targeted
# `compile_error!` if the feature is requested there anyway.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rmcp = { workspace = true, optional = true, features = ["client"] }

[dev-dependencies]
anyhow = { workspace = true }
# `cargo test -p rig-agent` needs rig-core's mock models even when the
# `test-utils` feature is not requested explicitly.
rig-core = { path = "../rig-core", features = ["test-utils"] }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
derive = ["dep:rig-derive", "rig-core/derive"]
test-utils = ["rig-core/test-utils"]
discord-bot = ["dep:serenity"]
rmcp = ["dep:rmcp"]
