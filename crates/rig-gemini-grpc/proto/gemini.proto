// The Gemini gRPC API proto for Rig.
//
// IMPORTANT: Field numbers and wire types are aligned with Google's official
// `google.ai.generativelanguage.v1beta` protos so the generated Rust types
// are gRPC-wire-compatible. Requests are the shared REST encoder's JSON
// transcoded, and replies are read through their canonical proto3 JSON, so
// every request field the REST encoder can emit, and every reply field the
// REST decoder reads, is declared here.
//
// Reference sources (field numbers/types):
// - google/ai/generativelanguage/v1beta/content.proto
// - google/ai/generativelanguage/v1beta/generative_service.proto

syntax = "proto3";

package google.ai.generativelanguage.v1beta;

service GenerativeService {
  rpc GenerateContent(GenerateContentRequest) returns (GenerateContentResponse);
  rpc StreamGenerateContent(GenerateContentRequest) returns (stream GenerateContentResponse);
  rpc EmbedContent(EmbedContentRequest) returns (EmbedContentResponse);
}

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ================================================================
// Shared types
// ================================================================

// Data type enum used by Schema (matches content.proto). The REST encoder
// spells types in lowercase, as JSON Schema does and the REST API reads;
// the aliases let the same JSON transcode.
enum Type {
  option allow_alias = true;
  TYPE_UNSPECIFIED = 0;
  STRING = 1;
  NUMBER = 2;
  INTEGER = 3;
  BOOLEAN = 4;
  ARRAY = 5;
  OBJECT = 6;
  NULL = 7;
  string = 1;
  number = 2;
  integer = 3;
  boolean = 4;
  array = 5;
  object = 6;
  null = 7;
}

message Content {
  repeated Part parts = 1;
  string role = 2;
}

message Part {
  oneof data {
    string text = 2;
    Blob inline_data = 3;
    FunctionCall function_call = 4;
    FunctionResponse function_response = 5;
    FileData file_data = 6;
    ExecutableCode executable_code = 9;
    CodeExecutionResult code_execution_result = 10;
  }
  oneof metadata {
    VideoMetadata video_metadata = 14;
  }

  bool thought = 11;
  bytes thought_signature = 13;
  google.protobuf.Struct part_metadata = 8;
}

message VideoMetadata {
  google.protobuf.Duration start_offset = 1;
  google.protobuf.Duration end_offset = 2;
  double fps = 3;
}

message Blob {
  string mime_type = 1;
  bytes data = 2;
}

message FileData {
  string mime_type = 1;
  string file_uri = 2;
}

message FunctionCall {
  string name = 1;
  optional google.protobuf.Struct args = 2;
  string id = 3;
}

message FunctionResponse {
  enum Scheduling {
    SCHEDULING_UNSPECIFIED = 0;
    SILENT = 1;
    WHEN_IDLE = 2;
    INTERRUPT = 3;
  }

  string name = 1;
  google.protobuf.Struct response = 2;
  string id = 3;
  bool will_continue = 4;
  optional Scheduling scheduling = 5;
  repeated FunctionResponsePart parts = 8;
}

message FunctionResponsePart {
  oneof data {
    FunctionResponseBlob inline_data = 1;
  }
}

message FunctionResponseBlob {
  string mime_type = 1;
  bytes data = 2;
}

message ExecutableCode {
  enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    PYTHON = 1;
  }
  Language language = 1;
  string code = 2;
}

message CodeExecutionResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_OK = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_DEADLINE_EXCEEDED = 3;
  }
  Outcome outcome = 1;
  string output = 2;
}

// ================================================================
// Tools
// ================================================================

message Tool {
  message GoogleSearch {
    Interval time_range_filter = 2;
  }
  message ComputerUse {
    enum Environment {
      ENVIRONMENT_UNSPECIFIED = 0;
      ENVIRONMENT_BROWSER = 1;
    }
    Environment environment = 3;
    repeated string excluded_predefined_functions = 5;
  }
  repeated FunctionDeclaration function_declarations = 1;
  GoogleSearchRetrieval google_search_retrieval = 2;
  CodeExecution code_execution = 3;
  GoogleSearch google_search = 4;
  ComputerUse computer_use = 6;
  UrlContext url_context = 8;
  FileSearch file_search = 9;
  GoogleMaps google_maps = 11;
}

// Mirrors google.type.Interval.
message Interval {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

// Mirrors google.type.LatLng.
message LatLng {
  double latitude = 1;
  double longitude = 2;
}

message GoogleMaps {
  bool enable_widget = 1;
}

message UrlContext {}

message FileSearch {
  message RetrievalResource {
    string rag_store_name = 1;
  }
  message RetrievalConfig {
    optional int32 top_k = 1;
    string metadata_filter = 3;
  }
  repeated RetrievalResource retrieval_resources = 1;
  RetrievalConfig retrieval_config = 2;
}

message GoogleSearchRetrieval {
  DynamicRetrievalConfig dynamic_retrieval_config = 1;
}

message DynamicRetrievalConfig {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_DYNAMIC = 1;
  }
  Mode mode = 1;
  optional float dynamic_threshold = 2;
}

message CodeExecution {}

message ToolConfig {
  FunctionCallingConfig function_calling_config = 1;
  RetrievalConfig retrieval_config = 2;
}

message RetrievalConfig {
  LatLng lat_lng = 1;
  string language_code = 2;
}

message FunctionCallingConfig {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    AUTO = 1;
    ANY = 2;
    NONE = 3;
    VALIDATED = 4;
  }
  Mode mode = 1;
  repeated string allowed_function_names = 2;
}

message FunctionDeclaration {
  enum Behavior {
    UNSPECIFIED = 0;
    BLOCKING = 1;
    NON_BLOCKING = 2;
  }
  string name = 1;
  string description = 2;
  optional Schema parameters = 3;
  optional google.protobuf.Value parameters_json_schema = 6;
  optional Schema response = 4;
  optional google.protobuf.Value response_json_schema = 7;
  Behavior behavior = 5;
}

message Schema {
  Type type = 1;
  string format = 2;
  string title = 24;
  string description = 3;
  bool nullable = 4;
  repeated string enum = 5;
  optional Schema items = 6;
  int64 max_items = 21;
  int64 min_items = 22;
  map<string, Schema> properties = 7;
  repeated string required = 8;
  int64 min_properties = 9;
  int64 max_properties = 10;
  optional double minimum = 11;
  optional double maximum = 12;
  int64 min_length = 13;
  int64 max_length = 14;
  string pattern = 15;
  google.protobuf.Value example = 16;
  repeated Schema any_of = 18;
  repeated string property_ordering = 23;
  google.protobuf.Value default = 25;
}

// ================================================================
// Safety
// ================================================================

message SafetySetting {
  enum HarmBlockThreshold {
    HARM_BLOCK_THRESHOLD_UNSPECIFIED = 0;
    BLOCK_LOW_AND_ABOVE = 1;
    BLOCK_MEDIUM_AND_ABOVE = 2;
    BLOCK_ONLY_HIGH = 3;
    BLOCK_NONE = 4;
    OFF = 5;
  }
  HarmCategory category = 3;
  HarmBlockThreshold threshold = 4;
}

message PromptFeedback {
  enum BlockReason {
    BLOCK_REASON_UNSPECIFIED = 0;
    SAFETY = 1;
    OTHER = 2;
    BLOCKLIST = 3;
    PROHIBITED_CONTENT = 4;
    IMAGE_SAFETY = 5;
  }

  BlockReason block_reason = 1;
  repeated SafetyRating safety_ratings = 2;
}

// ================================================================
// Generation
// ================================================================

message PrebuiltVoiceConfig {
  optional string voice_name = 1;
}

message VoiceConfig {
  oneof voice_config {
    PrebuiltVoiceConfig prebuilt_voice_config = 1;
  }
}

message SpeakerVoiceConfig {
  string speaker = 1;
  VoiceConfig voice_config = 2;
}

message MultiSpeakerVoiceConfig {
  repeated SpeakerVoiceConfig speaker_voice_configs = 2;
}

message SpeechConfig {
  VoiceConfig voice_config = 1;
  MultiSpeakerVoiceConfig multi_speaker_voice_config = 3;
  string language_code = 2;
}

message ThinkingConfig {
  // The REST encoder spells levels in lowercase, which the REST API reads;
  // the aliases let the same JSON transcode.
  enum ThinkingLevel {
    option allow_alias = true;
    THINKING_LEVEL_UNSPECIFIED = 0;
    LOW = 1;
    MEDIUM = 2;
    HIGH = 3;
    MINIMAL = 4;
    low = 1;
    medium = 2;
    high = 3;
    minimal = 4;
  }
  optional bool include_thoughts = 1;
  optional int32 thinking_budget = 2;
  optional ThinkingLevel thinking_level = 4;
}

message ImageConfig {
  optional string aspect_ratio = 1;
  optional string image_size = 2;
}

message GenerationConfig {
  enum Modality {
    MODALITY_UNSPECIFIED = 0;
    TEXT = 1;
    IMAGE = 2;
    AUDIO = 3;
  }
  enum MediaResolution {
    MEDIA_RESOLUTION_UNSPECIFIED = 0;
    MEDIA_RESOLUTION_LOW = 1;
    MEDIA_RESOLUTION_MEDIUM = 2;
    MEDIA_RESOLUTION_HIGH = 3;
  }
  optional int32 candidate_count = 1;
  repeated string stop_sequences = 2;
  optional int32 max_output_tokens = 4;
  optional float temperature = 5;
  optional float top_p = 6;
  optional int32 top_k = 7;
  optional int32 seed = 8;
  string response_mime_type = 13;
  Schema response_schema = 14;
  google.protobuf.Value response_json_schema = 24 [json_name = "_responseJsonSchema"];
  google.protobuf.Value response_json_schema_ordered = 28 [json_name = "responseJsonSchema"];
  optional float presence_penalty = 15;
  optional float frequency_penalty = 16;
  optional bool response_logprobs = 17;
  optional int32 logprobs = 18;
  optional bool enable_enhanced_civic_answers = 19;
  repeated Modality response_modalities = 20;
  optional SpeechConfig speech_config = 21;
  optional ThinkingConfig thinking_config = 22;
  optional ImageConfig image_config = 27;
  optional MediaResolution media_resolution = 23;
}

message GenerateContentRequest {
  string model = 1;
  optional Content system_instruction = 8;
  repeated Content contents = 2;
  repeated Tool tools = 5;
  ToolConfig tool_config = 7;
  repeated SafetySetting safety_settings = 3;
  optional GenerationConfig generation_config = 4;
  optional string cached_content = 9;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  DOCUMENT = 5;
}

message ModalityTokenCount {
  Modality modality = 1;
  int32 token_count = 2;
}

message UsageMetadata {
  int32 prompt_token_count = 1;
  int32 candidates_token_count = 2;
  int32 total_token_count = 3;
  int32 cached_content_token_count = 4;
  repeated ModalityTokenCount prompt_tokens_details = 5;
  repeated ModalityTokenCount cache_tokens_details = 6;
  repeated ModalityTokenCount candidates_tokens_details = 7;
  int32 tool_use_prompt_token_count = 8;
  repeated ModalityTokenCount tool_use_prompt_tokens_details = 9;
  int32 thoughts_token_count = 10;
}

message Candidate {
  enum FinishReason {
    FINISH_REASON_UNSPECIFIED = 0;
    STOP = 1;
    MAX_TOKENS = 2;
    SAFETY = 3;
    RECITATION = 4;
    OTHER = 5;
    LANGUAGE = 6;
    BLOCKLIST = 7;
    PROHIBITED_CONTENT = 8;
    SPII = 9;
    MALFORMED_FUNCTION_CALL = 10;
    IMAGE_SAFETY = 11;
    UNEXPECTED_TOOL_CALL = 12;
    TOO_MANY_TOOL_CALLS = 13;
    IMAGE_PROHIBITED_CONTENT = 14;
    IMAGE_OTHER = 15;
    NO_IMAGE = 16;
    IMAGE_RECITATION = 17;
  }

  Content content = 1;
  FinishReason finish_reason = 2;
  optional int32 index = 3;
  optional string finish_message = 4;
  repeated SafetyRating safety_ratings = 5;
  CitationMetadata citation_metadata = 6;
  int32 token_count = 7;
  double avg_logprobs = 10;
  LogprobsResult logprobs_result = 11;
}

message LogprobsResult {
  message Candidate {
    optional string token = 1;
    optional int32 token_id = 3;
    optional float log_probability = 2;
  }

  message TopCandidates {
    repeated Candidate candidates = 1;
  }

  optional float log_probability_sum = 3;
  repeated TopCandidates top_candidates = 1;
  repeated Candidate chosen_candidates = 2;
}

// Mirrors safety.proto.
enum HarmCategory {
  HARM_CATEGORY_UNSPECIFIED = 0;
  HARM_CATEGORY_DEROGATORY = 1;
  HARM_CATEGORY_TOXICITY = 2;
  HARM_CATEGORY_VIOLENCE = 3;
  HARM_CATEGORY_SEXUAL = 4;
  HARM_CATEGORY_MEDICAL = 5;
  HARM_CATEGORY_DANGEROUS = 6;
  HARM_CATEGORY_HARASSMENT = 7;
  HARM_CATEGORY_HATE_SPEECH = 8;
  HARM_CATEGORY_SEXUALLY_EXPLICIT = 9;
  HARM_CATEGORY_DANGEROUS_CONTENT = 10;
  HARM_CATEGORY_CIVIC_INTEGRITY = 11;
}

message SafetyRating {
  enum HarmProbability {
    HARM_PROBABILITY_UNSPECIFIED = 0;
    NEGLIGIBLE = 1;
    LOW = 2;
    MEDIUM = 3;
    HIGH = 4;
  }

  HarmCategory category = 3;
  HarmProbability probability = 4;
  bool blocked = 5;
}

// Mirrors citation.proto.
message CitationMetadata {
  repeated CitationSource citation_sources = 1;
}

message CitationSource {
  optional int32 start_index = 1;
  optional int32 end_index = 2;
  optional string uri = 3;
  optional string license = 4;
}

message GenerateContentResponse {
  repeated Candidate candidates = 1;
  PromptFeedback prompt_feedback = 2;
  UsageMetadata usage_metadata = 3;
  string model_version = 4;
  string response_id = 5;
}

// ================================================================
// Embeddings
// ================================================================

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  RETRIEVAL_QUERY = 1;
  RETRIEVAL_DOCUMENT = 2;
  SEMANTIC_SIMILARITY = 3;
  CLASSIFICATION = 4;
  CLUSTERING = 5;
  QUESTION_ANSWERING = 6;
  FACT_VERIFICATION = 7;
}

message EmbedContentRequest {
  string model = 1;
  Content content = 2;
  optional TaskType task_type = 3;
  optional string title = 4;
  optional int32 output_dimensionality = 5;
}

message ContentEmbedding {
  repeated float values = 1;
}

message EmbedContentResponse {
  ContentEmbedding embedding = 1;
}
