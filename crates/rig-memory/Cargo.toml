[package]
name = "rig-memory"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Conversations over time for the Rig agent framework: recent messages, compaction, and saving and resuming sessions."
repository = "https://github.com/0xPlaygrounds/rig"
# Frozen sessions older formats wrote, read by the upgrade test only.
exclude = ["fixtures/"]

[lints]
workspace = true

[features]
default = []
# `DirStore`: a session kept as files in a directory (std::fs).
fs = []

[dependencies]
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The names of the blobs a session stores images in.
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "recent_messages_and_compaction"
