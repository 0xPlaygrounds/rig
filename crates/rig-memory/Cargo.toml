[package]
name = "rig-memory"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Conversation memory policies (sliding window, token budget, ...) and a file backend for the Rig agent framework."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# `FileConversationMemory`: conversations stored as JSON Lines files. Native
# targets only; on wasm the feature compiles to nothing.
file = ["dep:serde_json", "dep:sha2", "dep:thiserror", "dep:tokio"]

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", features = ["reqwest"] }
anyhow = { workspace = true }
assert_fs = { workspace = true }
rig-agent.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[[example]]
name = "agent_with_memory_policies"
required-features = []
