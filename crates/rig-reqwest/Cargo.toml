[package]
name = "rig-reqwest"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "The bundled reqwest HTTP transport for Rig, plus the default-transport conveniences the `rig` facade re-exports."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
reqwest = { workspace = true, features = ["json", "stream", "multipart"] }
reqwest-middleware = { workspace = true, optional = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
] }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# The bundled transport needs a tokio reactor on native. When the caller has
# none (Bevy task pools, smol, futures::executor), `runtime` lazily starts a
# single-threaded fallback runtime and drives reqwest futures there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false, features = ["test-utils"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tokio-test = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[example]]
name = "cohere_image_embeddings"
required-features = ["cohere"]

[features]
default = ["rustls"]
providers-all = [
  # Forwarded explicitly: rig-core keys its full-surface lint coverage off its
  # own `providers-all` (the `cfg_attr(not(providers-all), allow(dead_code, ...))`
  # sites), and enabling the 26 features one by one does not turn that on.
  # Without this line `cargo clippy -p rig-reqwest --features providers-all`
  # silently lints rig-core with those allows still active.
  "rig-core/providers-all",
  "anthropic",
  "azure",
  "chatgpt",
  "cohere",
  "copilot",
  "deepseek",
  "doubleword",
  "gemini",
  "groq",
  "huggingface",
  "hyperbolic",
  "llamacpp",
  "minimax",
  "mira",
  "mistral",
  "moonshot",
  "ollama",
  "openai",
  "openrouter",
  "perplexity",
  "together",
  "venice",
  "voyageai",
  "xai",
  "xiaomimimo",
  "zai",
]
anthropic = ["rig-core/anthropic"]
azure = ["rig-core/azure"]
chatgpt = ["rig-core/chatgpt"]
cohere = ["rig-core/cohere"]
copilot = ["rig-core/copilot"]
deepseek = ["rig-core/deepseek"]
doubleword = ["rig-core/doubleword"]
gemini = ["rig-core/gemini"]
groq = ["rig-core/groq"]
huggingface = ["rig-core/huggingface"]
hyperbolic = ["rig-core/hyperbolic"]
llamacpp = ["rig-core/llamacpp"]
minimax = ["rig-core/minimax"]
mira = ["rig-core/mira"]
mistral = ["rig-core/mistral"]
moonshot = ["rig-core/moonshot"]
ollama = ["rig-core/ollama"]
openai = ["rig-core/openai"]
openrouter = ["rig-core/openrouter"]
perplexity = ["rig-core/perplexity"]
together = ["rig-core/together"]
venice = ["rig-core/venice"]
voyageai = ["rig-core/voyageai"]
xai = ["rig-core/xai"]
xiaomimimo = ["rig-core/xiaomimimo"]
zai = ["rig-core/zai"]
socks = ["reqwest/socks"]
# Provider-aware conveniences need the same feature surface as rig-core's
# optional modalities.
audio = ["rig-core/audio"]
image = ["rig-core/image"]
# `websocket` is a convenience alias for the rustls flavor. The module itself
# is gated on either flavor, so `websocket-native-tls` alone works too.
websocket = ["websocket-rustls"]
websocket-rustls = [
  "openai",
  "dep:tokio-tungstenite",
  "tokio-tungstenite/connect",
  "rustls",
]
websocket-native-tls = [
  "openai",
  "dep:tokio-tungstenite",
  "tokio-tungstenite/connect",
  "native-tls",
]
rustls = [
  "reqwest/rustls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "tokio-tungstenite?/rustls-tls-webpki-roots",
]
native-tls = [
  "reqwest/native-tls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "tokio-tungstenite?/native-tls",
]
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-rustls = ["dep:reqwest-middleware", "rustls", "reqwest-middleware/rustls"]
reqwest-middleware-native-tls = ["dep:reqwest-middleware", "native-tls"]
