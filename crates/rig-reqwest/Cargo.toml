[package]
name = "rig-reqwest"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "The bundled reqwest HTTP transport for Rig, plus the default-transport conveniences the `rig` facade re-exports."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
reqwest = { workspace = true, features = ["json", "stream", "multipart"] }
reqwest-middleware = { workspace = true, optional = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
] }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# The bundled transport needs a tokio reactor on native. When the caller has
# none (Bevy task pools, smol, futures::executor), `runtime` lazily starts a
# single-threaded fallback runtime and drives reqwest futures there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false, features = ["test-utils"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
# TLS: enable exactly one of `rustls` (the default) and `native-tls`. They are
# additive, so enabling both compiles both stacks and reqwest — not rig — picks
# which one a client uses. There is deliberately no `compile_error!` for the
# pair: `--all-features` enables it, and that is the lane CI's clippy, test and
# doc jobs run in, so the guard would break the build it is meant to protect.
# The websocket axis in `rig-tungstenite` is documented the same way, for the
# related reason that additive features cannot express "replace stack A with B".
#
# Unlike that axis, a single-stack build here is reachable for every selector:
# `--no-default-features --features native-tls` and
# `--no-default-features --features reqwest-middleware-native-tls` both resolve
# to native-tls with no rustls in the tree.
#
# `reqwest-middleware` shares its name with the optional dependency it enables
# (`dep:reqwest-middleware`). That is legal, and it is the name the `rig` facade
# forwards, so it stays.
default = ["rustls"]
socks = ["reqwest/socks"]
# Provider-aware conveniences need the same feature surface as rig-core's
# optional modalities.
audio = ["rig-core/audio"]
image = ["rig-core/image"]
rustls = [
  "reqwest/rustls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
]
native-tls = [
  "reqwest/native-tls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
]
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-rustls = ["dep:reqwest-middleware", "rustls", "reqwest-middleware/rustls"]
reqwest-middleware-native-tls = ["dep:reqwest-middleware", "native-tls"]
