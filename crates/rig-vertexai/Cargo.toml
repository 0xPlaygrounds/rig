[package]
name = "rig-vertexai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "VertexAI model provider for Rig integration."

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
futures = { workspace = true }
google-cloud-aiplatform-v1 = { workspace = true }
google-cloud-auth = { workspace = true }
google-cloud-gax = { workspace = true }
rig-core = { path = "../rig-core", version = "0.45.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
rig-history-conformance = { path = "../../test-support/rig-history-conformance" }
rig-core = { path = "../rig-core", version = "0.45.0", features = ["reqwest", "test-utils"] }
anyhow = { workspace = true }
http = { workspace = true }
rig-agent.workspace = true
schemars = { workspace = true }
tracing-subscriber = { workspace = true }
