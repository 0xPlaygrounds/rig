[package]
name = "rig-postgres"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
description = "PostgreSQL-based vector store implementation for the rig framework"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[features]
default = []
# `PostgresSessionStore`: rig-memory sessions kept in PostgreSQL.
memory = ["dep:rig-memory"]

[dependencies]
rig-core = { path = "../rig-core", version = "0.46.0", default-features = false, features = [
  "derive",
] }
rig-memory = { path = "../rig-memory", version = "0.46.0", optional = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

sqlx = { workspace = true, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "json",
] }
pgvector = { workspace = true, features = ["sqlx"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.46.0", features = ["reqwest"] }
anyhow = { workspace = true }
log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


testcontainers = { workspace = true }
httpmock = { workspace = true }

dotenvy = { workspace = true }

[[example]]
name = "session_store_postgres"
required-features = ["memory"]
