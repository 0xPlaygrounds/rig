[package]
name = "rig-run"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "The sans-IO agent-run protocol for Rig: data and state transitions; drivers perform the IO."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
http = { workspace = true }
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rig-core = { path = "../rig-core", features = ["test-utils"] }
