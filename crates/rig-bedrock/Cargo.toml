[package]
name = "rig-bedrock"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "AWS Bedrock model provider for Rig integration."

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
# The generated `rustls` feature selects AWS's legacy Hyper 0.14 connector.
aws-sdk-bedrockruntime = { workspace = true, features = ["rt-tokio", "default-https-client"] }
aws-smithy-eventstream = { workspace = true }
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true }
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false, features = [
    "image",
] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rig-history-conformance = { path = "../../test-support/rig-history-conformance" }
anyhow = { workspace = true }
# Harness signal: rig-core's sequence laws panic (not just log) in this
# crate's own tests.
rig-derive = { path = "../rig-derive", version = "0.43.0" }
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false, features = [
    "image",
    "test-utils",
] }
rig-agent.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
tracing-subscriber = { workspace = true }
