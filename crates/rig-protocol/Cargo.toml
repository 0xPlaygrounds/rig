[package]
name = "rig-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The wire of the rig agent server: JSON-RPC 2.0 frames as NDJSON, its methods, events, grants and versions, and the local transport."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
# preserve_order: a frame re-serializes with its keys in the order read,
# so the version fixtures round-trip byte for byte.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

# The peer's uid on the owner socket (`SO_PEERCRED`, `getpeereid`).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The owner-only named pipe: interprocess's pipes with a DACL naming this
# user's SID, which windows-sys reads from the process token.
[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
