[package]
name = "rig-a2a"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "Serve Rig agents over the Agent2Agent (A2A) protocol: an Axum router with the agent card, JSON-RPC and HTTP+JSON bindings, streaming, and task get and cancel, built on the official A2A Rust SDK."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# A2A serving is native-only: the SDK's server runs on tokio and axum. The
# crate root raises a targeted `compile_error!` on wasm; keeping the server
# stack out of the wasm graph keeps that the only error.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-agent = { path = "../rig-agent", version = "0.44.0", default-features = false }
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false }
a2a = { workspace = true }
a2a-server = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rig-agent = { path = "../rig-agent", version = "0.44.0", default-features = false, features = ["test-utils"] }
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false, features = [
    "reqwest",
    "rustls",
    "test-utils",
] }
a2a-client = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[example]]
name = "a2a_server"
