[package]
name = "rig-weaviate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Rig vector store index integration for Weaviate. https://weaviate.io"
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.44.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The bundled HTTP transport that `WeaviateVectorStore::new` sends through.
rig-reqwest = { path = "../rig-reqwest", version = "0.44.0", optional = true, default-features = false }

[features]
default = ["reqwest", "rustls"]
reqwest = ["dep:rig-reqwest"]
# TLS for the bundled transport. `rustls` adds no dependency by itself: it
# selects the TLS stack of the transport the `reqwest` feature brings in.
rustls = ["rig-reqwest?/rustls"]
native-tls = ["rig-reqwest?/native-tls"]

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.44.0", features = ["reqwest", "test-utils"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "vector_search_weaviate"
required-features = ["rig-core/derive"]
