# `NEXTEST_TEST_THREADS`, the run's computed thread count that the wire test
# encodes on, is set for tests from 0.9.130.
nextest-version = { required = "0.9.130" }

# The pinned request bodies of every wire are the slowest test in the run.
# It encodes on as many threads as the run has (`NEXTEST_TEST_THREADS`), so
# it holds every slot and the run stays within `--test-threads`. Nextest
# starts tests strictly in order, and one that needs every slot waits for all
# running ones, so it goes first, while every slot is free.
[[profile.default.overrides]]
filter = 'binary_id(rig::integration) & test(=core::request_bodies::tests::every_wire_sends_the_pinned_bodies)'
priority = 100
threads-required = "num-test-threads"

# A test that runs past a minute is reported as slow, and killed after three:
# a hang fails in minutes and names itself, not when the CI job times out.
# The suites that start a nested Cargo build (ignored tests the compile
# guards run), trybuild or Docker containers get longer.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = '''
    package(rig-service-tests)
    | (binary_id(rig::integration) & test(=core::request_bodies::tests::every_wire_sends_the_pinned_bodies))
    | (binary_id(rig-derive::integration) & test(/^ui::/))
    | (kind(test) & test(/(^|::)(middleware_features|agent_run_stepper|macro_hygiene|dependency_rename)::/))
'''
slow-timeout = { period = "120s", terminate-after = 10 }

# Preserve CI retries for ordinary tests while running drift tripwires once.
# Do not pass --retries to the guards run: it overrides per-test settings.
[profile.guards]
retries = 2

[[profile.guards.overrides]]
filter = 'test(telemetry::) + test(span_safety_net::)'
retries = 0

# The inner loop: skips the service suites (`rig-service-tests`, mostly
# Docker-backed) and the trybuild cases. The nested-Cargo guards are ignored
# tests, so no run reaches them but `--run-ignored`.
[profile.local]
retries = 0
fail-fast = true
default-filter = 'not (package(rig-service-tests) | (binary_id(rig-derive::integration) & test(=ui::ui_cases)))'
