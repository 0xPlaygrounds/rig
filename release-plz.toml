[workspace]
git_release_body = """{{ changelog }}"""
git_release_enable = false
git_tag_enable = false
# Publish whenever a crate's manifest version is ahead of crates.io, on any
# push to main — not only on the release-PR merge commit. With `false`, a
# publish that fails for a reason unrelated to the code (v0.42.0: an empty
# `CARGO_REGISTRY_TOKEN`) is stranded: every later push logs "current commit
# is not from a release PR" and nothing ever retries, while the queued run
# from the previous push opens a stale duplicate release PR (#2360). With
# `true` the next push simply publishes the version main already declares,
# and a version whose crates are all on crates.io is a no-op.
release_always = true

[[package]]
name = "rig"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"

[changelog]
body = """
## [{{ version }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

    {% for commit in commits %}
        {%- if commit.scope -%}
            - *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}\
                {{ commit.message }}{{ self::username(commit=commit) }}\
                {%- if commit.links %} \
                    ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%})\
                {% endif %}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{{ self::username(commit=commit) }}{{ self::pr(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
{%- if remote.contributors %}
### Contributors
{% for contributor in remote.contributors %}
    * [{{ contributor.username }}](https://github.com/{{ contributor.username }})
{%- endfor %}
{% endif -%}
{%- macro username(commit) -%}
    {% if commit.remote.username %} (by [{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})){% endif -%}
{% endmacro -%}
{%- macro pr(commit) -%}
    {% if commit.remote.pr_number %} - #{{ commit.remote.pr_number }}{% endif -%}
{% endmacro -%}
"""
